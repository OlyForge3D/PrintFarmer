# git-cliff configuration (optional future integration)
[changelog]
header = "# Changelog\n"
body = "{{#each commits}}{{#if conventional}}
- {{type}}: {{message}} ({{hash}})
{{/if}}{{/each}}"
trim = true
footer = "\nGenerated by git-cliff"

[git]
conventional_commits = true
filter_commits = true
commit_preprocessors = []

[parsers]
[[parsers.commit_types]]
name = "feat"
description = "Features"
[[parsers.commit_types]]
name = "fix"
description = "Bug Fixes"
[[parsers.commit_types]]
name = "docs"
description = "Documentation"
[[parsers.commit_types]]
name = "refactor"
description = "Refactoring"
