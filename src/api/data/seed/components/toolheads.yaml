# PrintFarmer Toolhead Models Seed Data
# Format: YAML (human-readable, supports comments)
# Schema: printfarmer/components/toolheads/v1
#
# This file defines toolhead model specifications for seeding the database.
# Users can customize this file without recompiling the application.
#
# Field Descriptions:
# - name: Toolhead model name (must be unique per manufacturer)
# - manufacturer: Manufacturer name (must match entry in manufacturers.yaml, or null for community designs)
# - description: Brief description of the toolhead model and its characteristics
# - url: Product or information URL (optional)
# - defaultHotend: Name of the default hotend component (must match entry in hotends.yaml)
# - defaultExtruder: Name of the default extruder component (must match entry in extruders.yaml)
# - defaultNozzle: Name of the default nozzle component (must match entry in nozzles.yaml)

# Prusa Toolheads
- name: MK3S Toolhead
