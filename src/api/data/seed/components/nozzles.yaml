# PrintFarmer Nozzle Models Seed Data
# Format: YAML (human-readable, supports comments)
# Schema: printfarmer/components/nozzles/v1
#
# This file defines nozzle model specifications for seeding the database.
# Users can customize this file without recompiling the application.
#
# Field Descriptions:
# - name: Nozzle model name (must be unique per manufacturer)
# - manufacturer: Manufacturer name (must match entry in manufacturers.yaml)
# - maxTemp: Maximum operating temperature in °C
# - nozzleType: Material type (Brass, HardenedSteel, StainlessSteel, Abrasive, TungstenCarbide)
# - nozzleInterface: Thread/mount type (V6, Volcano, Revo, Proprietary)
# - description: Brief description of the nozzle model and its characteristics
# - url: Product or information URL (optional)

# Generic Nozzles - V6 Interface (standard E3D-style thread)
- name: Brass Nozzle
  manufacturer: Generic
  maxTemp: 300
  nozzleType: Brass
  nozzleInterface: V6
  description: Standard brass nozzle, not suitable for abrasive filaments

- name: Hardened Steel Nozzle
  manufacturer: Generic
  maxTemp: 500
  nozzleType: HardenedSteel
  nozzleInterface: V6
  description: Generic hardened steel nozzle for abrasive filaments

- name: Stainless Steel Nozzle
  manufacturer: Generic
  maxTemp: 300
  nozzleType: StainlessSteel
  nozzleInterface: V6
  description: Generic stainless steel nozzle

