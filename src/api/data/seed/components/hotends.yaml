# PrintFarmer Hotend Models Seed Data
# Format: YAML (human-readable, supports comments)
# Schema: printfarmer/components/hotends/v1
#
# This file defines hotend model specifications for seeding the database.
# Users can customize this file without recompiling the application.
#
# Field Descriptions:
# - name: Hotend model name (must be unique per manufacturer)
# - manufacturer: Manufacturer name (must match entry in manufacturers.yaml)
# - maxTemp: Maximum operating temperature in °C
# - isHighFlow: true if hotend is optimized for high volumetric flow rates
# - description: Brief description of the hotend model and its characteristics
# - url: Product or information URL (optional)

