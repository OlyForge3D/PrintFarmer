# PrintFarmer Printer Models Seed Data
# Format: YAML (human-readable, supports comments)
# Schema: printfarmer/printer-models/v1
#
# This file defines printer model specifications for seeding the database.
# Users can customize this file without recompiling the application.
#
# Field Descriptions:
# - name: Model name (must be unique per manufacturer)
# - manufacturer: Manufacturer name (must match entry in manufacturers.yaml)
# - buildVolume: Print volume dimensions in millimeters
#   - x: Width (left to right)
#   - y: Depth (front to back)
#   - z: Height (bottom to top)
# - defaultBackend: Default printer backend type (Moonraker, PrusaLink, SDCP, OctoPrint)
# - motionType: Motion system type (Cartesian, CoreXY, Delta, Unknown)
# - hasHeatedBed: true if printer has a heated bed
# - hasEnclosure: true if printer has an enclosure
# - multiMaterial: true if printer supports multi-material printing
# - numberOfExtruders: Number of extruders/toolheads
# - supportsAutoLeveling: true if printer has automatic bed leveling
# - maxBedTemp: Maximum bed temperature in °C (optional)
# - maxPrintSpeed: Maximum print speed in mm/s (optional)
# - supportedMaterials: List of compatible filament types (references filament-types.yaml)
# - aliases: List of slicer-specific model names for compatibility
#   - slicerModelName: Model name as it appears in slicer
#   - slicerType: Slicer software name (OrcaSlicer, PrusaSlicer, etc.)

# Unknown/Generic Model
- name: Unknown Model
  manufacturer: Unknown
  buildVolume:
    x: 200
    y: 200
    z: 200
  defaultBackend: null
  motionType: Unknown
  hasHeatedBed: true
  hasEnclosure: false
  multiMaterial: false
  numberOfExtruders: 1
  supportsAutoLeveling: false
  maxBedTemp: 120
  maxPrintSpeed: 100
  supportedMaterials:
    - PLA
    - PETG
    - ABS

