# PrintFarmer Extruder Models Seed Data
# Format: YAML (human-readable, supports comments)
# Schema: printfarmer/components/extruders/v1
#
# This file defines extruder model specifications for seeding the database.
# Users can customize this file without recompiling the application.
#
# Field Descriptions:
# - name: Extruder model name (must be unique per manufacturer)
# - manufacturer: Manufacturer name (must match entry in manufacturers.yaml)
# - gearRatio: Gear reduction ratio (e.g., "3:1", "5.18:1", "7.5:1")
# - isDirectDrive: true if extruder is mounted on the toolhead, false for bowden
# - description: Brief description of the extruder model and its characteristics
# - url: Product or information URL (optional)

