# PrintFarmer Filament Type Seed Data
# Schema: printfarmer/filament-types/v1
#
# This file defines supported filament types with default temperature settings,
# material characteristics, cost, and density data.
#
# Format:
# - name: Filament type name (e.g., "PLA", "PETG", "ABS")
#   defaultHotendTemp: Default hotend temperature in Celsius
#   defaultBedTemp: Default bed temperature in Celsius
#   isAbrasive: Whether filament contains abrasive particles (requires hardened nozzle)
#   needsEnclosure: Whether filament requires an enclosure for optimal printing
#   defaultPricePerKg: Default price per kg in USD (market average, mainstream vendors)
#   defaultDensity: Material density in g/cm³

