<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background circle for visual consistency -->
  <defs>
    <linearGradient id="prusaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Prusa Link orange/red color scheme -->
  <!-- Main printer body -->
  <rect x="40" y="50" width="120" height="80" rx="6" fill="#FF6B35" opacity="0.9"/>
  
  <!-- Printer top section (nozzle area) -->
  <rect x="55" y="35" width="30" height="20" rx="3" fill="#FF6B35"/>
  
  <!-- Print bed -->
  <rect x="50" y="95" width="100" height="25" rx="3" fill="#FF8C42" opacity="0.7"/>
  
  <!-- Nozzle indicator -->
  <circle cx="70" cy="35" r="4" fill="#FFB84D"/>
  
  <!-- Control panel lights (3 dots indicating status) -->
  <circle cx="85" cy="65" r="3.5" fill="#FFB84D"/>
  <circle cx="100" cy="65" r="3.5" fill="#FFB84D"/>
  <circle cx="115" cy="65" r="3.5" fill="#FFB84D"/>
  
  <!-- Prusa P initial mark -->
  <text x="100" y="145" font-size="32" font-weight="bold" fill="#FFB84D" text-anchor="middle" font-family="Arial, sans-serif">P</text>
  
  <!-- Printer frame accent lines -->
  <line x1="50" y1="75" x2="150" y2="75" stroke="#FFB84D" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="85" x2="150" y2="85" stroke="#FFB84D" stroke-width="1.5" opacity="0.4"/>
</svg>
