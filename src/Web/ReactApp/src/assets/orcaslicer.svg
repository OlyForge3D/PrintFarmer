<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- OrcaSlicer logo - stylized orca whale fin with slicer lines -->
  <defs>
    <linearGradient id="orca-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00AE42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009639;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main fin shape -->
  <path d="M32 4C28 4 20 12 16 24C12 36 14 48 20 56C24 60 30 60 34 58C40 54 46 44 48 32C50 20 44 8 38 4C36 4 34 4 32 4Z" fill="url(#orca-grad)"/>
  <!-- Slicer layer lines -->
  <path d="M18 36H46" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M20 42H44" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M22 48H40" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Eye dot -->
  <circle cx="30" cy="20" r="3" fill="white"/>
</svg>
