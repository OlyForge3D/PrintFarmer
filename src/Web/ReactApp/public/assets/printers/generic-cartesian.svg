<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" rx="8" fill="#1a1a2e"/>
  
  <!-- Frame - Cartesian style (like Prusa i3) -->
  <rect x="15" y="15" width="90" height="95" rx="3" stroke="#4a5568" stroke-width="2" fill="none"/>
  
  <!-- Vertical frame (Z-axis) -->
  <rect x="18" y="18" width="8" height="88" rx="2" fill="#2d3748"/>
  <rect x="94" y="18" width="8" height="88" rx="2" fill="#2d3748"/>
  
  <!-- X-axis gantry (horizontal bar) -->
  <rect x="26" y="35" width="68" height="6" rx="2" fill="#718096"/>
  
  <!-- X-axis rail -->
  <rect x="28" y="37" width="64" height="2" rx="1" fill="#a0aec0"/>
  
  <!-- Print head on X carriage -->
  <rect x="55" y="28" width="18" height="22" rx="2" fill="#4299e1"/>
  <rect x="59" y="47" width="10" height="8" rx="1" fill="#ed8936"/>
  <!-- Nozzle -->
  <path d="M62 55 L66 55 L64 62 Z" fill="#fbd38d"/>
  
  <!-- Z-axis lead screws with threading pattern -->
  <rect x="20" y="25" width="4" height="75" rx="1" fill="#a0aec0"/>
  <rect x="96" y="25" width="4" height="75" rx="1" fill="#a0aec0"/>
  
  <!-- Heated bed (moves in Y) -->
  <rect x="30" y="75" width="60" height="8" rx="2" fill="#48bb78"/>
  <rect x="33" y="77" width="54" height="4" rx="1" fill="#38a169"/>
  
  <!-- Y-axis rails under bed -->
  <rect x="25" y="85" width="70" height="3" rx="1" fill="#718096"/>
  <rect x="25" y="92" width="70" height="3" rx="1" fill="#718096"/>
  
  <!-- Y-axis belt indication -->
  <line x1="30" y1="98" x2="90" y2="98" stroke="#f6ad55" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Stepper motors -->
  <!-- Z motors at bottom of vertical rails -->
  <rect x="16" y="95" width="12" height="10" rx="2" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <circle cx="22" cy="100" r="2.5" fill="#718096"/>
  <rect x="92" y="95" width="12" height="10" rx="2" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <circle cx="98" cy="100" r="2.5" fill="#718096"/>
  
  <!-- Label -->
  <text x="60" y="112" font-family="system-ui, sans-serif" font-size="8" fill="#a0aec0" text-anchor="middle">Cartesian</text>
</svg>
