<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" rx="8" fill="#1a1a2e"/>
  
  <!-- Simple printer frame -->
  <rect x="20" y="20" width="80" height="80" rx="4" stroke="#4a5568" stroke-width="2" fill="none"/>
  <rect x="25" y="25" width="70" height="70" rx="3" stroke="#2d3748" stroke-width="1.5" fill="#0f0f1a"/>
  
  <!-- Gantry -->
  <rect x="28" y="35" width="64" height="5" rx="2" fill="#718096"/>
  
  <!-- Print head -->
  <rect x="50" y="30" width="20" height="18" rx="2" fill="#4299e1"/>
  <rect x="54" y="45" width="12" height="10" rx="1" fill="#ed8936"/>
  <!-- Nozzle -->
  <path d="M57 55 L63 55 L60 63 Z" fill="#fbd38d"/>
  
  <!-- Build plate -->
  <rect x="30" y="78" width="60" height="10" rx="2" fill="#48bb78"/>
  <rect x="33" y="80" width="54" height="6" rx="1" fill="#38a169"/>
  
  <!-- Z-axis -->
  <rect x="23" y="40" width="3" height="45" rx="1" fill="#a0aec0"/>
  <rect x="94" y="40" width="3" height="45" rx="1" fill="#a0aec0"/>
  
  <!-- Label -->
  <text x="60" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#a0aec0" text-anchor="middle">3D Printer</text>
</svg>
