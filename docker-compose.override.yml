# Docker Compose override for development and testing
# Usage examples:
# Development with hot reload: docker compose --profile dev up
# Testing with SQL Server: docker compose --profile sqlserver up
# Testing with MySQL: docker compose --profile mysql up

services:
  # Development overrides for React hot reload
  printfarmer-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: printfarmer-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__Default=Host=postgres-dev;Database=printfarmer_dev;Username=printfarmer;Password=PrintFarm123!
      - JWT_SECRET=dev-secret-key-minimum-32-characters
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,https://localhost:5173
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./src/Web/ClientApp:/app/clientapp
      - printfarmer-dev-data:/data
    ports:
      - "5000:8080"  # API
      - "5173:5173"  # Vite dev server
    depends_on:
      - postgres-dev
    networks:
      - printfarmer-net

  postgres-dev:
    profiles: ["dev"]
    image: postgres:15-alpine
    container_name: printfarmer-postgres-dev
    environment:
      - POSTGRES_DB=printfarmer_dev
      - POSTGRES_USER=printfarmer
      - POSTGRES_PASSWORD=PrintFarm123!
    ports:
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - printfarmer-net

  # Alternative database services for testing (only enabled with specific profiles)
  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: printfarmer-sqlserver
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: PrintFarm123!
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - printfarmer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'PrintFarm123!' -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: printfarmer-mysql
    environment:
      MYSQL_DATABASE: printfarmer
      MYSQL_ROOT_PASSWORD: PrintFarm123!
      MYSQL_USER: printfarmer
      MYSQL_PASSWORD: printfarmer
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - printfarmer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "printfarmer", "-pprintfarmer"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-dev-data:
  printfarmer-dev-data:
  sqlserver-data:
  mysql-data:
