  #   container_name: printfarmer-postgres
  #   environment:
  #     POSTGRES_DB: forgeiq
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Uncomment to add MySQL for testing  
  # mysql:
  #   image: mysql:8.0
