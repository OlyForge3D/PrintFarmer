#!/bin/bash
################################################################################
# Container Base Image Versions - SINGLE SOURCE OF TRUTH
# All container image versions defined here to keep docker-compose and 
# Dockerfiles in sync automatically
################################################################################

# .NET SDK and Runtime versions
export SDK_TAG="${SDK_TAG:-10.0-noble}"
export ASPNET_TAG="${ASPNET_TAG:-10.0-noble}"

# Other base images
export NODE_TAG="${NODE_TAG:-22-alpine}"
export NGINX_TAG="${NGINX_TAG:-alpine}"
export UBUNTU_TAG="${UBUNTU_TAG:-24.04}"

# OrcaSlicer configuration
export ORCASLICER_VERSION="${ORCASLICER_VERSION:-2.4.1}"
if [ -z "${ORCASLICER_SHA256:-}" ]; then
    case "$ORCASLICER_VERSION" in
        2.3.1)
            export ORCASLICER_SHA256="f199e5408914efdbbbfa4fd6752cd6ad4727209b488bc47bff9a0da5f053a701"
            ;;
        2.4.0)
            export ORCASLICER_SHA256="46556197dcc2fb55140e0b1e70c28b4c4da3208f12a4a2522012837c9d77ee10"
            ;;
        2.4.1)
            export ORCASLICER_SHA256="7aff29a0ac6bb906f11c069eefe83459781c3364bac20ba9529eb9937a231402"
            ;;
        *)
            export ORCASLICER_SHA256=""
            ;;
    esac
else
    export ORCASLICER_SHA256
fi
export ORCASLICER_CONTAINER_DIGEST="${ORCASLICER_CONTAINER_DIGEST:-}"
export BUILD_VERBOSITY="${BUILD_VERBOSITY:-quiet}"

# Obico ML API configuration (AI print failure detection)
export OBICO_ML_IMAGE="${OBICO_ML_IMAGE:-thespaghettidetective/ml_api:base-1.4}"

# go2rtc RTSP-to-WebRTC/HLS/MSE transcoding (camera streaming)
export GO2RTC_IMAGE="${GO2RTC_IMAGE:-alexxit/go2rtc:1.9.8}"

################################################################################
