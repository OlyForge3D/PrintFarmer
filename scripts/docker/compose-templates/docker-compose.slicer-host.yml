# Standalone Slicer Host Addon Service
# Automatically included by compose-generator.sh whenever OrcaSlicer workers are enabled.
# Provides an independent slicer microservice with its own database, calling back to the
# main API for cross-domain data (printers, catalog models, manufacturers).

x-slicer-host-healthcheck: &slicer-host-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:5246/healthz"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  slicer-host:
    build:
      context: "${PRINTFARMER_BUILD_CONTEXT:-.}"
      dockerfile: Dockerfile.multistage
      target: slicer-host-runtime
      args:
        SDK_TAG: ${SDK_TAG}
        ASPNET_TAG: ${ASPNET_TAG}
        NODE_TAG: ${NODE_TAG}
        NGINX_TAG: ${NGINX_TAG}
        UBUNTU_TAG: ${UBUNTU_TAG}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-development}
        VCS_REF: ${VCS_REF:-unknown}
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-}
        SOURCE_ARCHIVE_URL: ${SOURCE_ARCHIVE_URL:-}
        SBOM_URL: ${SBOM_URL:-}
    image: printfarmer-slicer-host
    container_name: printfarmer-slicer-host
    restart: unless-stopped
    ports:
      - "${SLICER_HOST_PORT:-5246}:5246"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5246
      - DB_PROVIDER=${DB_PROVIDER:-Postgres}
      - ConnectionStrings__Default=${ConnectionStrings__Default}
      # URL of the main API for cross-domain lookups (printers, catalog models, manufacturers)
      - MainApi__BaseUrl=${MAIN_API_URL:-http://api:5245}
      - WorkerAuth__SharedKey=${WORKER_SHARED_API_KEY:-}
      # JWT signing configuration - MUST match the main API's Jwt__Key so Desktop
      # API-key exchange tokens (see docs/SLICER_CONFIGURATION.md) issued by the
      # API are accepted here. Jwt__Key is required: Farm.Slicer.Host/Program.cs
      # reads Jwt:Key and throws InvalidOperationException at startup if it is
      # absent, and registers JWT bearer authentication unconditionally - there
      # is no standalone/no-auth code path. No default is provided here: an
      # unset value must fail compose rendering rather than silently booting
      # with a missing signing key. Set it explicitly to the SAME value
      # configured for the api service. Do NOT reuse the main API compose
      # file's placeholder default here; that value is committed to source
      # control and must never be treated as a real secret.
      - Jwt__Key=${Jwt__Key:?Jwt__Key must be set to the same 32+ byte secret configured for the api service. Run the deploy installer (scripts/deploy-docker.sh) to generate one, or set Jwt__Key in your environment/.env file.}
      - Jwt__Issuer=${Jwt__Issuer:-PrintFarmer}
      - Jwt__Audience=${Jwt__Audience:-PrintFarmer}
      # Calibration profile resolution: the main API posts machine/process/filament ids to
      # POST /api/slicer/calibration/resolved-profiles here with the end user's own bearer token,
      # and probes GET /healthz/calibration-resolver for availability. Both require the Jwt__*
      # values above to match the api service exactly, and the caller must hold calibration:read.
      - MODEL_UPLOAD_PATH=/app/models
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    volumes:
      - ${EXTERNAL_SLICER_DATA_PATH:-.volumes/printfarmer-slicer-data}:/data
      - ${EXTERNAL_PROFILES_PATH:-.volumes/printfarmer-slicer-profiles}:/app/profiles:ro
      - ${EXTERNAL_MODELS_PATH:-.volumes/printfarmer-model-storage}:/app/models
    networks:
      - printfarmer-network
    healthcheck: *slicer-host-healthcheck
