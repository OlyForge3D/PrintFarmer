# Docker Compose override for container registry deployment
# This file modifies the base docker-compose.yml to use images from a container registry
# instead of building locally. Supports GitHub Container Registry (GHCR) or custom registries.
# 
# Usage with deploy-docker.sh (RECOMMENDED):
#   ./scripts/deploy-docker.sh --use-registry                    # Use latest from GHCR
#   ./scripts/deploy-docker.sh --use-registry --registry-tag v1.2.3  # Specific version
#   ./scripts/deploy-docker.sh --use-registry --registry-host my-registry.com --registry-tag latest
#
# Manual usage with docker compose:
#   1. Set your registry: export REGISTRY_HOST=ghcr.io/olyforge3d
#   2. Set image tag: export REGISTRY_IMAGE_TAG=latest
#   3. Deploy: docker compose -f docker-compose.yml -f docker-compose.registry.yml up
#
# Per-service PRINTFARMER_*_IMAGE variables take precedence and accept digest
# references. Use them when consuming a coherent daily image-set manifest.
#
# Available tags (created by GitHub Actions):
#   - latest           Latest build from main branch
#   - <branch-name>    Branch name (e.g., main, release)
#   - sha-<commit>     Git commit SHA
#   - v<version>       Semantic version from git tag (e.g., v1.2.3)

services:
  # Override API to use registry image
  api:
    image: ${PRINTFARMER_API_IMAGE:-${REGISTRY_HOST:-ghcr.io/olyforge3d}/printfarmer-api:${REGISTRY_IMAGE_TAG:-latest}}
    build: !reset null
    
  # Override React frontend to use registry image
  frontend:
    image: ${PRINTFARMER_FRONTEND_IMAGE:-${REGISTRY_HOST:-ghcr.io/olyforge3d}/printfarmer-frontend:${REGISTRY_IMAGE_TAG:-latest}}
    build: !reset null
    
  # Override printer-discovery to use registry image (when included)
  printer-discovery:
    image: ${PRINTFARMER_PRINTER_DISCOVERY_IMAGE:-${REGISTRY_HOST:-ghcr.io/olyforge3d}/printfarmer-printer-discovery:${REGISTRY_IMAGE_TAG:-latest}}
    build: !reset null

  # Override slicer-host to use registry image (when OrcaSlicer is enabled)
  slicer-host:
    image: ${PRINTFARMER_SLICER_HOST_IMAGE:-${REGISTRY_HOST:-ghcr.io/olyforge3d}/printfarmer-slicer-host:${REGISTRY_IMAGE_TAG:-latest}}
    build: !reset null

  # Override OrcaSlicer worker to use registry image
  orcaslicer-worker:
    image: ${PRINTFARMER_ORCASLICER_WORKER_IMAGE:-${REGISTRY_HOST:-ghcr.io/olyforge3d}/printfarmer-orcaslicer-worker:${REGISTRY_IMAGE_TAG:-latest}}
    build: !reset null