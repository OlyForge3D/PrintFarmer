# PrintFarmer Microservices Architecture with OrcaSlicer Worker
# Supports OrcaSlicer worker for distributed slicing
# NOTE: Health check and shared definitions are automatically injected by compose-generator.sh
# from docker-compose.common.yml during deployment

services:
  # Database (configurable via environment - supports PostgreSQL, SQL Server, MySQL)
  database:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: printfarmer-database
    environment:
      # PostgreSQL (default)
      POSTGRES_DB: ${POSTGRES_DB:-printfarmer}
      POSTGRES_USER: ${POSTGRES_USER:-printfarmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # SQL Server (when using mcr.microsoft.com/mssql/server:2022-latest)
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      # MySQL (when using mysql:8.0)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:-printfarmer}
      MYSQL_USER: ${DATABASE_USER:-printfarmer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      printfarmer-network:
        aliases:
          - postgres
    volumes:
      - printfarmer-database:/var/lib/postgresql/data  # Default path, override in production
    healthcheck:
      test: ${DATABASE_HEALTH_CHECK:-["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printfarmer} -d ${POSTGRES_DB:-printfarmer}"]}
      interval: 10s
      timeout: 5s
      retries: 5

  # PrintFarmer API - Core microservice with multi-stage build
  api:
    build:
      context: .
      dockerfile: scripts/docker/dockerfiles/Dockerfile.multistage
      target: api-runtime
      args:
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/amd64}
    image: printfarmer-api-multistage
    container_name: printfarmer-api
    ports:
      - "${API_PORT:-5245}:5245"
    networks:
      - printfarmer-network
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5245
      - DB_PROVIDER=${DB_PROVIDER:-Postgres}
      - ConnectionStrings__Default=${ConnectionStrings__Default}
      - DB_STARTUP_TIMEOUT=${DB_STARTUP_TIMEOUT:-120}
      - DB_CONNECTION_RETRY_COUNT=${DB_CONNECTION_RETRY_COUNT:-3}
      - DB_CONNECTION_RETRY_DELAY=${DB_CONNECTION_RETRY_DELAY:-2}
      - CORS__AllowedOrigins=${CORS__AllowedOrigins:-http://localhost:3000,http://localhost:8080}
      - DOCKER_HOST_NETWORK=${DOCKER_HOST_NETWORK:-false}
      - ALLOW_LOCAL_NETWORK=${ALLOW_LOCAL_NETWORK:-true}
      - ALLOWED_NETWORK_RANGES=${ALLOWED_NETWORK_RANGES:-192.168.0.0/16,10.0.0.0/8}
      - DEPLOYMENT_MODE=microservices
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - SlicerOrchestrator__EnableDistributedSlicing=${ENABLE_DISTRIBUTED_SLICING:-true}
      - SlicerOrchestrator__Workers__OrcaSlicer=${ORCA_WORKER_ENDPOINT:-http://orcaslicer-worker:8080}
      - PFARM__Spoolman__BaseUrl=${PFARM__Spoolman__BaseUrl:-}
      - PFARM__NetworkDiscovery__EnableDiscovery=${PFARM__NetworkDiscovery__EnableDiscovery:-true}
      - PFARM__NetworkDiscovery__DiscoverySubnets=${PFARM__NetworkDiscovery__DiscoverySubnets:-}
    volumes:
      - printfarmer-app-data:/data
      - ${EXTERNAL_MODELS_PATH:-.volumes/printfarmer-model-storage}:/app/models
      - ${EXTERNAL_GCODE_PATH:-.volumes/printfarmer-gcode-storage}:/app/gcode
      - ${EXTERNAL_PROFILES_PATH:-.volumes/printfarmer-slicer-profiles}:/app/profiles
    depends_on:
      database:
        condition: service_healthy
    healthcheck: *api-healthcheck

  # OrcaSlicer Worker - Distributed slicing microservice with multi-stage build
  orcaslicer-worker:
    build:
      <<: *orcaslicer-build
    image: printfarmer-orcaslicer-worker-multistage
    container_name: printfarmer-orcaslicer-worker
    ports:
      - "8081:8080"
    networks:
      - printfarmer-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Worker__StorageEndpoint=http://api:5245
      - Worker__WorkingDirectory=/app/temp
      - Worker__OrcaSlicerPath=/usr/local/bin/orcaslicer
      - Worker__WorkerId=orcaslicer-worker-1
      - Worker__QueueName=orcaslicer-jobs
      - Logging__LogLevel__Default=Information
      - Worker__MaxConcurrentJobs=1
      - Worker__MaxMemoryMb=1024
    volumes: *worker-volumes
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    <<: *worker-security
    deploy: *worker-deployment



  # React Frontend with multi-stage build
  frontend:
    build:
      context: .
      dockerfile: scripts/docker/dockerfiles/Dockerfile.multistage
      target: frontend-runtime
      args:
        VITE_API_BASE_URL: /api
        VITE_SIGNALR_PRINTERS_URL: /hubs/printers
        VITE_SIGNALR_HARVEST_URL: /hubs/harvest
    image: printfarmer-frontend-multistage
    container_name: printfarmer-frontend
    # In microservices architecture the frontend is served internally and proxied
    # by the nginx-proxy service. Avoid binding the frontend directly to the
    # host to prevent port conflicts; nginx-proxy will be bound to the host.
    networks:
      - printfarmer-network
    environment:
      # In microservices deployments the browser should use the proxy origin
      # so configure the frontend to use same-origin (relative) API and SignalR paths.
      - VITE_API_BASE_URL=/api
      - VITE_SIGNALR_PRINTERS_URL=/hubs/printers
      - VITE_SIGNALR_HARVEST_URL=/hubs/harvest
      - NGINX_PROXY_API=http://api:5245
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *frontend-healthcheck
  nginx-proxy:
    image: nginx:alpine
    container_name: printfarmer-nginx-proxy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx-microservices.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    healthcheck: *nginx-healthcheck
    networks:
      - printfarmer-network

networks:
  printfarmer-network: *printfarmer-network

volumes:
  printfarmer-database:  # Generic database volume (PostgreSQL, SQL Server, MySQL)
  printfarmer-app-data:
  printfarmer-gcode-storage:
  printfarmer-slicer-profiles:
  printfarmer-model-storage:
  printfarmer-orcaslicer-temp:
