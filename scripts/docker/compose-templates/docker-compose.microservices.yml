# PrintFarmer Microservices Architecture with OrcaSlicer Worker
# Supports OrcaSlicer worker for distributed slicing

services:
  # Database (configurable via environment - supports PostgreSQL, SQL Server, MySQL)
  database:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: printfarmer-database
    environment:
      # PostgreSQL (default)
      POSTGRES_DB: ${POSTGRES_DB:-printfarmer}
      POSTGRES_USER: ${POSTGRES_USER:-printfarmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printfarmer_password}
      # SQL Server (when using mcr.microsoft.com/mssql/server:2022-latest)
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      # MySQL (when using mysql:8.0)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${DATABASE_NAME:-printfarmer}
      MYSQL_USER: ${DATABASE_USER:-printfarmer}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-printfarmer_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - printfarmer-network
    volumes:
      - database_data:/var/lib/postgresql/data  # Default path, override in production
    healthcheck:
      test: ${DATABASE_HEALTH_CHECK:-["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printfarmer} -d ${POSTGRES_DB:-printfarmer}"]}
      interval: 10s
      timeout: 5s
      retries: 5

  # PrintFarmer API - Core microservice with multi-stage build
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: api-runtime
      args:
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/amd64}
    image: printfarmer-api-multistage
    container_name: printfarmer-api
    ports:
      - "${API_PORT:-5001}:8080"
    networks:
      - printfarmer-network
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - DB_PROVIDER=${DB_PROVIDER:-Postgres}
      - ConnectionStrings__Default=${ConnectionStrings__Default:-Host=database;Database=printfarmer;Username=printfarmer;Password=printfarmer_password}
      - CORS__AllowedOrigins=${CORS__AllowedOrigins:-http://localhost:3000,http://localhost:8080}
      - DOCKER_HOST_NETWORK=${DOCKER_HOST_NETWORK:-false}
      - ALLOW_LOCAL_NETWORK=${ALLOW_LOCAL_NETWORK:-true}
      - ALLOWED_NETWORK_RANGES=${ALLOWED_NETWORK_RANGES:-192.168.0.0/16,10.0.0.0/8}
      - DEPLOYMENT_MODE=microservices
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - SlicerOrchestrator__EnableDistributedSlicing=${ENABLE_DISTRIBUTED_SLICING:-true}
      - SlicerOrchestrator__Workers__OrcaSlicer=${ORCA_WORKER_ENDPOINT:-http://orcaslicer-worker:8080}
      - PFARM__Spoolman__BaseUrl=${PFARM__Spoolman__BaseUrl:-}
      - PFARM__NetworkDiscovery__EnableDiscovery=${PFARM__NetworkDiscovery__EnableDiscovery:-true}
      - PFARM__NetworkDiscovery__DiscoverySubnets=${PFARM__NetworkDiscovery__DiscoverySubnets:-}
    volumes:
      - app_data:/data
      - model_uploads:/app/uploads
      - gcode_storage:/app/gcode
      - slicer_profiles:/app/profiles
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # OrcaSlicer Binary Layer (cached layer for binary assets)
  orcaslicer-binaries:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: orcaslicer-binaries
      args:
        ORCASLICER_VERSION: ${ORCASLICER_VERSION:-2.3.1}
        ALLOW_STUB: "false"  # Production: require real OrcaSlicer binary
    image: orcaslicer-binaries-multistage:${ORCASLICER_VERSION:-2.3.1}
    profiles:
      - orca
      - orca-binaries

  # OrcaSlicer Worker - Distributed slicing microservice with multi-stage build
  orcaslicer-worker:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: orcaslicer-worker
      args:
        ALLOW_STUB: "false"  # Production: require real OrcaSlicer binary
        ORCASLICER_VERSION: ${ORCASLICER_VERSION:-2.3.1}
    profiles:
      - orca
    image: printfarmer-orcaslicer-worker-multistage
    container_name: printfarmer-orcaslicer-worker
    ports:
      - "8081:8080"
    networks:
      - printfarmer-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Worker__StorageEndpoint=http://api:8080
      - Worker__WorkingDirectory=/app/temp
      - Worker__OrcaSlicerPath=/usr/local/bin/orcaslicer
      - Worker__WorkerId=orcaslicer-worker-1
      - Worker__QueueName=orcaslicer-jobs
      - Logging__LogLevel__Default=Information
      - Worker__MaxConcurrentJobs=1
      - Worker__MaxMemoryMb=1024
    volumes:
      - orcaslicer_temp:/app/temp
      - gcode_storage:/app/gcode
    depends_on:
      orcaslicer-binaries:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 1024
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M



  # React Frontend with multi-stage build
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: frontend-runtime
    image: printfarmer-frontend-multistage
    container_name: printfarmer-frontend
    ports:
      - "3000:80"
    networks:
      - printfarmer-network
    environment:
      - VITE_API_BASE_URL=http://localhost:5001/api
      - VITE_SIGNALR_PRINTERS_URL=http://localhost:5001/hubs/printers
      - VITE_SIGNALR_HARVEST_URL=http://localhost:5001/hubs/harvest
      - NGINX_PROXY_API=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  nginx-proxy:
    image: nginx:alpine
    container_name: printfarmer-nginx-proxy
    profiles:
      - proxy
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx-microservices.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - orcaslicer-worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - printfarmer-network

networks:
  printfarmer-network:
    name: printfarmer-network
    driver: bridge

volumes:
  database_data:  # Generic database volume (PostgreSQL, SQL Server, MySQL)
  app_data:
  model_uploads:
  gcode_storage:
  slicer_profiles:
  orcaslicer_temp:
