# Database services for testing different providers with PrintFarmer
# NOTE: These use unique container names because this file is designed to run 
#       MULTIPLE databases simultaneously for testing purposes.
#       Main deployment files (microservices.yml, etc.) use generic "printfarmer-database"
#       
# Usage examples:
#
# Test with PostgreSQL:
#   docker compose -f docker-compose.databases.yml up postgres -d
#   docker compose up api web -d --env DB_PROVIDER=Postgres --env ConnectionStrings__Postgres=Host=localhost;Database=printfarmer;Username=postgres;Password=postgres
#
# Test with MySQL:
#   docker compose -f docker-compose.databases.yml up mysql -d  
#   docker compose up api web -d --env DB_PROVIDER=MySql --env ConnectionStrings__MySql=Server=localhost;Database=printfarmer;User=root;Password=example
#
# Test with SQL Server:
#   docker compose -f docker-compose.databases.yml up sqlserver -d
#   docker compose up api web -d --env DB_PROVIDER=SqlServer --env ConnectionStrings__SqlServer="Server=localhost,1433;Database=printfarmer;User Id=sa;Password=Your_password123;"
#
# Test with SQL Server:
#   docker compose -f docker-compose.databases.yml up sqlserver -d
#   docker compose up api web -d --env DB_PROVIDER=SqlServer --env "ConnectionStrings__SqlServer=Server=localhost;Database=printfarmer;User Id=sa;Password=Your_password123;TrustServerCertificate=True"

services:
  postgres:
    image: postgres:15
    container_name: printfarmer-database-postgres
    environment:
      POSTGRES_DB: printfarmer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: printfarmer-database-mysql
    environment:
      MYSQL_DATABASE: printfarmer
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-printfarmer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: printfarmer-database-sqlserver
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  mysql-data:
  sqlserver-data:
