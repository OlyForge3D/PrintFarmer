# Local-only overrides for the digest-pinned daily development image set.
name: printfarmer-daily-validation

services:
  database:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

  api:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${API_PORT:-15245}:5245"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Local validation only: never expose this stack to an untrusted network.
      Security__DevModeBypassAuth: "true"
      # Keep the UI's real discovery/add surface enabled. Physical scanning
      # remains disabled in printer-discovery below; deterministic fixtures
      # replace network probing for this isolated validation stack.
      PFARM__NetworkDiscovery__EnableDiscovery: "true"
      # Real Moonraker-backend seeding: printers are created against the
      # repository-built emulator instances (see moonraker-ready/printing/
      # paused/shutdown services below), not the in-process TestEmulator
      # plugin. This one flag is sufficient (disabled by default everywhere
      # else) and seeds the API's built-in deterministic defaults — root URLs
      # http://moonraker-ready:7125, http://moonraker-printing:7125,
      # http://moonraker-paused:7125, http://moonraker-shutdown:7125, and the
      # intentionally-unreachable http://moonraker-offline:7125, all backend
      # Moonraker. No MoonrakerEmulatorSeed__Printers__N__* overrides are
      # needed here; that per-printer Name/ServerUrl/IsEnabled override
      # mechanism exists only for local experimentation.
      MoonrakerEmulatorSeed__Enabled: "true"
      # Authenticated and development-gated. Browser tests use this to restore
      # dispatch ownership after lifecycle mutations; production never maps it.
      MoonrakerEmulatorSeed__EnableControlApi: "true"

  frontend:
    container_name: !reset null

  nginx-proxy:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"

  slicer-host:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${SLICER_HOST_PORT:-15246}:5246"

  printer-discovery:
    container_name: !reset null
    volumes: !override []
    environment:
      EnablePeriodicDiscovery: "false"
      PFARM__NetworkDiscovery__EnableDiscovery: "false"
      # Deterministic discovery candidates for the emulator's Voron/Prusa
      # fixtures (see DeterministicDiscoveryFixtureSettings) so discovery/add
      # exercises the real application path without any physical LAN scan.
      Discovery__DeterministicFixtures__Enabled: "true"

  orcaslicer-worker:
    environment:
      Worker__MaxConcurrentJobs: "1"

  moonraker-ready:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${MOONRAKER_EMULATOR_PORT:-17125}:7125"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Validation-only: the control API (scenario/fault injection) is bound
      # exclusively to the isolated validation network and loopback-only host
      # ports here; it is never enabled in the production compose template.
      Emulator__EnableControlApi: "true"

  moonraker-printing:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${MOONRAKER_EMULATOR_PRINTING_PORT:-17126}:7125"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Emulator__EnableControlApi: "true"

  moonraker-paused:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${MOONRAKER_EMULATOR_PAUSED_PORT:-17127}:7125"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Emulator__EnableControlApi: "true"

  moonraker-shutdown:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${MOONRAKER_EMULATOR_SHUTDOWN_PORT:-17128}:7125"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Emulator__EnableControlApi: "true"

networks:
  printfarmer-network:
    name: printfarmer-daily-validation-network
