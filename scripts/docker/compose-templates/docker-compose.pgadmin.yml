# pgAdmin 4 service for PostgreSQL database debugging and management
# Optional service for development and debugging when using PostgreSQL
# NOTE: This file contains just the service configuration for pgAdmin

image: ${PGADMIN_IMAGE:-dpage/pgadmin4:latest}
container_name: printfarmer-pgadmin
environment:
  PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@printfarmer.local}
  PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-adminpass}
  PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
  PGADMIN_CONFIG_COOKIE_DEFAULT_SECURE: "False"
  PGADMIN_CONFIG_COOKIE_SAMESITE: "Lax"
  # Disable some features to reduce memory footprint
  SCRIPT_NAME: /pgadmin
ports:
  - "0.0.0.0:5050:80"
networks:
  printfarmer-network:
    aliases:
      - pgadmin
volumes:
  - ${EXTERNAL_PGADMIN_PATH:-.volumes/printfarmer-pgadmin}:/var/lib/pgadmin
  - ./scripts/docker/pgadmin-init.json:/pgadmin4/servers.json:ro
restart: unless-stopped
depends_on:
  - database
healthcheck:
  test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/pgadmin4/misc/ping"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s
