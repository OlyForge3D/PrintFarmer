services:
  # .NET API Backend - Multi-stage build for efficiency
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: api-runtime
      args:
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/amd64}
    image: printfarmer-api-multistage
    container_name: printfarmer-api
    ports:
      - "5245:5245" # HTTP API / SignalR (bind host 5245 -> container 5245)
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5245
      - DB_PROVIDER=Sqlite
      - ConnectionStrings__Default=Data Source=/data/farm.db
      - CORS__AllowedOrigins=${CORS__AllowedOrigins:-http://localhost:3000,http://localhost:8080,http://localhost:5245}
      - DEPLOYMENT_MODE=monolithic
      - SlicerOrchestrator__EnableDistributedSlicing=${ENABLE_DISTRIBUTED_SLICING:-true}
      - ALLOW_LOCAL_NETWORK=true
      - ALLOWED_NETWORK_RANGES=10.0.0.0/24,172.16.0.0/12
      - DOCKER_HOST_NETWORK=false
      - ENABLE_LOCAL_NETWORK_ACCESS=true
      - DISCOVERY_PORTS=7125,80
      # Persist model storage & gcode library (map to host)
      - ModelStorage__Path=/app/models
      - GCODE_LIBRARY_ROOT=/app/wwwroot/gcode-library
      # Optional Spoolman integration (values may be overridden by .env file generated via deploy script)
      - SPOOLMAN_ENABLED=${SPOOLMAN_ENABLED:-}
      - SPOOLMAN_BASE_URL=${SPOOLMAN_BASE_URL:-}
      - SPOOLMAN_PORT=${SPOOLMAN_PORT:-}
      # Application Settings - Pre-populate Setup Wizard
      - PFARM__Spoolman__BaseUrl=${PFARM__Spoolman__BaseUrl:-}
      - PFARM__NetworkDiscovery__EnableDiscovery=${PFARM__NetworkDiscovery__EnableDiscovery:-true}
      - PFARM__NetworkDiscovery__DiscoverySubnets=${PFARM__NetworkDiscovery__DiscoverySubnets:-}
      # Required JWT signing key (32+ chars) for auth configuration
      - Jwt__Key=dev-super-secret-key-change-this-please-1234567890
    volumes:
      - printfarmer-app-data:/data
      - printfarmer-model-uploads:/app/uploads
      - printfarmer-gcode-storage:/app/gcode
      - printfarmer-slicer-profiles:/app/profiles
      - ./wwwroot/gcode-library:/app/wwwroot/gcode-library
      - ./models:/app/models

    networks:
      - printfarmer-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:5245/healthz && curl -f http://localhost:5245/health | grep -q 'Healthy' && curl -f http://localhost:5245/api/signalrtest/connection-stats"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  # React Frontend with Nginx - Multi-stage build
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: frontend-runtime
      args:
        VITE_API_BASE_URL: "http://localhost:${API_PORT:-5245}/api"
        VITE_SIGNALR_PRINTERS_URL: "http://localhost:${API_PORT:-5245}/hubs/printers"
        VITE_SIGNALR_HARVEST_URL: "http://localhost:${API_PORT:-5245}/hubs/harvest"
    image: printfarmer-frontend-multistage
    container_name: printfarmer-frontend
    ports:
      - "${HTTP_PORT:-3000}:80"
    environment:
      # Point directly at API (no nginx proxy needed in local dev stack script)
      - VITE_API_BASE_URL=http://localhost:5245/api
      - VITE_SIGNALR_PRINTERS_URL=http://localhost:5245/hubs/printers
      - VITE_SIGNALR_HARVEST_URL=http://localhost:5245/hubs/harvest
    networks:
      - printfarmer-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # OrcaSlicer Worker for distributed slicing - Multi-stage build
  orcaslicer-worker:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: orcaslicer-worker
      args:
        ALLOW_STUB: "false"  # Production: require real OrcaSlicer binary
        ORCASLICER_VERSION: ${ORCASLICER_VERSION:-2.3.1}
    image: printfarmer-orcaslicer-worker-multistage
    container_name: printfarmer-orcaslicer-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Worker__StorageEndpoint=${MONO_API_ENDPOINT:-http://api:5000}
      - Worker__WorkingDirectory=/app/temp
      - Worker__OrcaSlicerPath=/usr/local/bin/orcaslicer
      - Worker__WorkerId=orcaslicer-worker-1
      - Worker__MaxConcurrentJobs=1
      - Worker__MaxMemoryMb=1024
    volumes:
      - printfarmer-orcaslicer-temp:/app/temp
      - printfarmer-gcode-storage:/app/gcode
    depends_on:
      api:
        condition: service_healthy
    networks:
      - printfarmer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 1024
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Optional: Load balancer / Reverse proxy
  nginx-proxy:
    image: nginx:alpine
    container_name: printfarmer-nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx-microservices.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - orcaslicer-worker
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - printfarmer-network

volumes:
  printfarmer-app-data:
  printfarmer-model-uploads:
  printfarmer-gcode-storage:
  printfarmer-slicer-profiles:
  printfarmer-orcaslicer-temp:

networks:
  printfarmer-network:
    name: printfarmer-network
    driver: bridge
