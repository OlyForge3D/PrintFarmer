# PrintFarmer Docker Compose Template
# Base deployment with API, Frontend, Database, and Nginx reverse proxy
# Optional addons (OrcaSlicer worker, monitoring, telemetry) can be merged via compose-generator.sh
# NOTE: Health check and shared definitions are automatically injected from docker-compose.common.yml

name: printfarmer

services:
  # Database (configurable via environment - supports PostgreSQL, SQL Server)
  database:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: printfarmer-database
    environment:
      # PostgreSQL (default)
      POSTGRES_DB: ${POSTGRES_DB:-printfarmer}
      POSTGRES_USER: ${POSTGRES_USER:-printfarmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # SQL Server (when using mcr.microsoft.com/mssql/server:2022-latest)
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      printfarmer-network:
        aliases:
          - postgres    # For PostgreSQL: Host=postgres
          - sqlserver   # For SQL Server: Server=sqlserver
          - database    # Generic alias works for either
    volumes:
      - ${EXTERNAL_DATABASE_PATH:-.volumes/printfarmer-database}:/var/lib/postgresql/data  # Database persistence (maps to host directory or docker volume)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printfarmer} -d ${POSTGRES_DB:-printfarmer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # PrintFarmer API - Core microservice with multi-stage build
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: api-runtime
      args:
        SDK_TAG: ${SDK_TAG}
        ASPNET_TAG: ${ASPNET_TAG}
        NODE_TAG: ${NODE_TAG}
        NGINX_TAG: ${NGINX_TAG}
        UBUNTU_TAG: ${UBUNTU_TAG}
    image: printfarmer-api
    container_name: printfarmer-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5245}:5245"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5245
      - DB_PROVIDER=${DB_PROVIDER:-Postgres}
      - ConnectionStrings__Default=${ConnectionStrings__Default}
      - DB_STARTUP_TIMEOUT=${DB_STARTUP_TIMEOUT:-120}
      - DB_CONNECTION_RETRY_COUNT=${DB_CONNECTION_RETRY_COUNT:-3}
      - DB_CONNECTION_RETRY_DELAY=${DB_CONNECTION_RETRY_DELAY:-2}
      - CORS__AllowedOrigins=${CORS__AllowedOrigins:-http://localhost:3000,http://localhost:8080}
      - DEPLOYMENT_MODE=microservices
      - SlicerOrchestrator__EnableDistributedSlicing=${ENABLE_DISTRIBUTED_SLICING:-true}
      - ALLOW_LOCAL_NETWORK=${ALLOW_LOCAL_NETWORK:-true}
      - ALLOWED_NETWORK_RANGES=${ALLOWED_NETWORK_RANGES:-192.168.0.0/16,10.0.0.0/8}
      - DOCKER_HOST_NETWORK=${DOCKER_HOST_NETWORK:-false}
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - SlicerOrchestrator__Workers__OrcaSlicer=${ORCA_WORKER_ENDPOINT:-http://orcaslicer-worker:8080}
      - PFARM__Spoolman__BaseUrl=${PFARM__Spoolman__BaseUrl:-}
      - PFARM__NetworkDiscovery__EnableDiscovery=${PFARM__NetworkDiscovery__EnableDiscovery:-true}
      - PFARM__NetworkDiscovery__DiscoverySubnets=${PFARM__NetworkDiscovery__DiscoverySubnets:-}
      # Required JWT signing key (32+ chars) for auth configuration
      - Jwt__Key=${Jwt__Key:-dev-super-secret-key-change-this-please-1234567890}
      - Jwt__Issuer=${Jwt__Issuer:-PrintFarmer}
      - Jwt__Audience=${Jwt__Audience:-PrintFarmer}
      # DevMode: Set to true to bypass auth for GET requests (debugging only!)
      - Security__DevModeBypassAuth=${DEVMODE_BYPASS_AUTH:-false}
      - GCODE_STORAGE_PATH=/app/gcode
      - MODEL_UPLOAD_PATH=/app/models
      - DATAPROTECTION_KEYS_PATH=/app/data-protection-keys
    volumes:
      - ${EXTERNAL_APP_DATA_PATH:-.volumes/printfarmer-app-data}:/data
      - ${EXTERNAL_MODELS_PATH:-.volumes/printfarmer-model-storage}:/app/models
      - ${EXTERNAL_GCODE_PATH:-.volumes/printfarmer-gcode-storage}:/app/gcode
      - ${EXTERNAL_PROFILES_PATH:-.volumes/printfarmer-slicer-profiles}:/app/profiles
      - ${EXTERNAL_DATAPROTECTION_PATH:-.volumes/printfarmer-dataprotection-keys}:/app/data-protection-keys

    networks:
      - printfarmer-network
    healthcheck: *api-healthcheck

  # React Frontend with multi-stage build
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: frontend-runtime
      args:
        SDK_TAG: ${SDK_TAG}
        ASPNET_TAG: ${ASPNET_TAG}
        NODE_TAG: ${NODE_TAG}
        NGINX_TAG: ${NGINX_TAG}
        UBUNTU_TAG: ${UBUNTU_TAG}
        VITE_API_BASE_URL: /api
        VITE_SIGNALR_PRINTERS_URL: /hubs/printers
        VITE_SIGNALR_HARVEST_URL: /hubs/harvest
    image: printfarmer-frontend
    container_name: printfarmer-frontend
    restart: unless-stopped
    environment:
      # Runtime env vars (for reference, but React reads build-time args)
      - VITE_API_BASE_URL=/api
      - VITE_SIGNALR_PRINTERS_URL=/hubs/printers
      - VITE_SIGNALR_HARVEST_URL=/hubs/harvest
      - NGINX_PROXY_API=http://api:5245
    networks:
      - printfarmer-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *frontend-healthcheck

  # Reverse proxy - single entry point for all external traffic
  nginx-proxy:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: printfarmer-nginx-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx/${NGINX_CONFIG:-nginx-proxy.conf}:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    healthcheck: *nginx-healthcheck
    networks:
      - printfarmer-network

networks:
  printfarmer-network: *printfarmer-network
