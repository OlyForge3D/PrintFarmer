# PrintFarmer - Monolithic Deployment
# All services on single docker-compose, single host network
# Multi-container "monolith" - single deployment unit with separate containers for each service
# Database is always a separate container (PostgreSQL default, SQL Server optional)
# NOTE: Health check and shared definitions are automatically injected by compose-generator.sh
# from docker-compose.common.yml during deployment
# NOTE: Database service is replaced by compose-generator.sh based on --db-provider flag

name: printfarmer

services:
  # Database service placeholder - replaced by compose-generator.sh with provider-specific config
  # Supports: PostgreSQL (default), SQL Server
  database:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: printfarmer-database
    environment:
      # PostgreSQL (default)
      POSTGRES_DB: ${POSTGRES_DB:-printfarmer}
      POSTGRES_USER: ${POSTGRES_USER:-printfarmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # SQL Server (when using mcr.microsoft.com/mssql/server:2022-latest)
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      printfarmer-network:
        aliases:
          - postgres
          - database
    volumes:
      - ${EXTERNAL_DATABASE_PATH:-.volumes/printfarmer-database}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ${DATABASE_HEALTH_CHECK:-["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printfarmer} -d ${POSTGRES_DB:-printfarmer}"]}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # .NET API Backend - Multi-stage build for efficiency
  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: api-runtime
    image: printfarmer-api
    container_name: printfarmer-api
    ports:
      - "5245:5245" # HTTP API / SignalR (bind host 5245 -> container 5245)
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5245
      - DB_PROVIDER=${DB_PROVIDER:-Postgres}
      - ConnectionStrings__Default=${CONNECTION_STRING}
      - DB_STARTUP_TIMEOUT=${DB_STARTUP_TIMEOUT:-120}
      - DB_CONNECTION_RETRY_COUNT=${DB_CONNECTION_RETRY_COUNT:-3}
      - DB_CONNECTION_RETRY_DELAY=${DB_CONNECTION_RETRY_DELAY:-2}
      - CORS__AllowedOrigins=${CORS__AllowedOrigins:-http://localhost:3000,http://localhost:8080,http://localhost:5245}
      - DEPLOYMENT_MODE=monolithic
      - SlicerOrchestrator__EnableDistributedSlicing=${ENABLE_DISTRIBUTED_SLICING:-true}
      - ALLOW_LOCAL_NETWORK=true
      - ALLOWED_NETWORK_RANGES=10.0.0.0/24,172.16.0.0/12
      - DOCKER_HOST_NETWORK=false
      - ENABLE_LOCAL_NETWORK_ACCESS=true
      - DISCOVERY_PORTS=7125,80
      # Persist model storage & gcode library (map to host)
      - GCODE_STORAGE_PATH=/app/gcode
      - MODEL_UPLOAD_PATH=/app/models
      # Optional Spoolman integration (values may be overridden by .env file generated via deploy script)
      - SPOOLMAN_ENABLED=${SPOOLMAN_ENABLED:-}
      - SPOOLMAN_BASE_URL=${SPOOLMAN_BASE_URL:-}
      - SPOOLMAN_PORT=${SPOOLMAN_PORT:-}
      # Application Settings - Pre-populate Setup Wizard
      - PFARM__Spoolman__BaseUrl=${PFARM__Spoolman__BaseUrl:-}
      - PFARM__NetworkDiscovery__EnableDiscovery=${PFARM__NetworkDiscovery__EnableDiscovery:-true}
      - PFARM__NetworkDiscovery__DiscoverySubnets=${PFARM__NetworkDiscovery__DiscoverySubnets:-}
      # Required JWT signing key (32+ chars) for auth configuration
      - Jwt__Key=${Jwt__Key:-dev-super-secret-key-change-this-please-1234567890}
      - Jwt__Issuer=${Jwt__Issuer:-PrintFarmer}
      - Jwt__Audience=${Jwt__Audience:-PrintFarmer}
      # DevMode: Set to true to bypass auth for GET requests (debugging only!)
      - Security__DevModeBypassAuth=${DEVMODE_BYPASS_AUTH:-false}
      - GCODE_STORAGE_PATH=/app/gcode
      - MODEL_UPLOAD_PATH=/app/models
      # Profile task check - disable when slicing workers are not enabled
      - ProfileTaskCheck__Enabled=${PROFILE_TASK_CHECK_ENABLED:-true}
    volumes:
      - ${EXTERNAL_APP_DATA_PATH:-.volumes/printfarmer-app-data}:/data
      - ${EXTERNAL_MODELS_PATH:-.volumes/printfarmer-model-storage}:/app/models
      - ${EXTERNAL_GCODE_PATH:-.volumes/printfarmer-gcode-storage}:/app/gcode
      - ${EXTERNAL_PROFILES_PATH:-.volumes/printfarmer-slicer-profiles}:/app/profiles

    networks:
      - printfarmer-network
    healthcheck: *api-healthcheck

  # React Frontend with Nginx - Multi-stage build
  # NOTE: No external port binding - nginx-proxy handles all external traffic
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: frontend-runtime
      args:
        # Build-time args baked into React bundle - use relative paths for nginx proxy routing
        VITE_API_BASE_URL: /api
        VITE_SIGNALR_PRINTERS_URL: /hubs/printers
        VITE_SIGNALR_HARVEST_URL: /hubs/harvest
    image: printfarmer-frontend
    container_name: printfarmer-frontend
    # No external ports - nginx-proxy routes traffic to this container
    expose:
      - "80"
    environment:
      # Runtime env vars (for reference, but React reads build-time args)
      - VITE_API_BASE_URL=/api
      - VITE_SIGNALR_PRINTERS_URL=/hubs/printers
      - VITE_SIGNALR_HARVEST_URL=/hubs/harvest
    networks:
      - printfarmer-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *frontend-healthcheck

  # Reverse proxy - single entry point for all external traffic
  nginx-proxy:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: printfarmer-nginx-proxy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx-monolithic.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    healthcheck: *nginx-healthcheck
    networks:
      - printfarmer-network

volumes:
  printfarmer-gcode-storage:
  printfarmer-slicer-profiles:
  printfarmer-model-storage:
  printfarmer-orcaslicer-temp:

networks:
  printfarmer-network: *printfarmer-network
