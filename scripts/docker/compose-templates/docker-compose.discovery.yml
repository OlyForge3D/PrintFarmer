# PrintFarmer Printer Discovery Service
# Microservice for automatic printer network discovery
# Scans configured subnets for 3D printers via TCP probes
#
# Architecture:
#   - Runs on bridge network alongside other PrintFarmer services
#   - Connects to API via Docker DNS (http://api:5245)
#   - Two operational modes: Push (periodic) + Pull (manual HTTP endpoint)
#
# Environment Variables:
#   Discovery__ApiBaseUrl       - API base URL (http://api:5245)
#   EnablePeriodicDiscovery     - Auto-scan periodically (true/false)
#   ScanIntervalSeconds         - Interval between scans (default: 300)
#   Subnets                     - Comma-separated CIDR subnets to scan
#   ProbeTimeoutMs              - TCP probe timeout in ms (default: 1000)
#   MaxConcurrentProbes         - Max concurrent TCP probes (default: 50)

services:
  printer-discovery:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: printer-discovery-runtime
      args:
        SDK_TAG: ${SDK_TAG}
        ASPNET_TAG: ${ASPNET_TAG}
        NODE_TAG: ${NODE_TAG}
        NGINX_TAG: ${NGINX_TAG}
        UBUNTU_TAG: ${UBUNTU_TAG}
    image: printfarmer-printer-discovery
    container_name: printfarmer-printer-discovery
    restart: unless-stopped
    networks:
      - printfarmer-network
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5247
      - Discovery__ApiBaseUrl=${DISCOVERY__API_BASE_URL:-http://api:5245}
      - DB_STARTUP_TIMEOUT=${DB_STARTUP_TIMEOUT:-120}
      - DB_CONNECTION_RETRY_COUNT=${DB_CONNECTION_RETRY_COUNT:-3}
      - DB_CONNECTION_RETRY_DELAY=${DB_CONNECTION_RETRY_DELAY:-2}
      - EnablePeriodicDiscovery=${ENABLE_PERIODIC_DISCOVERY:-true}
      - ScanIntervalSeconds=${SCAN_INTERVAL_SECONDS:-300}
      - Subnets=${DISCOVERY_SUBNETS:-10.0.0.0/24}
      - ProbeTimeoutMs=${PROBE_TIMEOUT_MS:-1000}
      - MaxConcurrentProbes=${MAX_CONCURRENT_PROBES:-50}
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - Logging__LogLevel__PrinterDiscoveryService=Information
      # Import network discovery configuration from deployment
      - PFARM__NetworkDiscovery__EnableDiscovery=${PFARM__NetworkDiscovery__EnableDiscovery:-true}
      - PFARM__NetworkDiscovery__DiscoverySubnets=${PFARM__NetworkDiscovery__DiscoverySubnets:-192.168.0.0/16,10.0.0.0/8}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://printer-discovery:5247/api/discovery/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    ulimits:
      nofile: 1024
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

# Network and volume definitions shared with other services
networks:
  printfarmer-network:
    name: printfarmer-network
    driver: bridge

volumes:
  printfarmer-database:
  printfarmer-app-data:
  printfarmer-model-uploads:
  printfarmer-gcode-storage:
  printfarmer-slicer-profiles:
  printfarmer-orcaslicer-temp:
