  database:
    image: mysql:8.0
    container_name: printfarmer-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farm}
      MYSQL_USER: ${MYSQL_USER:-farmuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-farmpass}
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - printfarmer-network