services:
  # Base image builder for slicer workers (not actually run)
  slicer-base:
    build:
      context: .
      dockerfile: Dockerfile.slicer-base
    image: printfarmer-slicer-base
    profiles:
      - orca
      - prusa
    entrypoint: ["/bin/true"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1m
      timeout: 5s
      retries: 1
      start_period: 5s
  # Redis for caching and SignalR backplane
  redis:
    image: redis:7-alpine
    # No external port mapping needed; accessed only by internal services (api, workers)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # .NET API Backend - Enhanced host networking for macOS Docker Desktop
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: printfarmer-api
    ports:
      - "5001:5001" # HTTP API / SignalR
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - DB_PROVIDER=Sqlite
      - ConnectionStrings__Default=Data Source=/data/farm.db
      - Redis__ConnectionString=redis:6379
      - CORS__AllowedOrigins=${CORS__AllowedOrigins:-http://localhost:3000,http://localhost:8080,http://localhost:5001}
      - DEPLOYMENT_MODE=monolithic
      - SlicerOrchestrator__EnableDistributedSlicing=${ENABLE_DISTRIBUTED_SLICING:-true}
      - ALLOW_LOCAL_NETWORK=true
      - ALLOWED_NETWORK_RANGES=10.0.0.0/24,172.16.0.0/12
      - DOCKER_HOST_NETWORK=false
      - ENABLE_LOCAL_NETWORK_ACCESS=true
      - DISCOVERY_PORTS=7125,80
      # Persist model storage & gcode library (map to host)
      - ModelStorage__Path=/app/models
      - GCODE_LIBRARY_ROOT=/app/wwwroot/gcode-library
      # Optional Spoolman integration (values may be overridden by .env file generated via deploy script)
      - SPOOLMAN_ENABLED=${SPOOLMAN_ENABLED:-}
      - SPOOLMAN_BASE_URL=${SPOOLMAN_BASE_URL:-}
      - SPOOLMAN_PORT=${SPOOLMAN_PORT:-}
      # Application Settings - Pre-populate Setup Wizard
      - PFARM__Spoolman__BaseUrl=${PFARM__Spoolman__BaseUrl:-}
      - PFARM__NetworkDiscovery__EnableDiscovery=${PFARM__NetworkDiscovery__EnableDiscovery:-true}
      - PFARM__NetworkDiscovery__DiscoverySubnets=${PFARM__NetworkDiscovery__DiscoverySubnets:-}
      # Required JWT signing key (32+ chars) for auth configuration
      - Jwt__Key=dev-super-secret-key-change-this-please-1234567890
    volumes:
      - app_data:/data
      - model_uploads:/app/uploads
      - gcode_storage:/app/gcode
      - slicer_profiles:/app/profiles
      - ./wwwroot/gcode-library:/app/wwwroot/gcode-library
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:5001/healthz && curl -f http://localhost:5001/health | grep -q 'Healthy' && curl -f http://localhost:5001/api/signalrtest/connection-stats"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  # React Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: printfarmer-frontend
    ports:
      - "3000:80"
    environment:
      # Point directly at API (no nginx proxy needed in local dev stack script)
      - VITE_API_BASE_URL=http://localhost:5001/api
      - VITE_SIGNALR_PRINTERS_URL=http://localhost:5001/hubs/printers
      - VITE_SIGNALR_HARVEST_URL=http://localhost:5001/hubs/harvest
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # OrcaSlicer Binary Layer (cached layer for binary assets)
  orcaslicer-binaries:
    build:
      context: .
      dockerfile: Dockerfile.orcaslicer-binaries
      args:
        ORCASLICER_VERSION: ${ORCASLICER_VERSION:-2.3.1}
        ALLOW_STUB: "false"  # Production: require real OrcaSlicer binary
        # Optional: GitHub token for API rate limiting
        # GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: orcaslicer-binaries:${ORCASLICER_VERSION:-2.3.1}
    profiles:
      - orca
      - orca-binaries

  # OrcaSlicer Worker for distributed slicing
  orcaslicer-worker:
    build:
      context: .
      dockerfile: Dockerfile.orcaslicer
      args:
        ALLOW_STUB: "false"  # Production: require real OrcaSlicer binary
        ORCASLICER_VERSION: ${ORCASLICER_VERSION:-2.3.1}
    image: printfarmer-orcaslicer-worker
    profiles:
      - orca
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - ConnectionStrings__Redis=redis:6379
      - Worker__StorageEndpoint=${MONO_API_ENDPOINT:-http://api:5001}
      - Worker__WorkingDirectory=/app/temp
      - Worker__OrcaSlicerPath=/usr/local/bin/orcaslicer
      - Worker__WorkerId=orcaslicer-worker-1
      - Worker__MaxConcurrentJobs=1
      - Worker__MaxMemoryMb=1024
    volumes:
      - orcaslicer_temp:/app/temp
      - gcode_storage:/app/gcode
    depends_on:
      orcaslicer-binaries:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 1024
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # PrusaSlicer Worker for distributed slicing
  prusaslicer-worker:
    build:
      context: .
      dockerfile: Dockerfile.prusaslicer
      args:
        ALLOW_STUB: "false"  # Production: require real PrusaSlicer binary
        PRUSASLICER_VERSION: ${PRUSASLICER_VERSION:-2.9.3}
    image: printfarmer-prusaslicer-worker
    profiles:
      - prusa
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8082
      - ConnectionStrings__Redis=redis:6379
      - Worker__StorageEndpoint=${MONO_API_ENDPOINT:-http://api:5001}
      - Worker__WorkingDirectory=/app/temp
      - Worker__PrusaSlicerPath=/usr/local/bin/prusa-slicer
      - Worker__WorkerId=prusaslicer-worker-1
      - Worker__MaxConcurrentJobs=1
      - Worker__MaxMemoryMb=1024
    volumes:
      - prusaslicer_temp:/app/temp
      - gcode_storage:/app/gcode
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # PrusaSlicer takes longer to install
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 1024
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Optional: Load balancer for production
  nginx-proxy:
    image: nginx:alpine
    profiles:
      - proxy
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx-microservices.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - orcaslicer-worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - printfarmer-network

volumes:
  redis_data:
  app_data:
  model_uploads:
  gcode_storage:
  slicer_profiles:
  orcaslicer_temp:
  prusaslicer_temp:
