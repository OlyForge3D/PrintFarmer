version: '3.8'

services:
  # Redis for caching and SignalR backplane
  redis:
    image: redis:7-alpine
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # .NET API Backend - Enhanced host networking for macOS Docker Desktop
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true  # Required for enhanced network access on macOS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - DB_PROVIDER=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/data/farm.db
      - Redis__ConnectionString=localhost:6379
      - CORS__AllowedOrigins=http://localhost:3000,http://localhost:8080,http://localhost:5001
      - DEPLOYMENT_MODE=microservices
      - ALLOW_LOCAL_NETWORK=true
      - ALLOWED_NETWORK_RANGES=10.0.0.0/24,172.16.0.0/12
      - DOCKER_HOST_NETWORK=true
      - ENABLE_LOCAL_NETWORK_ACCESS=true
    volumes:
      - app_data:/data
      - model_uploads:/app/uploads
      - gcode_storage:/app/gcode
      - slicer_profiles:/app/profiles
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:5001/healthz && curl -f http://localhost:5001/health | grep -q 'Healthy' && curl -f http://localhost:5001/api/signalrtest/connection-stats"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  # React Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_SIGNALR_URL=http://localhost:5001/hubs/printers
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Load balancer for production
  nginx-proxy:
    image: nginx:alpine
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx/nginx-microservices.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  app_data:
  model_uploads:
  gcode_storage:
  slicer_profiles:
