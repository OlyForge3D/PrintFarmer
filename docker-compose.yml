services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: printfarmer-api:latest
    container_name: printfarmer-api
    environment:
      # Database provider selection: SqlServer (default), Sqlite, Postgres, MySql
      - DB_PROVIDER=SqlServer
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ASPNETCORE_ENVIRONMENT=Production
      # SQL Server connection string for containerized SQL Server
      - ConnectionStrings__Default=Server=sqlserver;Database=forgeiq;User Id=sa;Password=PrintFarm123!;TrustServerCertificate=True;
      - ConnectionStrings__SqlServer=Server=sqlserver;Database=forgeiq;User Id=sa;Password=PrintFarm123!;TrustServerCertificate=True;
      - DB_INIT_MODE=EnsureCreated
      # Restrict CORS origins (comma-separated). Example for local dev via Nginx HTTP/HTTPS
      - ALLOWED_ORIGINS=http://localhost:8081,https://localhost:8443
      # Examples to use a different RDBMS (uncomment and update as needed):
      # - DB_PROVIDER=Sqlite
      # - ConnectionStrings__Sqlite=Data Source=/data/farm.db
      # - DB_PROVIDER=Postgres
      # - ConnectionStrings__Postgres=Host=postgres;Database=forgeiq;Username=postgres;Password=postgres
      # - DB_PROVIDER=MySql
      # - ConnectionStrings__MySql=Server=mysql;Database=forgeiq;User=root;Password=example;
    ports:
      - "5088:8080"
    extra_hosts:
      # Enable container to access host network for printer discovery
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent storage for application data
      - printfarmer-data:/data
    depends_on:
      - sqlserver
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: printfarmer-sqlserver
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: PrintFarm123!
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      # Persistent storage for SQL Server database
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: printfarmer-web:latest
    container_name: printfarmer-web
    environment:
      # Configure API base URL for Blazor client
      - API_BASE_URL=http://localhost:8081
    depends_on:
      - api
    ports:
      - "8081:8080"
      - "8443:8443"
    restart: unless-stopped

volumes:
  # Persistent volume for application data  
  printfarmer-data:
    driver: local
  # Persistent volume for SQL Server database
  # This ensures database survives container rebuilds and restarts
  sqlserver-data:
    driver: local
  # Volumes for optional database services (used with docker-compose.override.yml)
  postgres-data:
    driver: local
  mysql-data:
    driver: local
