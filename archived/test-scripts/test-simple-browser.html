<!DOCTYPE html>
<html>
<head>
    <title>Simple Browser Test</title>
</head>
<body>
    <h1>Simple Browser Test</h1>
    <div id="test">Loading...</div>
    <script type="module">
        console.log('ES Module support:', true);
        document.getElementById('test').innerHTML = 'ES Modules work!';
        
        // Test React/JSX support
        try {
            const div = document.createElement('div');
            div.innerHTML = '<p>JavaScript is working</p>';
            document.body.appendChild(div);
        } catch (e) {
            console.error('JavaScript error:', e);
            document.getElementById('test').innerHTML = 'JavaScript error: ' + e.message;
        }
    </script>
    <script>
        console.log('Regular script support:', true);
    </script>
</body>
</html>
