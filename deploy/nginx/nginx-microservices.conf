events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # DNS resolver for hostname resolution (required for proxy_pass with hostnames)
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    # Use Docker Compose service names and their internal container ports
    # so nginx (running in its own container) can resolve and reach services.
    upstream api_backend {
        # When API runs in host network mode on a VM, we need to reach it via the host IP.
        # The docker-compose.yml extra_hosts entry maps 'host.docker.internal' to 'host-gateway'.
        # For Linux VMs, this may resolve to 172.17.0.1 (docker0 bridge) or the actual host IP.
        # Nginx will try host.docker.internal first, then fallback to the api service name
        # (which would only work if API was on the bridge network).
        server host.docker.internal:5245 max_fails=3 fail_timeout=10s;
        server api:5245 backup max_fails=1 fail_timeout=5s;
    }

    upstream frontend_backend {
        # Frontend container serves on port 80 internally (Nginx inside the frontend image)
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoints - proxy to API for proper JSON responses
        location = /healthz {
            proxy_pass http://api_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        location = /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        # API routes
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # SignalR WebSocket routes
        location /hubs/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoints (map /api/healthz to API's /healthz)
        location /api/healthz {
            proxy_pass http://api_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend routes (SPA)
        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
