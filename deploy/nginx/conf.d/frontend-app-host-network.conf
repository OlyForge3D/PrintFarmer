server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets (immutable build output)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dedicated health check endpoint
    # NOTE: 'default_type' must appear BEFORE 'return' so Content-Type is correct.
    location /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 200 "OK\n";
    }

    location = /ca.cer {
        alias /etc/nginx/certs/ca.cer;
        default_type application/x-x509-ca-cert;
        add_header Cache-Control "no-store" always;
    }

    location = /install-ca {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Install PrintFarmer CA</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:48rem;margin:0 auto;padding:2rem;line-height:1.5;color:#111827}h1{font-size:1.75rem;margin-bottom:0.5rem}a.button{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:0.85rem 1.1rem;border-radius:0.6rem;font-weight:600;margin:1rem 0}ol{padding-left:1.25rem}code{background:#f3f4f6;padding:0.15rem 0.35rem;border-radius:0.3rem}</style></head><body><h1>Install the PrintFarmer iPhone certificate</h1><p>Use Safari on your iPhone or iPad.</p><p><a class="button" href="/ca.cer">Download PrintFarmer CA</a></p><ol><li>Tap <strong>Download</strong> when Safari asks.</li><li>Open <strong>Settings</strong>. You should see <strong>Profile Downloaded</strong> near the top.</li><li>Tap the downloaded profile and choose <strong>Install</strong>.</li><li>Then go to <strong>Settings &gt; General &gt; About &gt; Certificate Trust Settings</strong>.</li><li>Enable trust for <strong>PrintFarmer Local CA</strong>.</li><li>Return to the PrintFarmer app and sign in again.</li></ol><p>If you are opening this page over <code>http://</code>, that is expected. The certificate must be installed before iPhone will trust your local <code>https://</code> server.</p></body></html>';
    }

    # Explicit index.html handling (ensures aggressive no-cache just for HTML shell)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # SPA routing fallback (other unmatched routes)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Proxy API requests to backend service on host network
    # For host network mode: API runs on host machine at port 5245
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:5245; # path /api/... retained
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Proxy SignalR hub (WebSockets & long polling) – covers /hubs/printers
    location ^~ /hubs/ {
        proxy_pass http://host.docker.internal:5245; # forwards /hubs/... unchanged
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
