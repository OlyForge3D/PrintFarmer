# Nginx reverse proxy for PrintFarmer — Monolithic Mode (default)
#
# All API and SignalR traffic routes to the single main API backend.
# For split deployment (slicer as separate service), use
# deploy/nginx/nginx-proxy-split.conf instead.

user nginx;
worker_processes auto;

# Use a pid file path that nginx user can write to (default /var/run/nginx.pid fails)
pid /var/cache/nginx/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;  # Allow large 3D model and gcode file uploads

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # DNS resolver for hostname resolution (required for proxy_pass with hostnames)
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    # Use Docker Compose service names and their internal container ports
    # so nginx (running in its own container) can resolve and reach services.
    upstream api_backend {
        # In microservices mode, both API and nginx are on the same bridge network
        # Use the service name to reach the API container
        server api:5245;
    }

    upstream frontend_backend {
        # Frontend container serves on port 80 internally (Nginx inside the frontend image)
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoints - proxy to API for proper JSON responses
        location = /healthz {
            proxy_pass http://api_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        location = /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        location = /ca.cer {
            alias /etc/nginx/certs/ca.cer;
            default_type application/x-x509-ca-cert;
            add_header Cache-Control "no-store" always;
        }

        location = /install-ca {
            default_type text/html;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Install PrintFarmer CA</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:48rem;margin:0 auto;padding:2rem;line-height:1.5;color:#111827}h1{font-size:1.75rem;margin-bottom:0.5rem}a.button{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:0.85rem 1.1rem;border-radius:0.6rem;font-weight:600;margin:1rem 0}ol{padding-left:1.25rem}code{background:#f3f4f6;padding:0.15rem 0.35rem;border-radius:0.3rem}</style></head><body><h1>Install the PrintFarmer iPhone certificate</h1><p>Use Safari on your iPhone or iPad.</p><p><a class="button" href="/ca.cer">Download PrintFarmer CA</a></p><ol><li>Tap <strong>Download</strong> when Safari asks.</li><li>Open <strong>Settings</strong>. You should see <strong>Profile Downloaded</strong> near the top.</li><li>Tap the downloaded profile and choose <strong>Install</strong>.</li><li>Then go to <strong>Settings &gt; General &gt; About &gt; Certificate Trust Settings</strong>.</li><li>Enable trust for <strong>PrintFarmer Local CA</strong>.</li><li>Return to the PrintFarmer app and sign in again.</li></ol><p>If you are opening this page over <code>http://</code>, that is expected. The certificate must be installed before iPhone will trust your local <code>https://</code> server.</p></body></html>';
        }

        # API routes
        # Dispatch can take a long time (e.g., uploading large G-code over slow networks).
        # Use a higher timeout for this endpoint to avoid 504 Gateway Time-out from nginx.
        location ~ ^/api/job-queue/[^/]+/dispatch$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # SignalR WebSocket routes
        location /hubs/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Grafana — open proxy (auth handled by Grafana itself)
        location /grafana/ {

            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-WEBAUTH-USER admin;
            # WebSocket support for Grafana Live
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Strip Grafana's own framing/CSP headers; nginx server-level
            # add_header X-Frame-Options handles it for non-embed pages.
            # Embedded panels need framing allowed, so we omit X-Frame-Options here.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # Jaeger UI — open proxy
        location /jaeger/ {

            set $jaeger_upstream http://jaeger:16686;
            proxy_pass $jaeger_upstream/jaeger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoints (map /api/healthz to API's /healthz)
        location /api/healthz {
            proxy_pass http://api_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend routes (SPA)
        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTTPS server – mirrors the HTTP server block above.
    # Certs are expected at /etc/nginx/certs/tls-fullchain.crt + tls.key.
    # Generate self-signed certs with: scripts/generate-certs.sh
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls-fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Health check endpoints
        location = /healthz {
            proxy_pass http://api_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        location = /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        location = /ca.cer {
            alias /etc/nginx/certs/ca.cer;
            default_type application/x-x509-ca-cert;
            add_header Cache-Control "no-store" always;
        }

        location = /install-ca {
            default_type text/html;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Install PrintFarmer CA</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:48rem;margin:0 auto;padding:2rem;line-height:1.5;color:#111827}h1{font-size:1.75rem;margin-bottom:0.5rem}a.button{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:0.85rem 1.1rem;border-radius:0.6rem;font-weight:600;margin:1rem 0}ol{padding-left:1.25rem}code{background:#f3f4f6;padding:0.15rem 0.35rem;border-radius:0.3rem}</style></head><body><h1>Install the PrintFarmer iPhone certificate</h1><p>Use Safari on your iPhone or iPad.</p><p><a class="button" href="/ca.cer">Download PrintFarmer CA</a></p><ol><li>Tap <strong>Download</strong> when Safari asks.</li><li>Open <strong>Settings</strong>. You should see <strong>Profile Downloaded</strong> near the top.</li><li>Tap the downloaded profile and choose <strong>Install</strong>.</li><li>Then go to <strong>Settings &gt; General &gt; About &gt; Certificate Trust Settings</strong>.</li><li>Enable trust for <strong>PrintFarmer Local CA</strong>.</li><li>Return to the PrintFarmer app and sign in again.</li></ol><p>If you are opening this page over <code>http://</code>, that is expected. The certificate must be installed before iPhone will trust your local <code>https://</code> server.</p></body></html>';
        }

        # G-code dispatch (large uploads, long timeout)
        location ~ ^/api/job-queue/[^/]+/dispatch$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # API routes
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # SignalR WebSocket routes
        location /hubs/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Grafana — open proxy (auth handled by Grafana itself)
        location /grafana/ {

            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-WEBAUTH-USER admin;
            # WebSocket support for Grafana Live
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Strip Grafana's own framing/CSP headers; nginx server-level
            # add_header X-Frame-Options handles it for non-embed pages.
            # Embedded panels need framing allowed, so we omit X-Frame-Options here.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # Jaeger UI — open proxy
        location /jaeger/ {

            set $jaeger_upstream http://jaeger:16686;
            proxy_pass $jaeger_upstream/jaeger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check API mappings
        location /api/healthz {
            proxy_pass http://api_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend routes (SPA)
        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
