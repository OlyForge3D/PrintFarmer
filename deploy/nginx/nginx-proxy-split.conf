# Nginx reverse proxy for PrintFarmer — Split Deployment Mode
#
# In this mode, slicer-related API routes and SignalR hubs are forwarded to
# the standalone Farm.Slicer.Host service (port 5246) while all other
# API routes continue to reach the main API (port 5245).
#
# To use monolithic mode (all routes → main API), mount
# deploy/nginx/nginx-proxy.conf instead.

user nginx;
worker_processes auto;

pid /var/cache/nginx/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;  # Allow large 3D model and gcode file uploads

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # DNS resolver for hostname resolution (required for proxy_pass with hostnames)
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    # ── Upstreams ──────────────────────────────────────────────────────────

    upstream api_backend {
        server api:5245;
    }

    upstream slicer_backend {
        server slicer-host:5246;
    }

    upstream frontend_backend {
        server frontend:80;
    }

    # ── Reusable proxy header maps ─────────────────────────────────────────

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP server ────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name localhost;

        # ── Health checks ──────────────────────────────────────────────────

        location = /healthz {
            proxy_pass http://api_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        location = /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        # Slicer host health (optional, for monitoring)
        location = /slicer/healthz {
            proxy_pass http://slicer_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
        }

        location = /ca.cer {
            alias /etc/nginx/certs/ca.cer;
            default_type application/x-x509-ca-cert;
            add_header Cache-Control "no-store" always;
        }

        location = /install-ca {
            default_type text/html;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Install PrintFarmer CA</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:48rem;margin:0 auto;padding:2rem;line-height:1.5;color:#111827}h1{font-size:1.75rem;margin-bottom:0.5rem}a.button{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:0.85rem 1.1rem;border-radius:0.6rem;font-weight:600;margin:1rem 0}ol{padding-left:1.25rem}code{background:#f3f4f6;padding:0.15rem 0.35rem;border-radius:0.3rem}</style></head><body><h1>Install the PrintFarmer iPhone certificate</h1><p>Use Safari on your iPhone or iPad.</p><p><a class="button" href="/ca.cer">Download PrintFarmer CA</a></p><ol><li>Tap <strong>Download</strong> when Safari asks.</li><li>Open <strong>Settings</strong>. You should see <strong>Profile Downloaded</strong> near the top.</li><li>Tap the downloaded profile and choose <strong>Install</strong>.</li><li>Then go to <strong>Settings &gt; General &gt; About &gt; Certificate Trust Settings</strong>.</li><li>Enable trust for <strong>PrintFarmer Local CA</strong>.</li><li>Return to the PrintFarmer app and sign in again.</li></ol><p>If you are opening this page over <code>http://</code>, that is expected. The certificate must be installed before iPhone will trust your local <code>https://</code> server.</p></body></html>';
        }

        # ── Slicer API routes → slicer_backend ─────────────────────────────
        # These MUST appear before the generic /api/ block.

        location /api/slicers/ {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /api/workers/ {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /api/artifacts/ {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /api/3d-models/ {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /api/slice-jobs/ {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /api/slicing/ {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /api/slicer/ {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # Slicer admin routes (prefix-matched to avoid capturing other admin routes)
        location /api/admin/slicer {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # ── Slicer SignalR hubs → slicer_backend ───────────────────────────

        location /hubs/slicer-registry {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /hubs/slicers {
            proxy_pass http://slicer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
