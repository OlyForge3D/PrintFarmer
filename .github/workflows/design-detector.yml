name: Design detector

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: design-detector-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  design-detector:
    name: Design detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install design detector dependencies
        run: npm ci --ignore-scripts

      - name: Run changed UI design checks
        env:
          DESIGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DESIGN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/design/check-ui-design.mjs --base "$DESIGN_BASE_SHA" --head "$DESIGN_HEAD_SHA" --json
