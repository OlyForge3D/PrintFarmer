name: PrusaSlicer Strict Build

# Manual dispatch only. Heavy builds are only run when explicitly dispatched.
on:
  workflow_dispatch:
    inputs:
      disable_slicer_builds:
        description: 'Set to true to skip the Prusa strict build when dispatching manually'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  build-prusaslicer-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        prusa_version: ["2.9.3"]
        allow_stub: [false]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check dispatch input (disable_slicer_builds)
        id: check
        run: |
          SKIP=false
          INPUT_VAL="${{ github.event.inputs.disable_slicer_builds || 'true' }}"
          if [ "${INPUT_VAL}" = 'true' ] || [ "${INPUT_VAL}" = '1' ]; then
            SKIP=true
          fi
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Set up QEMU (optional for multi-arch)
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build slicer-base (amd64)
        if: steps.check.outputs.skip != 'true'
        run: |
          docker build --platform linux/amd64 -f Dockerfile.slicer-base -t printfarmer-slicer-base:latest .

      - name: Attempt to download preseeded Prusa AppImage artifact
        if: steps.check.outputs.skip != 'true'
        id: preseed
        run: |
          set -e
          ART_NAME=prusa-appimage-${{ matrix.prusa_version }}.AppImage
          echo "Looking for artifact $ART_NAME in previous artifact storage (if available)"
          # Try GitHub artifacts via the artifacts API (best-effort read-only, may require curl + token)
          if curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | jq -r '.artifacts[].name' | grep -q "prusa-appimage-${{ matrix.prusa_version }}"; then
            echo "Found artifact listing entry; attempting to download via actions/download-artifact"
            mkdir -p preseed || true
            # Use download-artifact action would be ideal but we emulate a best-effort curl fallback
            echo "No direct download implemented; skipping automated artifact download in this runner."
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build PrusaSlicer Worker (strict real binary)
        if: steps.check.outputs.skip != 'true'
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHA='${{ github.sha }}'
          TAG=''
          TOKEN='${{ secrets.GITHUB_TOKEN }}'
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG='${{ github.event.release.tag_name }}'
            RELEASE_BODY='${{ github.event.release.body }}'
          elif echo "${GITHUB_REF:-}" | grep -q '^refs/tags/'; then
            TAG=${GITHUB_REF#refs/tags/}
            RELEASE_BODY=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/tags/$TAG" | jq -r '.body // ""' 2>/dev/null || true)
          else
            RELEASE_BODY=''
          fi
          RELEASE_BODY_SANITIZED=$(printf "%s" "$RELEASE_BODY" | tr '\n' ' ' | sed 's/"/'"'"'/g' | cut -c1-1000)

          if [ "${{ steps.preseed.outputs.found }}" = "true" ] && [ -f preseed/prusa.AppImage ]; then
            echo "Using preseeded prusa.AppImage via buildkit secret"
            docker build --platform linux/amd64 --secret id=prusa,src=preseed/prusa.AppImage \
              --build-arg PRUSASLICER_VERSION=${{ matrix.prusa_version }} --build-arg ALLOW_STUB=${{ matrix.allow_stub }} --build-arg GITHUB_TOKEN=${GITHUB_TOKEN} \
              --label "org.opencontainers.image.revision=${SHA}" --label "org.opencontainers.image.created=${TIMESTAMP}" \
              $( [ -n "$RELEASE_BODY_SANITIZED" ] && printf -- "--label \"org.opencontainers.image.description=%s\" " "$RELEASE_BODY_SANITIZED" || true) \
              -f Dockerfile.prusaslicer -t prusaslicer-worker:strict-${{ matrix.prusa_version }} .
          else
            echo "No preseeded AppImage available; performing normal build (will attempt remote download)"
            docker build --platform linux/amd64 --build-arg PRUSASLICER_VERSION=${{ matrix.prusa_version }} --build-arg ALLOW_STUB=${{ matrix.allow_stub }} --build-arg GITHUB_TOKEN=${GITHUB_TOKEN} \
              --label "org.opencontainers.image.revision=${SHA}" --label "org.opencontainers.image.created=${TIMESTAMP}" \
              $( [ -n "$RELEASE_BODY_SANITIZED" ] && printf -- "--label \"org.opencontainers.image.description=%s\" " "$RELEASE_BODY_SANITIZED" || true) \
              -f Dockerfile.prusaslicer -t prusaslicer-worker:strict-${{ matrix.prusa_version }} .
          fi

      - name: Run verification (require-real)
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x scripts/verify-prusaslicer-worker.sh
          docker run -d --name prusa-test-${{ matrix.prusa_version }} prusaslicer-worker:strict-${{ matrix.prusa_version }}
          sleep 6
          scripts/verify-prusaslicer-worker.sh require-real prusaslicer-worker:strict-${{ matrix.prusa_version }} prusa-test-${{ matrix.prusa_version }}

      - name: Show logs on failure
        if: steps.check.outputs.skip != 'true' && failure()
        run: |
          docker logs prusa-test-${{ matrix.prusa_version }} || true

      - name: Cleanup
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          docker rm -f prusa-test-${{ matrix.prusa_version }} || true
          docker image rm prusaslicer-worker:strict-${{ matrix.prusa_version }} || true
