name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vX.Y.Z)'
        required: true
      prerelease:
        description: 'Is prerelease? (true/false)'
        required: false
        default: 'false'

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write

jobs:
  tag-and-build:
    runs-on: ubuntu-latest
    concurrency:
      group: 'release-${{ github.event.inputs.version }}'
      cancel-in-progress: false
    steps:
      - name: Checkout (with PAT for push)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}

      - name: Verify release version metadata
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be vX.Y.Z"
            exit 1
          fi
          bash scripts/sync-monorepo-version.sh --check
          REPOSITORY_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${REPOSITORY_VERSION#v}" != "${VERSION#v}" ]]; then
            echo "Requested release $VERSION does not match VERSION ($REPOSITORY_VERSION)"
            exit 1
          fi

      - name: Create and push tag
        run: |
          set -e
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          TAG="${{ github.event.inputs.version }}"
          echo "Creating and pushing tag $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; aborting to avoid overwrite."; exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - name: Call container workflow (API)
        run: echo "Containers workflow will run automatically on tag push."
  generate-release:
    runs-on: ubuntu-latest
    needs: tag-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.version }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Determine previous tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' --exclude "${{ github.event.inputs.version }}" 2>/dev/null || true)
          echo "prev_tag=$PREV" >> $GITHUB_OUTPUT
      - name: Generate changelog (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current-tag ${{ github.event.inputs.version }} ${{ steps.prev.outputs.prev_tag && format('--previous-tag {0}', steps.prev.outputs.prev_tag) || '' }}
      - name: Wait for exact-tag Docker workflow
        id: docker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse "${VERSION}^{commit}")"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list \
              --workflow docker-publish.yml \
              --branch "$VERSION" \
              --commit "$COMMIT" \
              --event push \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "Could not find the Docker workflow for $VERSION ($COMMIT)"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download Docker release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.docker.outputs.run_id }}" \
            --pattern 'sbom-*' \
            --dir artifacts
          gh run download "${{ steps.docker.outputs.run_id }}" \
            --pattern 'digest-*' \
            --dir artifacts
      - name: Require and revalidate all image artifacts
        run: |
          set -euo pipefail
          IMAGES=(api frontend printer-discovery orcaslicer-worker monolith)
          for image in "${IMAGES[@]}"; do
            digest_file="artifacts/digest-${image}/digest-${image}.txt"
            if [[ ! -s "$digest_file" ]]; then
              echo "Missing digest artifact for $image"
              exit 1
            fi
            digest="$(tr -d '[:space:]' < "$digest_file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest artifact for $image: $digest"
              exit 1
            fi
            mapfile -d '' sboms < <(
              find "artifacts/sbom-${image}" -maxdepth 1 -type f -name '*.spdx.json' -print0
            )
            if [[ "${#sboms[@]}" -ne 1 ]]; then
              echo "Expected exactly one SPDX SBOM artifact for $image, found ${#sboms[@]}"
              exit 1
            fi
            node scripts/compliance/validate-compliance.mjs \
              --skip-dependencies \
              --sbom "${sboms[0]}"
          done
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Gather release notes skeleton
        run: |
          echo "## Release ${VERSION}" > RELEASE_NOTES.md
          echo "Images built and signed." >> RELEASE_NOTES.md
          echo "### Digests" >> RELEASE_NOTES.md
          grep -R "^sha256:" -h artifacts/digest-*/* >> RELEASE_NOTES.md || true
          echo "### SBOM Files" >> RELEASE_NOTES.md
          find artifacts -name '*.spdx.json' -maxdepth 4 -print >> RELEASE_NOTES.md || true
          echo "### License and Corresponding Source" >> RELEASE_NOTES.md
          echo "- License: GNU AGPL v3.0 only (AGPL-3.0-only)" >> RELEASE_NOTES.md
          echo "- Exact source archive: PrintFarmer-${VERSION}-source.tar.gz" >> RELEASE_NOTES.md
          echo "- Source manifest: PrintFarmer-${VERSION}-source.json" >> RELEASE_NOTES.md
          echo "- Third-party notices: THIRD-PARTY-NOTICES.md" >> RELEASE_NOTES.md
          echo "### Changes" >> RELEASE_NOTES.md
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' --exclude ${VERSION} 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            echo "Comparing $PREV_TAG...${VERSION}" >> RELEASE_NOTES.md
            git log --pretty=format:'- %s (%h)' $PREV_TAG..HEAD >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "### Detailed Diff" >> RELEASE_NOTES.md
            echo "https://github.com/${{ github.repository }}/compare/$PREV_TAG...${VERSION}" >> RELEASE_NOTES.md
          else
            echo "Initial tagged release." >> RELEASE_NOTES.md
          fi
          echo "### Conventional Commit Summary" >> RELEASE_NOTES.md
          git log --pretty=format:'%s' $(git rev-list --max-parents=0 HEAD)..HEAD | \
            awk '/^feat/ {feat++} /^fix/ {fix++} /^docs/ {docs++} /^refactor/ {ref++} END {print "- Features: " feat "\n- Fixes: " fix "\n- Docs: " docs "\n- Refactors: " ref}' >> RELEASE_NOTES.md
          echo "\n### Changelog (git-cliff)" >> RELEASE_NOTES.md
          echo '${{ steps.cliff.outputs.changelog }}' >> RELEASE_NOTES.md
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: Verify all image signatures and SPDX attestations
        env:
          VERSION: ${{ github.event.inputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          CERTIFICATE_IDENTITY="https://github.com/${REPOSITORY}/.github/workflows/docker-publish.yml@refs/tags/${VERSION}"
          IMAGES=(api frontend printer-discovery orcaslicer-worker monolith)
          for image in "${IMAGES[@]}"; do
            digest="$(tr -d '[:space:]' < "artifacts/digest-${image}/digest-${image}.txt")"
            reference="ghcr.io/${OWNER_LC}/printfarmer-${image}@${digest}"
            cosign verify "$reference" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            cosign verify-attestation "$reference" \
              --type spdxjson \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          echo "All image signatures and SPDX attestations verified." >> RELEASE_NOTES.md

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false

      - name: Append Scorecard summary
        run: |
          if [ -f scorecard.json ]; then
            SCORE=$(jq -r '.score' scorecard.json 2>/dev/null || echo 'N/A')
            echo "### OpenSSF Scorecard" >> RELEASE_NOTES.md
            echo "Overall Score: ${SCORE}" >> RELEASE_NOTES.md
            echo "Key Checks:" >> RELEASE_NOTES.md
            jq -r '.checks[] | select(.name=="Code-Review" or .name=="Vulnerabilities" or .name=="Dependency-Update-Tool" or .name=="Branch-Protection") | "- " + .name + ": " + (.score|tostring)' scorecard.json >> RELEASE_NOTES.md || true
          fi
      - name: Finalize GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.inputs.version }}
          tag_name: ${{ github.event.inputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

      - name: Upload RELEASE_NOTES.md as release asset
        if: always()
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          # Use GitHub CLI if available; fall back to curl upload via API
          if command -v gh >/dev/null 2>&1; then
            gh release upload "$VERSION" RELEASE_NOTES.md --clobber || true
          else
            echo "gh not found; attempting direct API upload"
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
            UPLOAD_URL=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/tags/$VERSION" | jq -r .upload_url)
            if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
              # strip the {?name,label} template
              UPLOAD_URL_CLEAN=${UPLOAD_URL%\{*}
              curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: text/plain" --data-binary @RELEASE_NOTES.md "$UPLOAD_URL_CLEAN?name=RELEASE_NOTES.md" || true
            fi
          fi
