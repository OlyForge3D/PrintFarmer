name: Vulnerability Diff Comment

on:
  pull_request:
    branches: [ main ]

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect override label
        id: override
        run: |
          echo "labels: ${{ toJson(github.event.pull_request.labels) }}"
          HAS=$(jq -r '.[].name | ascii_downcase' <<< '${{ toJson(github.event.pull_request.labels) }}' | grep -i '^allow-vulns$' || true)
          if [ -n "$HAS" ]; then echo "override=true" >> $GITHUB_OUTPUT; else echo "override=false" >> $GITHUB_OUTPUT; fi

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-

      - name: Build lightweight SBOM (Syft)
        uses: anchore/sbom-action@v0.17.7
        with:
          path: .
          format: syft-json
          output-file: sbom-pr.json

      - name: Trivy scan (current branch)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-current.json
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Trivy scan (base branch)
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout origin/${{ github.base_ref }}
          trivy fs --format json --output trivy-base.json --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL . || true
          git checkout $GITHUB_HEAD_REF

      - name: Summarize diff
        id: summary
        run: |
          set -e
          ADDED=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | .VulnerabilityID] | unique' trivy-current.json 2>/dev/null || echo '[]')
          BASE=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | .VulnerabilityID] | unique' trivy-base.json 2>/dev/null || echo '[]')
          NEW=$(jq -n --argjson a "$ADDED" --argjson b "$BASE" '$a - $b')
          RES="$(echo $NEW | jq -r '. | length')"
          echo "new_count=$RES" >> $GITHUB_OUTPUT
          echo "new_list=$NEW" >> $GITHUB_OUTPUT
          THRESHOLD=0
          if [ $RES -gt $THRESHOLD ]; then echo "New high/critical vulnerabilities introduced: $RES (threshold $THRESHOLD)" > gating.txt; else echo "No new high/critical vulns" > gating.txt; fi

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ### Vulnerability Diff (HIGH/CRITICAL)
            New findings introduced: ${{ steps.summary.outputs.new_count }}
            ```json
            ${{ steps.summary.outputs.new_list }}
            ```
            Gating: $(cat gating.txt)
            Override label present: ${{ steps.override.outputs.override }}

      - name: Fail if gating threshold exceeded
        run: |
          if [ '${{ steps.override.outputs.override }}' = 'true' ]; then
            echo "Override label allow-vulns present: skipping failure."; exit 0; fi
          if grep -q 'threshold 0' gating.txt; then
            echo "Blocking PR due to new HIGH/CRITICAL vulnerabilities"; exit 1; fi
