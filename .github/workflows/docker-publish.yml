name: Protected release publication

on:
  workflow_call:
    inputs:
      transaction:
        description: Immutable same-run release transaction binding
        type: string
        required: true
    outputs:
      public_identity:
        description: Redacted canonical release identity
        value: ${{ jobs.publish.outputs.public_identity }}
      published_set_digest:
        description: SHA-256 digest of the verified complete release set
        value: ${{ jobs.publish.outputs.published_set_digest }}

permissions:
  contents: read

concurrency:
  group: release-publication-${{ fromJSON(inputs.transaction).channel == 'stable' && 'stable' || 'insider' }}
  cancel-in-progress: false

env:
  RELEASE_SIGNER_IDENTITY: https://github.com/OlyForge3D/PrintFarmer/.github/workflows/docker-publish.yml@refs/heads/development

jobs:
  publish:
    name: Authorize and publish immutable release
    runs-on: ubuntu-latest
    environment: ${{ fromJSON(inputs.transaction).channel == 'stable' && 'release-stable' || 'release-insider' }}
    permissions:
      contents: read
      id-token: write
      actions: read
      checks: read
      statuses: read
      pull-requests: read
      packages: read
    outputs:
      public_identity: ${{ steps.authorize.outputs.public_identity }}
      published_set_digest: ${{ steps.advance.outputs.set_hash }}
    steps:
      - name: Verify invoked immutable control before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
        run: |
          set -euo pipefail
          workflow_commit="$(node --input-type=module -e '
            const value = JSON.parse(process.env.RELEASE_TRANSACTION);
            if (!/^[a-f0-9]{40}$/.test(value.workflowCommit || "")) process.exit(1);
            process.stdout.write(value.workflowCommit);
          ')"
          [[ "$workflow_commit" == "$GITHUB_WORKFLOW_SHA" ]]
          resolved="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$workflow_commit" --jq .sha)"
          [[ "$resolved" == "$workflow_commit" ]]
      - name: Checkout immutable release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ fromJSON(inputs.transaction).workflowCommit }}
          persist-credentials: false
      - name: Checkout exact qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ fromJSON(inputs.transaction).sourceCommit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-qualification-${{ github.run_id }}
          path: .artifacts/release-transaction
      - name: Validate immutable release transaction before protected credentials
        env:
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
        run: node scripts/ci/release-transaction.mjs validate
      - name: Check selected source version base
        working-directory: source
        run: bash scripts/sync-monorepo-version.sh --check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Recover immutable authorization bytes for an authorized rerun
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t authorization_artifacts < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .name == "release-authorization-1")] | .[].name'
          ) || { echo "Authorization recovery artifact lookup failed"; exit 1; }
          [[ "${#authorization_artifacts[@]}" -eq 1 ]] ||
            { echo "Authorization recovery evidence is absent, ambiguous, or expired"; exit 1; }
          gh run download "$GITHUB_RUN_ID" \
            --name "${authorization_artifacts[0]}" \
            --dir .artifacts/release-authorization
          expected_authorization_assets="$(printf '%s\n' public-identity.bundle.json public-identity.json release-identity.bundle.json release-identity.json | sort)"
          [[ "$(find .artifacts/release-authorization -maxdepth 1 -type f -printf '%f\n' | sort)" == "$expected_authorization_assets" ]] ||
            { echo "Authorization recovery artifact is incomplete or contains unexpected files"; exit 1; }
          for identity in release-identity public-identity; do
            cosign verify-blob --bundle ".artifacts/release-authorization/${identity}.bundle.json" \
              --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ".artifacts/release-authorization/${identity}.json"
          done
      - name: Obtain protected publisher App token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
          permission-checks: read
          permission-statuses: read
          permission-administration: read
          permission-actions: read
      - name: Reserve identity and create the canonical source tag
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          RELEASE_PUBLISHER_APP_ID: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}
          RELEASE_ADMITTED_APPROVAL_MODE: ${{ fromJSON(inputs.transaction).approvalMode }}
          RELEASE_OWNER_APPROVED_REVIEWERS: ${{ secrets.RELEASE_OWNER_APPROVED_REVIEWERS }}
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
          RELEASE_SOURCE_COMMIT: ${{ fromJSON(inputs.transaction).sourceCommit }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
        run: node scripts/ci/release-control.mjs authorize
      - name: Sign immutable authorization
        if: github.run_attempt == 1
        run: |
          set -euo pipefail
          umask 077
          cosign sign-blob --yes \
            --bundle .artifacts/release-authorization/release-identity.bundle.json \
            .artifacts/release-authorization/release-identity.json
          cosign sign-blob --yes \
            --bundle .artifacts/release-authorization/public-identity.bundle.json \
            .artifacts/release-authorization/public-identity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: github.run_attempt == 1
        with:
          name: release-authorization-${{ github.run_attempt }}
          path: |
            .artifacts/release-authorization/release-identity.json
            .artifacts/release-authorization/release-identity.bundle.json
            .artifacts/release-authorization/public-identity.json
            .artifacts/release-authorization/public-identity.bundle.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Consume the signed authorization in this protected job
        id: consume
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_IDENTITY: ${{ steps.authorize.outputs.public_identity }}
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
          RELEASE_SOURCE_COMMIT: ${{ fromJSON(inputs.transaction).sourceCommit }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
        run: node scripts/ci/release-control.mjs consume
      - name: Stage qualified source metadata and canonical artifacts
        env:
          RELEASE_SOURCE_COMMIT: ${{ fromJSON(inputs.transaction).sourceCommit }}
          RELEASE_VERSION: ${{ steps.consume.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_BASE_VERSION="${RELEASE_VERSION#v}"
          RELEASE_BASE_VERSION="${RELEASE_BASE_VERSION%%-*}"
          export RELEASE_BASE_VERSION
          metadata="source/release-metadata/${RELEASE_BASE_VERSION}.json"
          test -s "$metadata"
          node --input-type=module -e '
            import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
            import { dirname, join, resolve } from "node:path";
            import { releaseMetadataEvidence } from "./scripts/ci/release-policy.mjs";
            const record = { sourceCommit: process.env.RELEASE_SOURCE_COMMIT, baseVersion: process.env.RELEASE_BASE_VERSION };
            const bytes = readFileSync(process.argv[1], "utf8");
            const metadata = JSON.parse(bytes);
            const artifacts = Object.fromEntries(Object.values(metadata.schemas).map(schema =>
              [schema.artifact, readFileSync(join("source", schema.artifact))]));
            const target = resolve(".artifacts/release-authorization/source-release-metadata.json");
            mkdirSync(dirname(target), { recursive: true });
            writeFileSync(target, bytes, { mode: 0o600 });
            for (const [path, value] of Object.entries(artifacts)) {
              const destination = resolve(".artifacts/release-authorization/source-artifacts", path);
              mkdirSync(dirname(destination), { recursive: true });
              writeFileSync(destination, value, { mode: 0o600 });
            }
            releaseMetadataEvidence(record, bytes, artifacts, process.env.RELEASE_SOURCE_COMMIT);
          ' "$metadata"
      - name: Validate all revocable controls before publication
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          RELEASE_PUBLISHER_APP_ID: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}
          RELEASE_OWNER_APPROVED_REVIEWERS: ${{ secrets.RELEASE_OWNER_APPROVED_REVIEWERS }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
          RELEASE_PUBLIC_IDENTITY: ${{ steps.authorize.outputs.public_identity }}
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
          RELEASE_SOURCE_COMMIT: ${{ fromJSON(inputs.transaction).sourceCommit }}
        run: node scripts/ci/release-control.mjs preflight
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_REGISTRY_USER }}
          password: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      - uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3  # v0.24.2
      - name: Build, attest and sign the complete immutable image set
        working-directory: source
        env:
          PRINTFARMER_RELEASE_IDENTITY: ${{ steps.consume.outputs.frontend_identity }}
          RELEASE_IDENTITY_HASH: ${{ steps.consume.outputs.identity_hash }}
          RELEASE_VERSION: ${{ steps.consume.outputs.version }}
          RELEASE_CONTAINER_VERSION: ${{ steps.consume.outputs.container_version }}
          RELEASE_SOURCE_ARCHIVE_URL: ${{ steps.consume.outputs.source_archive_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts release-artifacts compliance-artifacts
          node scripts/compliance/validate-compliance.mjs
          node scripts/compliance/create-license-inventory.mjs \
            --output compliance-artifacts/license-inventory.json \
            --version "$RELEASE_VERSION" \
            --revision '${{ fromJSON(inputs.transaction).sourceCommit }}'
          dockerfile="scripts/docker/dockerfiles/Dockerfile.multistage"
          source_sha='${{ fromJSON(inputs.transaction).sourceCommit }}'
          build_component() {
            local image="$1" target="$2" platforms="$3"
            local repository="ghcr.io/olyforge3d/printfarmer-${image}"
            local metadata="artifacts/${image}.json"
            local sbom="release-artifacts/printfarmer-${image}-${RELEASE_VERSION}.spdx.json"
            docker buildx build . \
              --file "$dockerfile" \
              --target "$target" \
              --platform "$platforms" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
              --label "org.opencontainers.image.revision=${{ fromJSON(inputs.transaction).sourceCommit }}" \
              --label "org.opencontainers.image.version=${RELEASE_CONTAINER_VERSION}" \
              --label "org.printfarmer.release-channel=${{ fromJSON(inputs.transaction).channel }}" \
              --label "org.printfarmer.identity-sha256=${RELEASE_IDENTITY_HASH}" \
              --build-arg "GIT_SHA=${source_sha}" \
              --build-arg "VITE_GIT_SHA=${source_sha}" \
              --build-arg "PRINTFARMER_RELEASE_IDENTITY=${PRINTFARMER_RELEASE_IDENTITY}" \
              --build-arg "BUILD_VERSION=${RELEASE_CONTAINER_VERSION}" \
              --build-arg "VCS_REF=${source_sha}" \
              --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --build-arg "SOURCE_ARCHIVE_URL=${RELEASE_SOURCE_ARCHIVE_URL}" \
              --build-arg "SBOM_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/printfarmer-${image}-${RELEASE_VERSION}.spdx.json" \
              --output "type=image,name=${repository},push-by-digest=true,name-canonical=true,push=true" \
              --provenance=mode=max \
              --sbom=true \
              --metadata-file "$metadata"
            local digest
            digest="$(jq -er '."containerimage.digest"' "$metadata")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "$digest" > "release-artifacts/digest-${image}.txt"
            syft "registry:${repository}@${digest}" -o "spdx-json=${sbom}"
            extra=()
            [[ "$image" == frontend || "$image" == monolith ]] && extra+=(--include-npm)
            node scripts/compliance/enrich-sbom.mjs \
              --sbom "$sbom" \
              --inventory compliance-artifacts/license-inventory.json \
              --version "$RELEASE_VERSION" \
              --revision "$source_sha" \
              "${extra[@]}"
            cosign attest --yes --type spdxjson --predicate "$sbom" "${repository}@${digest}"
            cosign sign --yes "${repository}@${digest}"
            platform_digests="$(
              docker buildx imagetools inspect "${repository}@${digest}" --raw |
                jq -r '.manifests[]
                  | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                  | select(.platform.os == "linux")
                  | .digest'
            )"
            [[ -n "$platform_digests" ]]
            while IFS= read -r platform_digest; do
              [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              platform_suffix="${platform_digest#sha256:}"
              platform_sbom="crypto-evidence/platforms/${image}/${platform_suffix}.spdx.json"
              mkdir -p "$(dirname "$platform_sbom")"
              syft "registry:${repository}@${platform_digest}" -o "spdx-json=${platform_sbom}"
              node scripts/compliance/enrich-sbom.mjs \
                --sbom "$platform_sbom" \
                --inventory compliance-artifacts/license-inventory.json \
                --version "$RELEASE_VERSION" \
                --revision "$source_sha" \
                "${extra[@]}"
              cosign attest --yes --type spdxjson --predicate "$platform_sbom" "${repository}@${platform_digest}"
              cosign sign --yes "${repository}@${platform_digest}"
            done <<< "$platform_digests"
          }
          build_component api api-runtime linux/amd64,linux/arm64
          build_component frontend frontend-runtime linux/amd64,linux/arm64
          build_component slicer-host slicer-host-runtime linux/amd64,linux/arm64
          build_component printer-discovery printer-discovery-runtime linux/amd64,linux/arm64
          build_component orcaslicer-worker orcaslicer-worker linux/amd64
          build_component monolith monolith-runtime linux/amd64,linux/arm64
          IMAGES=(api frontend slicer-host printer-discovery orcaslicer-worker monolith)
          for image in "${IMAGES[@]}"; do
            test -s "release-artifacts/digest-${image}.txt"
            test -s "release-artifacts/printfarmer-${image}-${RELEASE_VERSION}.spdx.json"
          done
      - name: Normalize immutable image evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for image in api frontend slicer-host printer-discovery orcaslicer-worker monolith; do
            mkdir -p "artifacts/digest-${image}" "artifacts/sbom-${image}"
            cp "source/release-artifacts/digest-${image}.txt" "artifacts/digest-${image}/"
            cp "source/release-artifacts/printfarmer-${image}-${{ steps.consume.outputs.version }}.spdx.json" \
              "artifacts/sbom-${image}/"
          done
      - name: Generate canonical release notes before signing
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.consume.outputs.version }}
          SOURCE_TAG: ${{ steps.consume.outputs.version }}
          SOURCE_COMMIT: ${{ fromJSON(inputs.transaction).sourceCommit }}
        run: |
          set -euo pipefail
          release_notes=../.artifacts/release-authorization/release-notes.md
          mkdir -p "$(dirname "$release_notes")"
          RELEASE_NOTES_OUTPUT="$release_notes" node ../scripts/ci/release-notes.mjs
          release_notes_sha256="$(sha256sum "$release_notes" | cut -d ' ' -f1)"
          [[ "$release_notes_sha256" =~ ^[a-f0-9]{64}$ ]]
          printf 'RELEASE_NOTES_SHA256=%s\n' "$release_notes_sha256" >> "$GITHUB_ENV"
      - name: Verify every pushed digest signature and SPDX attestation
        run: |
          set -euo pipefail
          evidence_root=.artifacts/release-authorization/crypto-evidence
          for image in api frontend slicer-host printer-discovery orcaslicer-worker monolith; do
            digest="$(tr -d '[:space:]' < "artifacts/digest-${image}/digest-${image}.txt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="ghcr.io/olyforge3d/printfarmer-${image}@${digest}"
            registry_digest="$(
              docker buildx imagetools inspect "$reference" |
                sed -n 's/^Digest:[[:space:]]*//p'
            )"
            [[ "$registry_digest" == "$digest" ]]
            index_evidence="$evidence_root/$image/index"
            mkdir -p "$index_evidence"
            cosign verify --output json "$reference" \
              --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$index_evidence/signature.json"
            cosign verify-attestation --output json "$reference" \
              --type spdxjson \
              --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$index_evidence/attestation.json"
            cosign download signature "$reference" | jq -sc . > "$index_evidence/signature.bundle.json"
            cosign download attestation "$reference" | jq -sc . > "$index_evidence/attestation.bundle.json"
            cp "artifacts/sbom-${image}/printfarmer-${image}-${{ steps.consume.outputs.version }}.spdx.json" \
              "$index_evidence/predicate.json"
            platform_digests="$(
              docker buildx imagetools inspect "$reference" --raw |
                jq -r '.manifests[]
                  | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                  | select(.platform.os == "linux")
                  | "\(.platform.os)/\(.platform.architecture) \(.digest)"'
            )"
            [[ -n "$platform_digests" ]]
            while read -r platform platform_digest; do
              [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              platform_reference="ghcr.io/olyforge3d/printfarmer-${image}@${platform_digest}"
              platform_evidence="$evidence_root/$image/platforms/${platform//\//-}"
              platform_suffix="${platform_digest#sha256:}"
              mkdir -p "$platform_evidence"
              cosign verify --output json "$platform_reference" \
                --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$platform_evidence/signature.json"
              cosign verify-attestation --output json "$platform_reference" \
                --type spdxjson \
                --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$platform_evidence/attestation.json"
              cosign download signature "$platform_reference" | jq -sc . > "$platform_evidence/signature.bundle.json"
              cosign download attestation "$platform_reference" | jq -sc . > "$platform_evidence/attestation.bundle.json"
              cp "source/crypto-evidence/platforms/${image}/${platform_suffix}.spdx.json" \
                "$platform_evidence/predicate.json"
            done <<< "$platform_digests"
          done
      - name: Validate complete immutable set and stage verifier evidence
        env:
          RELEASE_PUBLIC_IDENTITY: ${{ steps.authorize.outputs.public_identity }}
        run: |
          set -euo pipefail
          evidence_path=.artifacts/release-authorization/release-crypto-evidence.json
          node scripts/ci/release-set.mjs evidence --evidence "$evidence_path" \
            .artifacts/release-authorization/crypto-evidence
          node scripts/ci/release-set.mjs inspect --evidence "$evidence_path"
      - name: Smoke test ARM64 image digests
        run: |
          set -euo pipefail
          api_digest="$(tr -d '[:space:]' < artifacts/digest-api/digest-api.txt)"
          frontend_digest="$(tr -d '[:space:]' < artifacts/digest-frontend/digest-frontend.txt)"
          discovery_digest="$(tr -d '[:space:]' < artifacts/digest-printer-discovery/digest-printer-discovery.txt)"
          monolith_digest="$(tr -d '[:space:]' < artifacts/digest-monolith/digest-monolith.txt)"
          slicer_digest="$(tr -d '[:space:]' < artifacts/digest-slicer-host/digest-slicer-host.txt)"

          docker run --rm --platform linux/arm64 --entrypoint /bin/sh \
            "ghcr.io/olyforge3d/printfarmer-slicer-host@${slicer_digest}" \
            -c 'test -f /app/Farm.Slicer.Host.dll && test -d /app/plugins/slicer && dotnet --info >/dev/null'
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh \
            "ghcr.io/olyforge3d/printfarmer-api@${api_digest}" \
            -c 'test -f /app/Farm.Web.Api.dll && dotnet --info >/dev/null'
          docker run --rm --platform linux/arm64 -d \
            --name printfarmer-frontend-smoke \
            "ghcr.io/olyforge3d/printfarmer-frontend@${frontend_digest}"
          trap 'docker rm -f printfarmer-frontend-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          docker exec printfarmer-frontend-smoke nginx -t
          docker rm -f printfarmer-frontend-smoke
          trap - EXIT
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh \
            "ghcr.io/olyforge3d/printfarmer-printer-discovery@${discovery_digest}" \
            -c 'test -f /app/PrinterDiscoveryService.dll && dotnet --info >/dev/null'
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh \
            "ghcr.io/olyforge3d/printfarmer-monolith@${monolith_digest}" \
            -c 'test -f /app/Farm.Web.Api.dll && test -f /app/wwwroot/index.html && dotnet --info >/dev/null'
      - name: Sign externally-digested complete release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.consume.outputs.version }}
          RELEASE_PUBLIC_IDENTITY: ${{ steps.authorize.outputs.public_identity }}
        run: |
          set -euo pipefail
          manifest_dir=.artifacts/release-authorization
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import {
              validatePublicAuthorization, validateReleaseManifestBytes,
            } from "./scripts/ci/release-policy.mjs";
            const expected = JSON.parse(process.env.RELEASE_PUBLIC_IDENTITY);
            validatePublicAuthorization(expected);
            const envelope = JSON.parse(readFileSync(".artifacts/release-authorization/release-manifest.envelope.json", "utf8"));
            const manifest = validateReleaseManifestBytes(
              readFileSync(".artifacts/release-authorization/release-manifest.json", "utf8"), envelope);
            if (manifest.identity.releaseId !== expected.releaseId ||
                manifest.identity.canonicalVersion !== expected.canonicalVersion ||
                manifest.identity.identitySha256 !== expected.identitySha256) {
              throw new Error("Manifest identity differs from authorized output");
            }
          '
          if [[ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]]; then
            mapfile -t recovery_artifacts < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq "
                [.artifacts[] | select(.expired == false and
                  (.name == \"release-manifest-${GITHUB_RUN_ID}-1\"))] | .[].name"
            ) || { echo "Signed manifest recovery artifact lookup failed"; exit 1; }
            [[ "${#recovery_artifacts[@]}" -eq 1 ]] ||
              { echo "Signed manifest recovery evidence is absent, ambiguous, or expired"; exit 1; }
            recovery_dir="$RUNNER_TEMP/recovered-release-manifest"
            mkdir -p "$recovery_dir"
            gh run download "$GITHUB_RUN_ID" --name "${recovery_artifacts[0]}" --dir "$recovery_dir" ||
              { echo "Signed manifest recovery artifact download failed"; exit 1; }
            expected_manifest_assets="$(printf '%s\n' release-crypto-evidence.json release-manifest.envelope.bundle.json release-manifest.envelope.json release-manifest.json release-notes.md | sort)"
            recovered_manifest_assets="$(find "$recovery_dir" -maxdepth 1 -type f -printf '%f\n' | sort)"
            [[ "$recovered_manifest_assets" == "$expected_manifest_assets" ]] ||
              { echo "Signed manifest recovery artifact is incomplete or contains unexpected files"; exit 1; }
            for asset in release-crypto-evidence.json release-manifest.json release-manifest.envelope.json release-notes.md; do
              cmp -s "$manifest_dir/$asset" "$recovery_dir/$asset" ||
                { echo "Recovered signed release bytes differ from this authorized transaction: $asset"; exit 1; }
            done
            cp "$recovery_dir/release-manifest.envelope.bundle.json" "$manifest_dir/release-manifest.envelope.bundle.json"
          else
            cosign sign-blob --yes \
              --bundle "$manifest_dir/release-manifest.envelope.bundle.json" \
              "$manifest_dir/release-manifest.envelope.json"
          fi
          cosign verify-blob \
            --bundle "$manifest_dir/release-manifest.envelope.bundle.json" \
            --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$manifest_dir/release-manifest.envelope.json"
      - name: Persist signed manifest triplet before public upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/release-authorization/release-manifest.json
            .artifacts/release-authorization/release-manifest.envelope.json
            .artifacts/release-authorization/release-manifest.envelope.bundle.json
            .artifacts/release-authorization/release-crypto-evidence.json
            .artifacts/release-authorization/release-notes.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish and verify public corresponding-source assets
        working-directory: source
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          VERSION: ${{ steps.consume.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          expected_source_assets=(
            "PrintFarmer-${VERSION}-source.tar.gz"
            "PrintFarmer-${VERSION}-source.json"
            LICENSE
            THIRD-PARTY-NOTICES.md
            release-identity.json
            release-identity.bundle.json
            release-set.json
            release-notes.md
            "printfarmer-api-${VERSION}.spdx.json"
            "printfarmer-frontend-${VERSION}.spdx.json"
            "printfarmer-slicer-host-${VERSION}.spdx.json"
            "printfarmer-printer-discovery-${VERSION}.spdx.json"
            "printfarmer-orcaslicer-worker-${VERSION}.spdx.json"
            "printfarmer-monolith-${VERSION}.spdx.json"
            digest-api.txt
            digest-frontend.txt
            digest-slicer-host.txt
            digest-printer-discovery.txt
            digest-orcaslicer-worker.txt
            digest-monolith.txt
          )
          expected_manifest_assets=(
            release-manifest.json
            release-manifest.envelope.json
            release-manifest.envelope.bundle.json
          )
          expected_source_inventory="$(printf '%s\n' "${expected_source_assets[@]}" | sort)"
          expected_complete_inventory="$(
            printf '%s\n' "${expected_source_assets[@]}" "${expected_manifest_assets[@]}" | sort
          )"
          validate_local_source_inventory() {
            local_inventory="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
            [[ -z "$local_inventory" || "$local_inventory" == "$expected_source_inventory" ]] ||
              { echo "Local source asset inventory is incomplete or contains unexpected files"; exit 1; }
          }
          validate_preexisting_source_inventory() {
            remote_inventory="$(gh release view "$VERSION" --json assets --jq '.assets[].name' | sort)"
            [[ "$remote_inventory" == "$expected_source_inventory" ||
               "$remote_inventory" == "$expected_complete_inventory" ]] ||
              { echo "Draft release asset inventory is incomplete or contains unexpected files"; exit 1; }
          }
          verify_new_release_is_empty() {
            remote_inventory="$(gh release view "$VERSION" --json assets --jq '.assets[].name' | sort)"
            [[ -z "$remote_inventory" ]] ||
              { echo "New draft release must be empty before source asset upload"; exit 1; }
          }
          validate_local_source_inventory
          verify_complete_retry_assets() {
            recovery_dir="$RUNNER_TEMP/preexisting-complete-release"
            mkdir -p "$recovery_dir"
            for asset_name in release-notes.md "${expected_manifest_assets[@]}"; do
              gh release download "$VERSION" --pattern "$asset_name" --dir "$recovery_dir"
            done
            cmp -s release-assets/release-notes.md "$recovery_dir/release-notes.md" ||
              { echo "Published release notes differ from the validated build"; exit 1; }
            for asset_name in "${expected_manifest_assets[@]}"; do
              cmp -s "../.artifacts/release-authorization/$asset_name" "$recovery_dir/$asset_name" ||
                { echo "Published signed manifest asset differs: $asset_name"; exit 1; }
            done
            cosign verify-blob --bundle "$recovery_dir/release-manifest.envelope.bundle.json" \
              --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$recovery_dir/release-manifest.envelope.json"
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { validateReleaseManifestBytes } from "../scripts/ci/release-policy.mjs";
              const manifest = validateReleaseManifestBytes(readFileSync(process.argv[1], "utf8"),
                JSON.parse(readFileSync(process.argv[2], "utf8")));
              if (manifest.lifecycle.releaseNotes.sha256 !== process.env.RELEASE_NOTES_SHA256) {
                throw new Error("Release notes hash differs from signed manifest");
              }
            ' "$recovery_dir/release-manifest.json" "$recovery_dir/release-manifest.envelope.json"
          }
          node scripts/compliance/create-source-bundle.mjs \
            --revision '${{ fromJSON(inputs.transaction).sourceCommit }}' \
            --version "$VERSION" \
            --output release-assets
          cp LICENSE THIRD-PARTY-NOTICES.md release-assets/
          cp ../.artifacts/release-authorization/public-identity.json release-assets/release-identity.json
          cp ../.artifacts/release-authorization/public-identity.bundle.json release-assets/release-identity.bundle.json
          cp ../release-assets/release-set.json release-assets/release-set.json
          cp ../.artifacts/release-authorization/release-notes.md release-assets/release-notes.md
          cp release-artifacts/*.spdx.json release-artifacts/digest-*.txt release-assets/
          for asset_name in "${expected_source_assets[@]}"; do
            test -s "release-assets/$asset_name"
          done
          [[ "$(sha256sum release-assets/release-notes.md | cut -d ' ' -f1)" == "$RELEASE_NOTES_SHA256" ]]

          cosign verify-blob \
            --bundle release-assets/release-identity.bundle.json \
            --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-assets/release-identity.json

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; verifying immutable assets"
            validate_preexisting_source_inventory
            [[ "$remote_inventory" != "$expected_complete_inventory" ]] || verify_complete_retry_assets
          else
            create_args=(release create "$VERSION" --draft --verify-tag --title "$VERSION" --notes-file release-assets/release-notes.md)
            if [[ "$VERSION" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
            verify_new_release_is_empty
          fi

          existing_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          upload_files=()
          while IFS= read -r -d '' asset_file; do
            asset_name="$(basename "$asset_file")"
            if grep -Fxq "$asset_name" <<< "$existing_assets"; then
              existing_dir="$RUNNER_TEMP/existing-release-assets/$asset_name"
              mkdir -p "$existing_dir"
              gh release download "$VERSION" --pattern "$asset_name" --dir "$existing_dir"
              cmp -s "$asset_file" "$existing_dir/$asset_name" || {
                echo "Published release asset differs from the validated build: $asset_name"
                exit 1
              }
            else
              upload_files+=("$asset_file")
            fi
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${#upload_files[@]}" -gt 0 ]]; then
            gh release upload "$VERSION" "${upload_files[@]}"
          fi
          remote_assets="$RUNNER_TEMP/release-source-assets"
          mkdir -p "$remote_assets"
          [[ "$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)" == "$expected_source_inventory" ]] ||
            { echo "Validated source asset inventory is incomplete or contains unexpected files"; exit 1; }
          for asset_name in "${expected_source_assets[@]}"; do
            gh release download "$VERSION" --pattern "$asset_name" --dir "$remote_assets"
            cmp -s "release-assets/$asset_name" "$remote_assets/$asset_name" ||
              { echo "Published release asset differs from the validated build: $asset_name"; exit 1; }
          done
          remote_inventory="$(gh release view "$VERSION" --json assets --jq '.assets[].name' | sort)"
          [[ "$remote_inventory" == "$expected_source_inventory" ||
             "$remote_inventory" == "$expected_complete_inventory" ]] ||
            { echo "Draft release asset inventory is incomplete or contains unexpected files"; exit 1; }

      - name: Promote validated immutable image tags
        env:
          RELEASE_PUBLIC_IDENTITY: ${{ steps.authorize.outputs.public_identity }}
        run: node scripts/ci/release-set.mjs tag
      - name: Publish and verify signed manifest before mutable aliases
        working-directory: source
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          VERSION: ${{ steps.consume.outputs.version }}
        run: |
          set -euo pipefail
          manifest_dir=../.artifacts/release-authorization
          release_assets=release-assets
          recovered="$RUNNER_TEMP/published-signed-manifest"
          existing_recovered="$RUNNER_TEMP/existing-signed-manifest"
          mkdir -p "$release_assets"
          mkdir -p "$recovered"
          mkdir -p "$existing_recovered"
          existing_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          for asset in release-manifest.json release-manifest.envelope.json release-manifest.envelope.bundle.json; do
            cp "$manifest_dir/$asset" "$release_assets/$asset"
            if grep -Fxq "$asset" <<< "$existing_assets"; then
              gh release download "$VERSION" --pattern "$asset" --dir "$existing_recovered"
              cmp -s "$release_assets/$asset" "$existing_recovered/$asset" ||
                { echo "Published signed manifest asset differs: $asset"; exit 1; }
            else
              gh release upload "$VERSION" "$release_assets/$asset"
            fi
          done
          gh release download "$VERSION" --pattern release-manifest.json \
            --pattern release-manifest.envelope.json \
            --pattern release-manifest.envelope.bundle.json --dir "$recovered"
          for asset in release-manifest.json release-manifest.envelope.json release-manifest.envelope.bundle.json; do
            cmp -s "$release_assets/$asset" "$recovered/$asset" ||
              { echo "Published signed manifest asset differs: $asset"; exit 1; }
          done
          cosign verify-blob --bundle "$recovered/release-manifest.envelope.bundle.json" \
            --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$recovered/release-manifest.envelope.json"
          [[ "$(sha256sum release-assets/release-notes.md | cut -d ' ' -f1)" == "$RELEASE_NOTES_SHA256" ]]
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { validateReleaseManifestBytes } from "../scripts/ci/release-policy.mjs";
            const manifest = validateReleaseManifestBytes(readFileSync(process.argv[1], "utf8"),
              JSON.parse(readFileSync(process.argv[2], "utf8")));
            if (manifest.lifecycle.releaseNotes.sha256 !== process.env.RELEASE_NOTES_SHA256) throw new Error("Release notes hash differs from signed manifest");
          ' "$recovered/release-manifest.json" "$recovered/release-manifest.envelope.json"
          expected_prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            expected_prerelease=true
          fi
          expected_final_inventory="$(printf '%s\n' \
            release-notes.md release-manifest.json release-manifest.envelope.json release-manifest.envelope.bundle.json \
            PrintFarmer-"${VERSION}"-source.tar.gz PrintFarmer-"${VERSION}"-source.json LICENSE THIRD-PARTY-NOTICES.md \
            release-identity.json release-identity.bundle.json release-set.json \
            printfarmer-api-"${VERSION}".spdx.json printfarmer-frontend-"${VERSION}".spdx.json \
            printfarmer-slicer-host-"${VERSION}".spdx.json printfarmer-printer-discovery-"${VERSION}".spdx.json \
            printfarmer-orcaslicer-worker-"${VERSION}".spdx.json printfarmer-monolith-"${VERSION}".spdx.json \
            digest-api.txt digest-frontend.txt digest-slicer-host.txt digest-printer-discovery.txt \
            digest-orcaslicer-worker.txt digest-monolith.txt | sort)"
          [[ "$(gh release view "$VERSION" --json assets --jq '.assets[].name' | sort)" == "$expected_final_inventory" ]] ||
            { echo "Draft release asset inventory is incomplete or contains unexpected files"; exit 1; }
          gh release edit "$VERSION" --notes-file release-assets/release-notes.md \
            --draft=false --prerelease="$expected_prerelease"
          gh release view "$VERSION" --json body > "$recovered/release-body.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const canonicalNotes = readFileSync(process.argv[1], "utf8");
            const releasedBody = JSON.parse(readFileSync(process.argv[2], "utf8")).body;
            const apiTransportBody = releasedBody.replace(/\r\n/g, "\n");
            if (apiTransportBody !== canonicalNotes) {
              throw new Error("Published release body differs from canonical signed notes");
            }
          ' release-assets/release-notes.md "$recovered/release-body.json"
          release_state="$(
            gh release view "$VERSION" --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv'
          )"
          [[ "$release_state" == "$(printf 'false\t%s' "$expected_prerelease")" ]]
          [[ "$(gh release view "$VERSION" --json assets --jq '.assets[].name' | sort)" == "$expected_final_inventory" ]] ||
            { echo "Published release asset inventory is incomplete or contains unexpected files"; exit 1; }
          for asset in release-notes.md release-manifest.json release-manifest.envelope.json release-manifest.envelope.bundle.json; do
            asset_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${asset}"
            curl --fail --silent --show-error --location --head \
              --retry 6 --retry-delay 5 --retry-all-errors "$asset_url" >/dev/null
          done
      - name: Reverify the activated public release before aliases
        env:
          VERSION: ${{ steps.consume.outputs.version }}
          RELEASE_NOTES_SHA256: ${{ env.RELEASE_NOTES_SHA256 }}
        run: |
          set -euo pipefail
          public_root="$RUNNER_TEMP/activated-public-release"
          mkdir -p "$public_root"
          release_json="$public_root/release.json"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" > "$release_json"
          [[ "$(jq -r .draft "$release_json")" == false ]] ||
            { echo "Release remained draft after activation"; exit 1; }
          mapfile -t public_assets < <(jq -r '.assets[] | [.name, .browser_download_url] | @tsv' "$release_json")
          expected_inventory="$(find source/release-assets -maxdepth 1 -type f -printf '%f\n' | sort -u)"
          [[ "$(printf '%s\n' "${public_assets[@]}" | cut -f1 | sort)" == "$expected_inventory" ]] ||
            { echo "Activated release asset inventory is incomplete or unexpected"; exit 1; }
          for asset in "${public_assets[@]}"; do
            name="${asset%%$'\t'*}"
            url="${asset#*$'\t'}"
            env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 5 --retry-all-errors "$url" > "$public_root/$name"
            local="source/release-assets/$name"
            [[ -f "$local" ]] || local=".artifacts/release-authorization/$name"
            cmp -s "$local" "$public_root/$name" ||
              { echo "Activated release asset differs from signed local bytes: $name"; exit 1; }
          done
          cosign verify-blob --bundle "$public_root/release-manifest.envelope.bundle.json" \
            --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$public_root/release-manifest.envelope.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { validateReleaseManifestBytes } from "./scripts/ci/release-policy.mjs";
            const manifest = validateReleaseManifestBytes(readFileSync(process.argv[1], "utf8"),
              JSON.parse(readFileSync(process.argv[2], "utf8")));
            if (manifest.lifecycle.releaseNotes.sha256 !== process.env.RELEASE_NOTES_SHA256) {
              throw new Error("Activated release notes hash differs from manifest");
            }
          ' "$public_root/release-manifest.json" "$public_root/release-manifest.envelope.json"
          for image in api frontend slicer-host printer-discovery orcaslicer-worker monolith; do
            digest="$(tr -d '[:space:]' < "artifacts/digest-${image}/digest-${image}.txt")"
            references=( "index $digest" )
            while read -r platform platform_digest; do
              references+=( "${platform//\//-} $platform_digest" )
            done < <(docker buildx imagetools inspect "ghcr.io/olyforge3d/printfarmer-${image}@${digest}" --raw |
              jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") |
                select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture) \(.digest)"')
            for entry in "${references[@]}"; do
              scope="${entry%% *}"
              subject="${entry#* }"
              reference="ghcr.io/olyforge3d/printfarmer-${image}@${subject}"
              evidence=".artifacts/release-authorization/crypto-evidence/$image/$scope"
              cosign verify "$reference" --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
              cosign verify-attestation "$reference" --type spdxjson --certificate-identity "$RELEASE_SIGNER_IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
              cosign download signature "$reference" | jq -sc . | cmp -s "$evidence/signature.bundle.json" - ||
                { echo "Activated signature bundle differs: $image/$scope"; exit 1; }
              cosign download attestation "$reference" | jq -sc . | cmp -s "$evidence/attestation.bundle.json" - ||
                { echo "Activated attestation bundle differs: $image/$scope"; exit 1; }
            done
          done
      - name: Publish channel-isolated verified image aliases
        env:
          RELEASE_PUBLIC_IDENTITY: ${{ steps.authorize.outputs.public_identity }}
        run: node scripts/ci/release-set.mjs alias
      - name: Advance the complete channel pointer last
        id: advance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          RELEASE_PUBLISHER_APP_ID: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}
          RELEASE_OWNER_APPROVED_REVIEWERS: ${{ secrets.RELEASE_OWNER_APPROVED_REVIEWERS }}
          RELEASE_PUBLIC_IDENTITY: ${{ steps.authorize.outputs.public_identity }}
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
          RELEASE_SOURCE_COMMIT: ${{ fromJSON(inputs.transaction).sourceCommit }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
          RELEASE_VERIFIED_BRANCH_HEAD: ${{ steps.preflight.outputs.verified_branch_head }}
          RELEASE_EXPECTED_POINTER: ${{ steps.preflight.outputs.expected_pointer }}
        run: node scripts/ci/release-control.mjs advance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-identity-and-complete-set-${{ github.run_id }}
          path: |
            .artifacts/release-authorization/release-identity.json
            .artifacts/release-authorization/release-identity.bundle.json
            .artifacts/release-authorization/release-set.json
            .artifacts/release-authorization/release-manifest.json
            .artifacts/release-authorization/release-manifest.envelope.json
            .artifacts/release-authorization/release-manifest.envelope.bundle.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
