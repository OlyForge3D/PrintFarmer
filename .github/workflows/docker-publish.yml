name: Build and Publish Docker Images

# Build multi-arch Docker images and push to GitHub Container Registry (GHCR)
# Images: printfarmer-api (amd64+arm64), printfarmer-frontend (amd64+arm64), printfarmer-monolith (amd64+arm64)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g., "-beta")'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: printfarmer-api
            target: api-runtime
            platforms: linux/amd64,linux/arm64
            context: .
            dockerfile: scripts/docker/dockerfiles/Dockerfile.multistage
          - image: printfarmer-frontend
            target: frontend-runtime
            platforms: linux/amd64,linux/arm64
            context: .
            dockerfile: scripts/docker/dockerfiles/Dockerfile.multistage
          - image: printfarmer-monolith
            target: monolith-runtime
            platforms: linux/amd64,linux/arm64
            context: .
            dockerfile: scripts/docker/dockerfiles/Dockerfile.multistage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            # Tag with version on version tags (v1.2.3 -> v1.2.3, v1.2, v1, latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag with 'latest' on version tags
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with 'main' on main branch pushes
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with short SHA on main branch
            type=sha,format=short,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with 'manual' prefix on workflow_dispatch
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=PrintFarmer - Multi-printer 3D print farm management
            org.opencontainers.image.vendor=PrintFarmer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERBOSITY=quiet
            ASPNET_TAG=10.0-noble
            NODE_TAG=24-alpine
            NGINX_TAG=alpine
            UBUNTU_TAG=24.04

      - name: Generate build summary
        run: |
          echo "## 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`${{ matrix.platforms }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Stage:** \`${{ matrix.target }}\`" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "## ✅ All Images Built Successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All PrintFarmer container images have been built and pushed to GHCR." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Images:**" >> $GITHUB_STEP_SUMMARY
            echo "- \`printfarmer-api\` (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY
            echo "- \`printfarmer-frontend\` (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pull Commands:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-api:main" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-frontend:main" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some container images failed to build. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
