name: Build and Publish Docker Images

# Unified Docker build pipeline — native build on runner + COPY into minimal containers.
# Monolith uses Dockerfile.multistage (combines API + frontend in one image).
#
# Images:
#   printfarmer-api              (amd64 + arm64) — native build
#   printfarmer-frontend         (amd64 + arm64) — native build
#   printfarmer-printer-discovery (amd64 + arm64) — native build
#   printfarmer-orcaslicer-worker (amd64 only)   — native build
#   printfarmer-monolith         (amd64 + arm64) — multistage Dockerfile

on:
  push:
    branches:
      - release
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g., "-beta")'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: olyforge3d
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  ORCA_VERSION: '2.4.0'

permissions:
  contents: read
  packages: write

jobs:
  # ====================
  # JOB 1: Build .NET projects natively
  # ====================
  build-dotnet:
    name: Build .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/farm-web.sln

      - name: Build all projects
        run: dotnet build src/farm-web.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish src/api/Farm.Web.Api.csproj -c Release -o ./publish/api --no-build

      - name: Publish OrcaSlicer Worker
        run: dotnet publish src/orcaslicer-worker/Farm.OrcaSlicer.Worker.csproj -c Release -o ./publish/orcaslicer-worker --no-build

      - name: Publish Printer Discovery
        run: dotnet publish src/printer-discovery/PrinterDiscoveryService.csproj -c Release -o ./publish/printer-discovery --no-build

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-publish
          path: ./publish/api
          retention-days: 1

      - name: Upload OrcaSlicer Worker artifact
        uses: actions/upload-artifact@v7
        with:
          name: orcaslicer-worker-publish
          path: ./publish/orcaslicer-worker
          retention-days: 1

      - name: Upload Printer Discovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: printer-discovery-publish
          path: ./publish/printer-discovery
          retention-days: 1

  # ====================
  # JOB 2: Build React frontend natively
  # ====================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Web/ReactApp/package-lock.json

      - name: Install dependencies
        working-directory: src/Web/ReactApp
        run: npm ci

      - name: Build React app
        working-directory: src/Web/ReactApp
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: src/Web/ReactApp/dist
          retention-days: 1

  # ====================
  # JOB 3: Ensure OrcaSlicer base image exists
  # ====================
  ensure-orca-base:
    name: Ensure OrcaSlicer Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base_image: ${{ steps.output.outputs.base_image }}
    steps:
      - name: Log in to GHCR (for manifest check)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if OrcaSlicer base image exists
        id: check
        run: |
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orcaslicer-base:${{ env.ORCA_VERSION }}"
          echo "Checking for base image: $BASE_IMAGE"
          
          if docker manifest inspect "$BASE_IMAGE" > /dev/null 2>&1; then
            echo "✓ Base image exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Base image not found - will trigger build"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger base image build if needed
        if: steps.check.outputs.exists != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            console.log('Triggering OrcaSlicer base image workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'orcaslicer-base-image.yml',
              ref: context.ref,
              inputs: {
                orca_version: '${{ env.ORCA_VERSION }}',
                force_rebuild: 'false'
              }
            });
            console.log('Workflow dispatched - waiting for it to complete...');
            
            // Wait and poll for completion (max 10 minutes)
            const maxWait = 10 * 60 * 1000;
            const startTime = Date.now();
            
            while (Date.now() - startTime < maxWait) {
              await new Promise(r => setTimeout(r, 30000)); // Wait 30s
              
              // Check if manifest exists now
              const { execSync } = require('child_process');
              try {
                execSync(`docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orcaslicer-base:${{ env.ORCA_VERSION }}`, { stdio: 'pipe' });
                console.log('Base image is now available!');
                return;
              } catch {
                console.log('Still waiting for base image...');
              }
            }
            
            core.setFailed('Timed out waiting for base image');

      - name: Output base image reference
        id: output
        run: |
          echo "base_image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orcaslicer-base:${{ env.ORCA_VERSION }}" >> $GITHUB_OUTPUT

  # ====================
  # JOB 4: Build native container images (api, frontend, discovery, orcaslicer-worker)
  # ====================
  build-containers:
    name: Build ${{ matrix.image }} container
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-frontend, ensure-orca-base]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            artifact: api-publish
            dockerfile: Dockerfile.api-optimized
            platforms: linux/amd64,linux/arm64
          - image: frontend
            artifact: frontend-build
            dockerfile: Dockerfile.frontend-optimized
            platforms: linux/amd64,linux/arm64
          - image: printer-discovery
            artifact: printer-discovery-publish
            dockerfile: Dockerfile.discovery-optimized
            platforms: linux/amd64,linux/arm64
          - image: orcaslicer-worker
            artifact: orcaslicer-worker-publish
            dockerfile: Dockerfile.orcaslicer-worker-optimized
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ./artifact

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create optimized Dockerfile
        run: |
          mkdir -p .github/dockerfiles
          
          case "${{ matrix.image }}" in
            api)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0-noble
          WORKDIR /app
          COPY artifact/ ./
          ENV ASPNETCORE_URLS=http://+:5245
          EXPOSE 5245
          ENTRYPOINT ["dotnet", "Farm.Web.Api.dll"]
          EOF
              ;;
            
            frontend)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'EOF'
          FROM nginx:alpine
          COPY artifact/ /usr/share/nginx/html
          COPY deploy/nginx/nginx.conf /etc/nginx/nginx.conf
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF
              ;;
            
            printer-discovery)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0-noble
          WORKDIR /app
          COPY artifact/ ./
          EXPOSE 8080
          ENTRYPOINT ["dotnet", "PrinterDiscoveryService.dll"]
          EOF
              ;;
            
            orcaslicer-worker)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'DOCKERFILE'
          # Use OrcaSlicer base image with pre-extracted binaries
          FROM ${{ needs.ensure-orca-base.outputs.base_image }}
          
          # Install .NET runtime
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  wget ca-certificates \
              && wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh \
              && chmod +x dotnet-install.sh \
              && ./dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir /usr/share/dotnet \
              && ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet \
              && rm dotnet-install.sh \
              && apt-get remove -y wget \
              && apt-get autoremove -y \
              && rm -rf /var/lib/apt/lists/*
          
          WORKDIR /app
          COPY artifact/ ./
          
          ENV ASPNETCORE_URLS=http://+:8080
          ENV ORCASLICER_PATH=/opt/orcaslicer
          EXPOSE 8080
          
          ENTRYPOINT ["dotnet", "Farm.OrcaSlicer.Worker.dll"]
          DOCKERFILE
              ;;
          esac

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' }}
            type=sha,format=short,prefix=release-sha-,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=printfarmer-${{ matrix.image }}
            org.opencontainers.image.description=PrintFarmer - Multi-printer 3D print farm management
            org.opencontainers.image.vendor=PrintFarmer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/dockerfiles/${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================
  # JOB 5: Build monolith via Dockerfile.multistage (runs in parallel with native builds)
  # ====================
  build-monolith:
    name: Build monolith container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute short SHA
        id: gitsha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-monolith
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' }}
            type=sha,format=short,prefix=release-sha-,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=printfarmer-monolith
            org.opencontainers.image.description=PrintFarmer - Multi-printer 3D print farm management (monolith)
            org.opencontainers.image.vendor=PrintFarmer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT

      - name: Build and push monolith image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/docker/dockerfiles/Dockerfile.multistage
          target: monolith-runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERBOSITY=quiet
            ASPNET_TAG=10.0-noble
            NODE_TAG=24-alpine
            NGINX_TAG=alpine
            UBUNTU_TAG=24.04
            GIT_SHA=${{ steps.gitsha.outputs.short }}
            VITE_GIT_SHA=${{ steps.gitsha.outputs.short }}

  # ====================
  # JOB 6: ARM64 Smoke Test
  # ====================
  arm64-smoke-test:
    name: ARM64 Smoke Test
    runs-on: ubuntu-latest
    needs: [build-containers]
    if: needs.build-containers.result == 'success'
    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            TAG="release-sha-${GITHUB_SHA::7}"
          else
            TAG="manual-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify API image starts on ARM64
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-api:${{ steps.tag.outputs.tag }}"
          echo "Testing ARM64 startup: $IMAGE"
          docker run --rm --platform linux/arm64 \
            -e ASPNETCORE_URLS=http://+:5000 \
            -e DB_PROVIDER=sqlite \
            "$IMAGE" dotnet Farm.Web.Api.dll --help 2>&1 | head -20
          echo "✅ API image runs on ARM64"

      - name: Verify frontend image starts on ARM64
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-frontend:${{ steps.tag.outputs.tag }}"
          echo "Testing ARM64 startup: $IMAGE"
          docker run --rm --platform linux/arm64 -d --name frontend-test "$IMAGE"
          sleep 3
          docker logs frontend-test 2>&1 | head -10
          docker stop frontend-test || true
          echo "✅ Frontend image runs on ARM64"

      - name: Verify printer-discovery image starts on ARM64
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-printer-discovery:${{ steps.tag.outputs.tag }}"
          echo "Testing ARM64 startup: $IMAGE"
          docker run --rm --platform linux/arm64 \
            "$IMAGE" dotnet PrinterDiscoveryService.dll --help 2>&1 | head -20
          echo "✅ Printer Discovery image runs on ARM64"

  # ====================
  # JOB 7: Summary
  # ====================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-containers, build-monolith, arm64-smoke-test]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🐳 Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          CONTAINERS="${{ needs.build-containers.result }}"
          MONOLITH="${{ needs.build-monolith.result }}"
          SMOKE="${{ needs.arm64-smoke-test.result }}"

          if [ "$CONTAINERS" == "success" ] && [ "$MONOLITH" == "success" ]; then
            echo "### ✅ All Images Built Successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Some Builds Had Issues" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Build | Platforms |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | $( [ '$CONTAINERS' == 'success' ] && echo '✅' || echo '❌' ) | amd64, arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $( [ '$CONTAINERS' == 'success' ] && echo '✅' || echo '❌' ) | amd64, arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Printer Discovery | $( [ '$CONTAINERS' == 'success' ] && echo '✅' || echo '❌' ) | amd64, arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| OrcaSlicer Worker | $( [ '$CONTAINERS' == 'success' ] && echo '✅' || echo '❌' ) | amd64 only |" >> $GITHUB_STEP_SUMMARY
          echo "| Monolith | $( [ '$MONOLITH' == 'success' ] && echo '✅' || echo '❌' ) | amd64, arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ARM64 Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "Status: $( [ '$SMOKE' == 'success' ] && echo '✅ Passed' || ( [ '$SMOKE' == 'skipped' ] && echo '⏭️ Skipped' || echo '❌ Failed' ) )" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Registry" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-api:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-printer-discovery:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-orcaslicer-worker:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-monolith:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
