name: Bounded release protection rehearsal

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canonical channel to inspect; never publishes
        type: choice
        options: [insider, stable]
        default: insider
        required: true
      denial_probes:
        description: Owner-approved inert fixture and empty upload denial probes
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  # All admission bodies match scripts/ci/release-rehearsal-admission.mjs;
  # tests enforce byte identity without checking out code before admission.
  admission:
    name: Credential-free rehearsal admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject untrusted dispatches and reruns
        id: admission
        shell: bash
        env:
          REHEARSAL_CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const repository = 'OlyForge3D/PrintFarmer';
          const workflow = '.github/workflows/release-protection-rehearsal.yml';
          const branch = { insider: 'development', stable: 'main' }[env.REHEARSAL_CHANNEL];
          const trusted = ['insider', 'stable'].includes(env.REHEARSAL_CHANNEL) &&
            env.GITHUB_REPOSITORY === repository &&
            env.GITHUB_EVENT_NAME === 'workflow_dispatch' &&
            env.GITHUB_REF === `refs/heads/${branch}` &&
            env.GITHUB_WORKFLOW_REF === `${repository}/${workflow}@refs/heads/${branch}` &&
            /^[a-f0-9]{40}$/.test(env.GITHUB_SHA ?? '') &&
            env.GITHUB_WORKFLOW_SHA === env.GITHUB_SHA &&
            env.GITHUB_RUN_ATTEMPT === '1' &&
            /^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID ?? '');
          if (!trusted) {
            console.error('Untrusted rehearsal dispatch; protected jobs blocked');
            process.exitCode = 1;
          }
          NODE

  positive:
    name: Protected GET-only App rehearsal
    needs: admission
    environment: release-${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      inventory_digest: ${{ steps.verify.outputs.inventory_digest }}
    steps:
      - name: Reject untrusted dispatches and reruns
        id: admission
        shell: bash
        env:
          REHEARSAL_CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const repository = 'OlyForge3D/PrintFarmer';
          const workflow = '.github/workflows/release-protection-rehearsal.yml';
          const branch = { insider: 'development', stable: 'main' }[env.REHEARSAL_CHANNEL];
          const trusted = ['insider', 'stable'].includes(env.REHEARSAL_CHANNEL) &&
            env.GITHUB_REPOSITORY === repository &&
            env.GITHUB_EVENT_NAME === 'workflow_dispatch' &&
            env.GITHUB_REF === `refs/heads/${branch}` &&
            env.GITHUB_WORKFLOW_REF === `${repository}/${workflow}@refs/heads/${branch}` &&
            /^[a-f0-9]{40}$/.test(env.GITHUB_SHA ?? '') &&
            env.GITHUB_WORKFLOW_SHA === env.GITHUB_SHA &&
            env.GITHUB_RUN_ATTEMPT === '1' &&
            /^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID ?? '');
          if (!trusted) {
            console.error('Untrusted rehearsal dispatch; protected jobs blocked');
            process.exitCode = 1;
          }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - name: Obtain repository-only read-downscoped App token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
          owner: OlyForge3D
          repositories: PrintFarmer
          permission-contents: read
          permission-checks: read
          permission-statuses: read
          permission-administration: read
          permission-actions: read
      - name: Verify App reads, qualification and unchanged inventories
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_APP_TOKEN: ${{ steps.publisher.outputs.token }}
          REHEARSAL_CHANNEL: ${{ inputs.channel }}
          RELEASE_PUBLISHER_APP_ID: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
          RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}
          RELEASE_OWNER_APPROVED_REVIEWERS: ${{ secrets.RELEASE_OWNER_APPROVED_REVIEWERS }}
        run: node scripts/ci/release-rehearsal-control.mjs positive
      - name: Preserve secret-free positive evidence
        if: always() && steps.admission.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-rehearsal-positive-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-rehearsal/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  probes:
    name: Owner-approved generic-token denial probes
    needs: [admission, positive]
    if: inputs.denial_probes
    environment: release-${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    steps:
      - name: Reject untrusted dispatches and reruns
        id: admission
        shell: bash
        env:
          REHEARSAL_CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const repository = 'OlyForge3D/PrintFarmer';
          const workflow = '.github/workflows/release-protection-rehearsal.yml';
          const branch = { insider: 'development', stable: 'main' }[env.REHEARSAL_CHANNEL];
          const trusted = ['insider', 'stable'].includes(env.REHEARSAL_CHANNEL) &&
            env.GITHUB_REPOSITORY === repository &&
            env.GITHUB_EVENT_NAME === 'workflow_dispatch' &&
            env.GITHUB_REF === `refs/heads/${branch}` &&
            env.GITHUB_WORKFLOW_REF === `${repository}/${workflow}@refs/heads/${branch}` &&
            /^[a-f0-9]{40}$/.test(env.GITHUB_SHA ?? '') &&
            env.GITHUB_WORKFLOW_SHA === env.GITHUB_SHA &&
            env.GITHUB_RUN_ATTEMPT === '1' &&
            /^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID ?? '');
          if (!trusted) {
            console.error('Untrusted rehearsal dispatch; protected jobs blocked');
            process.exitCode = 1;
          }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - name: Run strictly bounded generic-token probes
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_CHANNEL: ${{ inputs.channel }}
          REHEARSAL_DENIAL_PROBES: ${{ inputs.denial_probes }}
          REHEARSAL_POSITIVE_DIGEST: ${{ needs.positive.outputs.inventory_digest }}
          RELEASE_REHEARSAL_APPROVED_SHA: ${{ vars.RELEASE_REHEARSAL_APPROVED_SHA }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
          RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}
        run: node scripts/ci/release-rehearsal-control.mjs probes
      - name: Preserve secret-free denial and zero-write evidence
        if: always() && steps.admission.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-rehearsal-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-rehearsal/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
