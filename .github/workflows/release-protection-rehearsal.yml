name: Internal release diagnostics

on:
  workflow_call:
    inputs:
      transaction:
        description: Immutable non-authorizing diagnostic transaction
        type: string
        required: true
      qualification_artifact:
        description: Same-run qualification evidence artifact
        type: string
        required: true

permissions:
  contents: read

jobs:
  diagnostics:
    name: Read-only release control diagnostics
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ fromJSON(inputs.transaction).workflowCommit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ inputs.qualification_artifact }}
          path: .artifacts/release-transaction
      - name: Validate the immutable diagnostic transaction
        env:
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
        run: node scripts/ci/release-transaction.mjs validate
      - name: Exercise bounded read-only release controls
        run: >-
          node --test
          scripts/ci/tests/test-release-transaction.mjs
          scripts/ci/tests/test-release-rehearsal.mjs
      - name: Emit a typed non-authorizing diagnostic receipt
        env:
          RELEASE_TRANSACTION: ${{ inputs.transaction }}
        run: node scripts/ci/release-transaction.mjs diagnose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: internal-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-transaction/rehearsal-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
