name: yamllint (enforce)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: python -m pip install --upgrade pip && python -m pip install yamllint

      - name: Run yamllint
        id: lint
        run: |
          python -m yamllint .github/workflows/*.yml > yamllint.out 2>&1 || true
          rc=$?
          cat yamllint.out || true
          echo "lint_exit=${rc}" >> $GITHUB_OUTPUT

      - name: Upload yamllint output
        uses: actions/upload-artifact@v7
        with:
          name: yamllint-report
          path: yamllint.out

      - name: Fail on yamllint issues
        if: steps.lint.outputs.lint_exit != '0'
        run: |
          echo 'yamllint detected problems. See artifact "yamllint-report" for details.'
          exit 1
