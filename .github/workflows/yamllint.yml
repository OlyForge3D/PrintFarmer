name: yamllint (enforce)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: python -m pip install --upgrade pip && python -m pip install yamllint

      - name: Run yamllint
        id: lint
        run: |
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          rc=0
          if ((${#workflow_files[@]} == 0)); then
            echo "No workflow YAML files found." > yamllint.out
            rc=1
          else
            python -m yamllint "${workflow_files[@]}" > yamllint.out 2>&1 || rc=$?
          fi
          cat yamllint.out
          printf 'lint_exit=%s\n' "$rc" >> "$GITHUB_OUTPUT"

      - name: Upload yamllint output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yamllint-report
          path: yamllint.out

      - name: Fail on yamllint issues
        if: steps.lint.outputs.lint_exit != '0'
        run: |
          echo 'yamllint detected problems. See artifact "yamllint-report" for details.'
          exit 1
