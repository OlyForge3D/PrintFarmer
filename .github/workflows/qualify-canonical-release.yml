name: Qualify canonical release
run-name: >-
  Canonical qualification ${{ inputs.channel }} CI ${{ inputs.validation_run }}
  review ${{ inputs.review_comment }} PR ${{ inputs.native_pr }} mode ${{ vars.RELEASE_APPROVAL_MODE }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canonical channel to qualify; never publishes
        type: choice
        options: [stable, insider]
        required: true
      validation_run:
        description: Fresh successful manual CI run on live canonical HEAD (attempt 1)
        type: string
        required: true
      review_comment:
        description: Fresh canonical commit confirmation comment ID
        type: string
        required: true
      native_pr:
        description: Exact-head native approval PR in separation-of-duties; otherwise 0
        type: string
        default: '0'
        required: true

permissions:
  contents: read

concurrency:
  group: canonical-qualification-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify canonical qualification
    if: >-
      github.repository == 'OlyForge3D/PrintFarmer' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - name: Verify fresh CI and exact canonical review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}
        run: node scripts/ci/canonical-qualification-control.mjs verify
