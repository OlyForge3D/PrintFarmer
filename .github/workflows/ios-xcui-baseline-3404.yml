name: iOS XCUI baseline (PR 3404 investigation)

# Temporary, investigation-only harness authorised for PR #3404. It reruns the
# original iPhone XCUI shards 1-3 from ios-pr-ci.yml against a PINNED
# `development` checkout (not the PR head) to establish whether the failures
# from run 38988179568 reproduce without #3404's changes.
#
# Evidence rules:
# - App, test and CI-script source come from BASELINE_SHA, never the PR head.
# - No retries or repetition: scripts/run-tests.py rejects those flags.
# - The final job step always exits non-zero, so this workflow can never post
#   a passing check on the PR head. Read the outcome from the job summary and
#   artifacts, not from the check colour.
# - Remove this file before #3404 merges.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ios-xcui-baseline-3404.yml'

concurrency:
  group: ios-xcui-baseline-3404
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASELINE_SHA: c3dea4c7c3282eeaee43b006409c4b8e9323d033
  # Same workflow-level values as ios-pr-ci.yml.
  IOS_SIMULATOR_DEVICE_PREFERENCE: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
  IOS_SIMULATOR_RUNTIME_PREFERENCE: iOS 26.5

jobs:
  baseline:
    name: BASELINE development@c3dea4c7 iPhone shard ${{ matrix.shard }} (not PR-head evidence)
    if: ${{ github.event.pull_request.number == 3404 }}
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Copied verbatim from the ios-pr-ci.yml xcui-shards iPhone entries.
          - key: iphone-1
            family: iPhone
            shard: 1
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
            target_test: PrintFarmerUITests/LoginFlowUITests/testLoginTransitionsToOperatorShell
            selectors: >-
              -only-testing:PrintFarmerUITests/LoginFlowUITests
              -only-testing:PrintFarmerUITests/OperatorShellUITests
          - key: iphone-2
            family: iPhone
            shard: 2
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
            target_test: PrintFarmerUITests/HarvestUITests/testQueueAccessibilityReorderControlsRespectEligibility
            selectors: >-
              -only-testing:PrintFarmerUITests/ScanStationUITests
              -only-testing:PrintFarmerUITests/HarvestUITests
          - key: iphone-3
            family: iPhone
            shard: 3
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
            target_test: PrintFarmerUITests/FilamentCoverageUITests/testDetailShowsDistinctToolheadRowsEvenWhenDisplayNamesDuplicate
            selectors: >-
              -only-testing:PrintFarmerUITests/PartsInventoryUITests
              -only-testing:PrintFarmerUITests/PrinterListUITests
              -only-testing:PrintFarmerUITests/FilamentCoverageUITests
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout pinned development baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          persist-credentials: false

      - name: Verify baseline checkout
        id: verify-sha
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "Baseline SHA: $ACTUAL"
          echo "Harness SHA (PR head): ${{ github.event.pull_request.head.sha }}"
          if [ "$ACTUAL" != "$BASELINE_SHA" ]; then
            echo "::error::Checked out $ACTUAL, expected $BASELINE_SHA"
            exit 1
          fi

      - name: Select Xcode 26.6
        id: xcode
        run: |
          XCODE_PATH="/Applications/Xcode_26.6.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode 26.6 is missing from the macos-26 runner at $XCODE_PATH."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version)"
          if [ "$(printf '%s\n' "$XCODE_VERSION" | head -n 1)" != "Xcode 26.6" ]; then
            echo "::error::Expected Xcode 26.6 at $XCODE_PATH, found: $XCODE_VERSION"
            exit 1
          fi
          if [ "$(printf '%s\n' "$XCODE_VERSION" | sed -n '2s/^Build version //p')" != "17F113" ]; then
            echo "::error::Expected Xcode build 17F113 at $XCODE_PATH, found: $XCODE_VERSION"
            exit 1
          fi
          printf '%s\n' "$XCODE_VERSION"

      - name: Test simulator resolver
        id: resolver-selftest
        if: matrix.key == 'iphone-1'
        run: ../scripts/ci/test-resolve-ios-simulator.sh

      - name: Resolve package dependencies
        id: packages
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages"

      - name: Install approved iOS 26.5 simulator runtime
        id: runtime
        timeout-minutes: 30
        env:
          IOS_SIMULATOR_DEVICE_FAMILY: ${{ matrix.family }}
          IOS_SIMULATOR_DEVICE_PREFIX: ${{ matrix.prefix }}
          IOS_SIMULATOR_DEVICE_PREFERENCE: ${{ matrix.device_preference }}
        run: |
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          DEVICE_PREFIX="${IOS_SIMULATOR_DEVICE_PREFIX:-${IOS_SIMULATOR_DEVICE_FAMILY} }"
          has_approved_runtime() {
            xcrun simctl list runtimes -j | jq -e \
              --arg runtime "$RUNTIME_ID" \
              '.runtimes[] | select(.identifier == $runtime and .buildversion == "23F77" and .isAvailable)' \
              >/dev/null
          }
          if ! has_approved_runtime; then
            sudo xcodebuild -downloadPlatform iOS \
              -buildVersion 23F77 \
              -architectureVariant arm64
            if ! has_approved_runtime; then
              echo "::error::iOS 26.5 runtime build 23F77 remained unavailable after download."
              exit 1
            fi
          fi
          if ! xcrun simctl list devices available -j | jq -e \
            --arg runtime "$RUNTIME_ID" --arg prefix "$DEVICE_PREFIX" \
            '.devices[$runtime][]? | select(.isAvailable == true and (.name | startswith($prefix)))' >/dev/null; then
            if ! DEVICE_TYPE="$(xcrun simctl list devicetypes -j | jq -e \
              --arg family "$IOS_SIMULATOR_DEVICE_FAMILY" \
              --arg preferences "$IOS_SIMULATOR_DEVICE_PREFERENCE" \
              '[($preferences | split(","))[] as $name
                | .devicetypes[]
                | select(.name == $name and .productFamily == $family)] | first')"; then
              echo "::error::No installed $IOS_SIMULATOR_DEVICE_FAMILY simulator type matches its preference list."
              exit 1
            fi
            DEVICE_NAME="$(printf '%s\n' "$DEVICE_TYPE" | jq -r '.name')"
            DEVICE_TYPE_ID="$(printf '%s\n' "$DEVICE_TYPE" | jq -r '.identifier')"
            xcrun simctl create "$DEVICE_NAME" "$DEVICE_TYPE_ID" "$RUNTIME_ID"
          fi

      - name: Resolve ${{ matrix.family }} simulator destination
        id: resolve
        env:
          IOS_SIMULATOR_DEVICE_FAMILY: ${{ matrix.family }}
          IOS_SIMULATOR_DEVICE_PREFIX: ${{ matrix.prefix }}
          IOS_SIMULATOR_DEVICE_PREFERENCE: ${{ matrix.device_preference }}
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Boot ${{ matrix.family }} simulator
        id: boot
        run: ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Build XCUI shard for testing
        id: build
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build-for-testing

      - name: Run login XCUI
        id: login-xcui
        if: matrix.shard == 1
        timeout-minutes: 25
        run: |
          set -o pipefail
          python3 scripts/run-tests.py -- test-without-building \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:PrintFarmerUITests/LoginFlowUITests \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            -resultBundlePath "build-${{ matrix.key }}/Login.xcresult" \
            2>&1 | tee "build-${{ matrix.key }}/Login.log"

      - name: Run XCUI shard
        id: shard
        if: ${{ !cancelled() && (success() || steps.login-xcui.conclusion == 'failure') }}
        timeout-minutes: 25
        env:
          SELECTORS: ${{ matrix.selectors }}
        run: |
          set -o pipefail
          read -r -a selectors <<< "$SELECTORS"
          if [[ "${{ matrix.shard }}" == "1" ]]; then
            selectors=("${selectors[@]:1}")
          fi
          python3 scripts/run-tests.py -- test-without-building \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            "${selectors[@]}" \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            -resultBundlePath "build-${{ matrix.key }}/XCUIShard.xcresult" \
            2>&1 | tee "build-${{ matrix.key }}/XCUIShard.log"

      - name: Upload baseline results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-dev-c3dea4c7-ios-xcui-${{ matrix.key }}
          path: |
            mobile/build-${{ matrix.key }}/Login.xcresult
            mobile/build-${{ matrix.key }}/Login.log
            mobile/build-${{ matrix.key }}/Login.events.jsonl
            mobile/build-${{ matrix.key }}/Login.timing.json
            mobile/build-${{ matrix.key }}/XCUIShard.xcresult
            mobile/build-${{ matrix.key }}/XCUIShard.log
            mobile/build-${{ matrix.key }}/XCUIShard.events.jsonl
            mobile/build-${{ matrix.key }}/XCUIShard.timing.json
          retention-days: 14

      - name: Classify baseline outcome (never passes)
        if: always()
        env:
          SETUP_OUTCOMES: >-
            verify-sha=${{ steps.verify-sha.outcome }}
            xcode=${{ steps.xcode.outcome }}
            packages=${{ steps.packages.outcome }}
            runtime=${{ steps.runtime.outcome }}
            resolve=${{ steps.resolve.outcome }}
            boot=${{ steps.boot.outcome }}
            build=${{ steps.build.outcome }}
          RESOLVER_SELFTEST: ${{ steps.resolver-selftest.outcome }}
          LOGIN_OUTCOME: ${{ steps.login-xcui.outcome }}
          SHARD_OUTCOME: ${{ steps.shard.outcome }}
          TARGET_TEST: ${{ matrix.target_test }}
          KEY: ${{ matrix.key }}
        run: |
          setup_failed=no
          for entry in $SETUP_OUTCOMES; do
            [ "${entry#*=}" = "success" ] || setup_failed=yes
          done
          case "$RESOLVER_SELFTEST" in success|skipped) ;; *) setup_failed=yes ;; esac
          if [ "$setup_failed" = "yes" ]; then
            classification="HARNESS/SETUP FAILURE (tests did not run validly)"
          elif [ "$LOGIN_OUTCOME" = "failure" ] || [ "$SHARD_OUTCOME" = "failure" ]; then
            classification="TEST FAILURE on baseline (inspect xcresult for $TARGET_TEST)"
          elif [ "$SHARD_OUTCOME" = "success" ] && { [ "$KEY" != "iphone-1" ] || [ "$LOGIN_OUTCOME" = "success" ]; }; then
            classification="ALL SELECTED TESTS PASSED on baseline"
          else
            classification="INCONCLUSIVE (cancelled or skipped)"
          fi
          {
            echo "## Baseline $KEY — development@$BASELINE_SHA"
            echo ""
            echo "Harness SHA (PR head, workflow only): ${{ github.event.pull_request.head.sha }}"
            echo ""
            echo "Target test: \`$TARGET_TEST\`"
            echo ""
            echo "Setup: $SETUP_OUTCOMES"
            echo ""
            echo "Login step: ${LOGIN_OUTCOME:-n/a}; shard step: ${SHARD_OUTCOME:-n/a}"
            echo ""
            echo "**Classification: $classification**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Classification: $classification"
          echo "::error::Baseline evidence only; this job never reports success on the PR head. Classification: $classification"
          exit 1
