name: Recovery matrix

# Isolated, network-denied offline-update recovery matrix (#2982).
# Never per-PR: nightly plus manual dispatch only. Throwaway hosts only;
# signing uses a per-run ephemeral fixture root. See
# docs/OFFLINE_UPDATE_RECOVERY.md "Isolated recovery matrix scope (#3098)".
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      cell:
        description: Recovery matrix cell
        type: choice
        options: [c2]
        default: c2

permissions:
  contents: read

concurrency:
  group: recovery-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Recovery cell ${{ inputs.cell || 'c2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Run recovery cell
        env:
          CELL: ${{ inputs.cell || 'c2' }}
        run: >-
          bash scripts/ci/recovery-matrix/run-cell.sh
          --cell "$CELL"
          --cosign "$(command -v cosign)"
          --evidence "$GITHUB_WORKSPACE/.recovery-matrix-work/evidence-$CELL.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: recovery-matrix-evidence-${{ inputs.cell || 'c2' }}-${{ github.run_id }}
          path: .recovery-matrix-work/evidence-*.json
          if-no-files-found: error
          retention-days: 30
