name: Recovery matrix

# Isolated, network-denied offline-update recovery matrix (#2982).
# Never per-PR: nightly plus manual dispatch only. Throwaway hosts only;
# signing uses a per-run ephemeral fixture root. See
# docs/OFFLINE_UPDATE_RECOVERY.md "Isolated recovery matrix scope (#3098)".
# Nightly runs every topology cell and every import cell (#3102); fault cells run on dispatch.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      cell:
        description: Recovery matrix cell
        type: choice
        options: [c2, monolith-sqlserver, split-postgres, split-postgres-no-worker, split-sqlserver, external-database, external-storage, remote-worker, split-database, all, faults, fault-power-loss-backup, fault-power-loss-migration-before, fault-power-loss-migration-after, fault-power-loss-apply-before, fault-power-loss-apply-after, fault-partial-migration, fault-partial-apply, fault-api-down, fault-missing-backup, fault-corrupt-journal, fault-corrupt-replay, fault-fence-release, fault-emulated-printer-reconciliation, imports, import-identity, import-channel-round-trips, import-adversarial, import-replay-supersede, published-bundle]
        default: c2

permissions:
  contents: read

concurrency:
  group: recovery-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Recovery cell ${{ matrix.cell }}
    if: github.event_name == 'schedule' || inputs.cell != 'published-bundle'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ github.event_name == 'schedule' && fromJSON('["c2","monolith-sqlserver","split-postgres","split-postgres-no-worker","split-sqlserver","external-database","external-storage","remote-worker","split-database","import-identity","import-channel-round-trips","import-adversarial","import-replay-supersede"]') || fromJSON(format('["{0}"]', inputs.cell || 'c2')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Offline bundle import requires the containerd image store (#3137); GitHub-hosted
      # ubuntu-24.04 runners default to the classic overlay2 store, which import refuses.
      - name: Enable the containerd image store
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          current='{}'
          # An empty or whitespace-only file is treated as {}; anything other than exactly one
          # JSON object fails the step before the privileged config is touched.
          if sudo test -s "$config"; then
            current="$(sudo cat "$config" | jq -s 'if length == 0 then {}
              elif length == 1 and (.[0] | type) == "object" then .[0]
              else error("daemon.json must contain exactly one JSON object") end')"
          fi
          # Render and validate the complete config before replacing the privileged file.
          rendered="$(mktemp)"
          jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' <<<"$current" > "$rendered"
          jq -e 'type == "object" and .features["containerd-snapshotter"] == true' "$rendered" >/dev/null
          sudo install -m 0644 -o root -g root "$rendered" "$config"
          rm -f "$rendered"
          sudo systemctl restart docker
          ready=false
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          [ "$ready" = true ] || { echo "::error::docker daemon did not become ready after restart"; exit 1; }
          docker info --format '{{json .DriverStatus}}' \
            | jq -e 'any(.[]; .[0] == "driver-type" and .[1] == "io.containerd.snapshotter.v1")' >/dev/null \
            || { echo "::error::containerd image store is not active"; exit 1; }

      - name: Run recovery cell
        env:
          CELL: ${{ matrix.cell }}
        run: >-
          bash scripts/ci/recovery-matrix/run-cell.sh
          --cell "$CELL"
          --cosign "$(command -v cosign)"
          --evidence "$GITHUB_WORKSPACE/.recovery-matrix-work/evidence-$CELL.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: recovery-matrix-evidence-${{ matrix.cell }}-${{ github.run_id }}
          path: .recovery-matrix-work/evidence-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # Read-only, network-denied verification of the newest real published insider offline recovery
  # bundle (#3195). No fallback download, local build, fixture root or reset: a missing or
  # unverifiable published bundle fails this job.
  published-bundle:
    name: Published insider bundle verification
    if: github.event_name == 'schedule' || inputs.cell == 'published-bundle'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Verify published insider bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/ci/recovery-matrix/verify-published-bundle.sh
          --cosign "$(command -v cosign)"
          --evidence "$GITHUB_WORKSPACE/.recovery-matrix-work/evidence-published-bundle.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: recovery-matrix-evidence-published-bundle-${{ github.run_id }}
          path: .recovery-matrix-work/evidence-published-bundle.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
