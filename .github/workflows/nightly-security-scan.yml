name: Nightly Security Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest API image
        run: docker pull ghcr.io/${{ github.repository_owner }}/printfarmer-api:latest || true
      - name: Pull latest Frontend image
        run: docker pull ghcr.io/${{ github.repository_owner }}/printfarmer-frontend:latest || true
      - name: Trivy scan API
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/printfarmer-api:latest
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Trivy scan API JSON
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/printfarmer-api:latest
          format: 'json'
          output: api-trivy.json
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      - name: Trivy scan Frontend
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/printfarmer-frontend:latest
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Trivy scan Frontend JSON
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/printfarmer-frontend:latest
          format: 'json'
          output: fe-trivy.json
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      - name: Grype scan API
        uses: anchore/scan-action@v4
        with:
          image: ghcr.io/${{ github.repository_owner }}/printfarmer-api:latest
          fail-build: false
          severity-cutoff: high
      - name: Grype scan Frontend
        uses: anchore/scan-action@v4
        with:
          image: ghcr.io/${{ github.repository_owner }}/printfarmer-frontend:latest
          fail-build: false
          severity-cutoff: high
      - name: Summary
        run: |
          API_NEW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | .VulnerabilityID] | unique | length' api-trivy.json 2>/dev/null || echo 0)
          FE_NEW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | .VulnerabilityID] | unique | length' fe-trivy.json 2>/dev/null || echo 0)
          echo "Nightly scans completed" >> $GITHUB_STEP_SUMMARY
          echo "API HIGH/CRITICAL: $API_NEW" >> $GITHUB_STEP_SUMMARY
          echo "Frontend HIGH/CRITICAL: $FE_NEW" >> $GITHUB_STEP_SUMMARY
