name: Prune Long-Lived keep-open Dependabot PRs

on:
  schedule:
    - cron: '35 5 * * *' # Daily 05:35 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      MAX_AGE_DAYS: 30
      EXEMPT_LABEL: keep-open
      SECURITY_REVIEWED_LABEL: security-reviewed
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch keep-open Dependabot PRs
        run: |
          gh pr list --search "is:open is:pr author:dependabot label:${EXEMPT_LABEL}" --json number,title,updatedAt,createdAt,labels,headRefName > prs.json
          cat prs.json

      - name: Prune labels on aged PRs
        id: prune
        run: |
          set -euo pipefail
          max_days=${MAX_AGE_DAYS}
          max_seconds=$((max_days*24*3600))
          now_epoch=$(date -u +%s)
          kept=0
          removed=0

          jq -c '.[]' prs.json | while read -r pr; do
            num=$(echo "$pr" | jq -r '.number')
            title=$(echo "$pr" | jq -r '.title')
            updatedAt=$(echo "$pr" | jq -r '.updatedAt')
            createdAt=$(echo "$pr" | jq -r '.createdAt')
            labels=$(echo "$pr" | jq -r '[.labels[].name]|join(",")')
            last_iso=${updatedAt:-$createdAt}
            last_epoch=$(date -u -d "$last_iso" +%s || echo 0)
            age_days=$(( (now_epoch - last_epoch)/86400 ))

            # If security-reviewed present, skip removal
            if echo "$labels" | grep -qi "\b${SECURITY_REVIEWED_LABEL}\b"; then
              echo "PR #$num is security-reviewed; keeping keep-open label (age ${age_days}d)."
              kept=$((kept+1))
              continue
            fi

            if (( age_days > max_days )); then
              echo "Removing '${EXEMPT_LABEL}' from PR #$num (age ${age_days}d) - $title"
              gh issue edit "$num" --remove-label "$EXEMPT_LABEL" || true
              gh pr comment "$num" --body "Removed '${EXEMPT_LABEL}' label after ${age_days} days without merge. If still relevant, re-review or relabel." || true
              removed=$((removed+1))
            else
              echo "Keeping label on PR #$num (age ${age_days}d within limit)."
              kept=$((kept+1))
            fi
          done

          echo "removed=$removed" >> $GITHUB_OUTPUT
          echo "kept=$kept" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### Keep-Open Prune Report" >> $GITHUB_STEP_SUMMARY
          echo "- Threshold Days: ${MAX_AGE_DAYS}" >> $GITHUB_STEP_SUMMARY
          echo "- Removed Label: ${{ steps.prune.outputs.removed || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Kept Label: ${{ steps.prune.outputs.kept || '0' }}" >> $GITHUB_STEP_SUMMARY
