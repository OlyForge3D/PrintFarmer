name: Actions Version Check

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Scan workflows for outdated actions
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/check-actions-updates.sh
          OUTPUT=$(./scripts/check-actions-updates.sh)
          echo "$OUTPUT" > actions-version-summary.md
          echo "$OUTPUT" | grep '^OUTDATED_COUNT=' > count.tmp
          source count.tmp
          echo "outdated=$OUTDATED_COUNT" >> $GITHUB_OUTPUT
          # Strip OUTDATED_COUNT line for summary content
          echo "$OUTPUT" | grep -v '^OUTDATED_COUNT=' > CLEAN_SUMMARY.md
          cat CLEAN_SUMMARY.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if outdated)
        if: github.event_name == 'pull_request' && steps.scan.outputs.outdated != '0'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ### Actions Version Check
            Detected ${{ steps.scan.outputs.outdated }} outdated action(s).
            See summary below:
            $(cat CLEAN_SUMMARY.md)

      - name: Fail if outdated (no override)
        if: github.event_name == 'pull_request' && steps.scan.outputs.outdated != '0'
        run: |
          labels=$(jq -r '.[].name | ascii_downcase' <<< '${{ toJson(github.event.pull_request.labels) }}' || true)
          if echo "$labels" | grep -q '^allow-actions-update$'; then
            echo "Override label allow-actions-update present; not failing."; exit 0; fi
          echo "Outdated actions detected (${ { steps.scan.outputs.outdated } }) - failing build." >&2
          exit 1