name: Build Containers

# Optimized container build workflow
# - .NET and React are built natively on the runner (faster, better caching)
# - Container images only COPY the pre-built artifacts

on:
  push:
    branches: [main, dev/*]
    paths:
      - 'src/**'
      - 'scripts/docker/dockerfiles/**'
      - '.github/workflows/containers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  ORCA_VERSION: '2.3.1'

jobs:
  # ====================
  # JOB 1: Build .NET projects natively
  # ====================
  build-dotnet:
    name: Build .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/farm-web.sln

      - name: Build all projects
        run: dotnet build src/farm-web.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish src/api/Farm.Web.Api.csproj -c Release -o ./publish/api --no-build

      - name: Publish OrcaSlicer Worker
        run: dotnet publish src/orcaslicer-worker/Farm.OrcaSlicer.Worker.csproj -c Release -o ./publish/orcaslicer-worker --no-build

      - name: Publish Printer Discovery
        run: dotnet publish src/printer-discovery/Farm.PrinterDiscovery.Service.csproj -c Release -o ./publish/printer-discovery --no-build

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish/api
          retention-days: 1

      - name: Upload OrcaSlicer Worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-worker-publish
          path: ./publish/orcaslicer-worker
          retention-days: 1

      - name: Upload Printer Discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer-discovery-publish
          path: ./publish/printer-discovery
          retention-days: 1

  # ====================
  # JOB 2: Build React frontend natively
  # ====================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Web/ReactApp/package-lock.json

      - name: Install dependencies
        working-directory: src/Web/ReactApp
        run: npm ci

      - name: Build React app
        working-directory: src/Web/ReactApp
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/Web/ReactApp/dist
          retention-days: 1

  # ====================
  # JOB 3: Ensure OrcaSlicer base image exists
  # ====================
  ensure-orca-base:
    name: Ensure OrcaSlicer Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base_image: ${{ steps.output.outputs.base_image }}
    steps:
      - name: Log in to GHCR (for manifest check)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if OrcaSlicer base image exists
        id: check
        run: |
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orcaslicer-base:${{ env.ORCA_VERSION }}"
          echo "Checking for base image: $BASE_IMAGE"
          
          if docker manifest inspect "$BASE_IMAGE" > /dev/null 2>&1; then
            echo "✓ Base image exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Base image not found - will trigger build"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger base image build if needed
        if: steps.check.outputs.exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Triggering OrcaSlicer base image workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'orcaslicer-base-image.yml',
              ref: context.ref,
              inputs: {
                orca_version: '${{ env.ORCA_VERSION }}',
                force_rebuild: 'false'
              }
            });
            console.log('Workflow dispatched - waiting for it to complete...');
            
            // Wait and poll for completion (max 10 minutes)
            const maxWait = 10 * 60 * 1000;
            const startTime = Date.now();
            
            while (Date.now() - startTime < maxWait) {
              await new Promise(r => setTimeout(r, 30000)); // Wait 30s
              
              // Check if manifest exists now
              const { execSync } = require('child_process');
              try {
                execSync(`docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orcaslicer-base:${{ env.ORCA_VERSION }}`, { stdio: 'pipe' });
                console.log('Base image is now available!');
                return;
              } catch {
                console.log('Still waiting for base image...');
              }
            }
            
            core.setFailed('Timed out waiting for base image');

      - name: Output base image reference
        id: output
        run: |
          echo "base_image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orcaslicer-base:${{ env.ORCA_VERSION }}" >> $GITHUB_OUTPUT

  # ====================
  # JOB 4: Build container images
  # ====================
  build-containers:
    name: Build ${{ matrix.image }} container
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-frontend, ensure-orca-base]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            artifact: api-publish
            dockerfile: Dockerfile.api-optimized
          - image: frontend
            artifact: frontend-build
            dockerfile: Dockerfile.frontend-optimized
          - image: printer-discovery
            artifact: printer-discovery-publish
            dockerfile: Dockerfile.discovery-optimized
          - image: orcaslicer-worker
            artifact: orcaslicer-worker-publish
            dockerfile: Dockerfile.orcaslicer-worker-optimized
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create optimized Dockerfile
        run: |
          mkdir -p .github/dockerfiles
          
          case "${{ matrix.image }}" in
            api)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0-noble
          WORKDIR /app
          COPY artifact/ ./
          ENV ASPNETCORE_URLS=http://+:5245
          EXPOSE 5245
          ENTRYPOINT ["dotnet", "Farm.Web.Api.dll"]
          EOF
              ;;
            
            frontend)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'EOF'
          FROM nginx:alpine
          COPY artifact/ /usr/share/nginx/html
          COPY deploy/nginx/nginx.conf /etc/nginx/nginx.conf
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF
              ;;
            
            printer-discovery)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0-noble
          WORKDIR /app
          COPY artifact/ ./
          EXPOSE 8080
          ENTRYPOINT ["dotnet", "Farm.PrinterDiscovery.Service.dll"]
          EOF
              ;;
            
            orcaslicer-worker)
              cat > .github/dockerfiles/${{ matrix.dockerfile }} << 'DOCKERFILE'
          # Use OrcaSlicer base image with pre-extracted binaries
          FROM ${{ needs.ensure-orca-base.outputs.base_image }}
          
          # Install .NET runtime
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  wget ca-certificates \
              && wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh \
              && chmod +x dotnet-install.sh \
              && ./dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir /usr/share/dotnet \
              && ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet \
              && rm dotnet-install.sh \
              && apt-get remove -y wget \
              && apt-get autoremove -y \
              && rm -rf /var/lib/apt/lists/*
          
          WORKDIR /app
          COPY artifact/ ./
          
          ENV ASPNETCORE_URLS=http://+:8080
          ENV ORCASLICER_PATH=/opt/orcaslicer
          EXPOSE 8080
          
          ENTRYPOINT ["dotnet", "Farm.OrcaSlicer.Worker.dll"]
          DOCKERFILE
              ;;
          esac

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/dockerfiles/${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================
  # JOB 5: Summary
  # ====================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-containers]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ needs.build-containers.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.build-containers.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Printer Discovery | ${{ needs.build-containers.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OrcaSlicer Worker | ${{ needs.build-containers.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-api\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-printer-discovery\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-orcaslicer-worker\`" >> $GITHUB_STEP_SUMMARY
