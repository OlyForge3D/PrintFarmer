name: Enforce Path Casing

on:
  pull_request:
    branches: ['**']

jobs:
  path-casing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps (tools)
        run: npm ci
        working-directory: ./
      - name: Run path casing check
        run: node ./scripts/check-path-casing.js
