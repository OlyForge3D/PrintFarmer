name: Enforce Path Casing

on:
  pull_request:
    branches: ['**']

jobs:
  path-casing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run path casing check
        run: node ./scripts/check-path-casing.js
