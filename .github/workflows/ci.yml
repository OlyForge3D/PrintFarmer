name: NEVER MERGE - single hosted sidebar diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-hosted-sidebar-3426
  cancel-in-progress: false

env:
  SOURCE_SHA: 98cd84fc1fc685933b67522ca1ed97e5128c9e26
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_SIMULATOR_DEVICE_FAMILY: iPad
  IOS_SIMULATOR_DEVICE_PREFIX: iPad
  IOS_SIMULATOR_DEVICE_PREFERENCE: iPad Pro 13-inch (M5)
  IOS_SIMULATOR_RUNTIME_PREFERENCE: iOS 26.5

jobs:
  diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/squad/3426-single-hosted-sidebar-diagnostic' &&
      github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source/mobile
        shell: bash
    steps:
      - name: Checkout immutable diagnostic harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout exact approved app and tests
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false

      - name: Verify provenance and observer contracts
        run: |
          set -euo pipefail
          mkdir -p build-sidebar
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > build-sidebar/source-sha.txt
          git -C ../../harness rev-parse HEAD > build-sidebar/harness-sha.txt
          shasum -a 256 ../../harness/mobile/scripts/capture-sidebar-diagnostic.py \
            scripts/run-tests.py PrintFarmer/Utilities/UITestBootstrap.swift \
            PrintFarmerUITests/FilamentCoverageUITests.swift > build-sidebar/source-checksums.txt
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s ../../harness/mobile/scripts/tests \
            -p test_capture_sidebar_diagnostic.py -v
          xcodebuild -version | tee build-sidebar/xcode.log
          test "$(head -n 1 build-sidebar/xcode.log)" = "Xcode 26.6"
          test "$(sed -n '2p' build-sidebar/xcode.log)" = "Build version 17F113"

      - name: Install and resolve exact approved iPad runtime
        timeout-minutes: 30
        run: |
          set -euo pipefail
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-26-5
          approved_runtime() {
            xcrun simctl list runtimes -j | jq -e --arg id "$runtime" \
              '.runtimes[] | select(.identifier == $id and .buildversion == "23F77" and .isAvailable)' >/dev/null
          }
          if ! approved_runtime; then
            xcodebuild -downloadPlatform iOS -buildVersion 23F77 -architectureVariant arm64
            approved_runtime
          fi
          if ! xcrun simctl list devices available -j | jq -e --arg id "$runtime" \
            '.devices[$id][]? | select(.isAvailable and .name == "iPad Pro 13-inch (M5)")' >/dev/null; then
            type="$(xcrun simctl list devicetypes -j | jq -er \
              '.devicetypes[] | select(.name == "iPad Pro 13-inch (M5)") | .identifier')"
            xcrun simctl create "iPad Pro 13-inch (M5)" "$type" "$runtime"
          fi
          xcrun simctl list runtimes -j > build-sidebar/runtimes.json
          xcrun simctl list devices available -j > build-sidebar/devices.json
          ../scripts/ci/resolve-ios-simulator.sh 2>&1 | tee build-sidebar/destination.log

      - name: Boot approved iPad and resolve dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"
          xcodebuild -project PrintFarmer.xcodeproj -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath build-sidebar/SourcePackages \
            2>&1 | tee build-sidebar/packages.log

      - name: Build unchanged source for testing
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild -project PrintFarmer.xcodeproj -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 -derivedDataPath build-sidebar \
            -clonedSourcePackagesDirPath build-sidebar/SourcePackages \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal build-for-testing \
            2>&1 | tee build-sidebar/build.log

      - name: ONE focused diagnostic invocation - no retries
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python3 ../../harness/mobile/scripts/capture-sidebar-diagnostic.py \
            --udid "$SIMULATOR_UDID" --output build-sidebar/observer -- \
            python3 scripts/run-tests.py -- test-without-building \
            -project PrintFarmer.xcodeproj -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 -derivedDataPath build-sidebar \
            -clonedSourcePackagesDirPath build-sidebar/SourcePackages \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            -only-testing:PrintFarmerUITests/FilamentCoverageUITests/testDuplicateDisplayNamePrintersRemainDistinctWithoutCoverageBadges \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -resultBundlePath build-sidebar/Sidebar.xcresult \
            2>&1 | tee build-sidebar/Sidebar.log

      - name: Export existing result evidence
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ -d build-sidebar/Sidebar.xcresult ]; then
            xcrun xcresulttool export diagnostics --path build-sidebar/Sidebar.xcresult \
              --output-path build-sidebar/diagnostics
            xcrun xcresulttool export attachments --path build-sidebar/Sidebar.xcresult \
              --output-path build-sidebar/all-attachments
          fi

      - name: Retain diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue3426-single-hosted-sidebar
          if-no-files-found: error
          retention-days: 30
          path: |
            source/mobile/build-sidebar/*.txt
            source/mobile/build-sidebar/*.json
            source/mobile/build-sidebar/*.jsonl
            source/mobile/build-sidebar/*.log
            source/mobile/build-sidebar/Sidebar.xcresult
            source/mobile/build-sidebar/observer
            source/mobile/build-sidebar/diagnostics
            source/mobile/build-sidebar/all-attachments

      - name: Diagnostic evidence is never a merge qualification
        if: always()
        run: |
          echo "::error::Diagnostic-only execution. Never merge this branch or treat a pass as a causal fix."
          exit 1
