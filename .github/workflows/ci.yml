name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'global.json'
      - 'Directory.Build.props'
      - 'src/Web/ReactApp/package.json'
      - 'src/Web/ReactApp/package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'global.json'
      - 'Directory.Build.props'
      - 'src/Web/ReactApp/package.json'
      - 'src/Web/ReactApp/package-lock.json'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: src/Web/ReactApp/package-lock.json

      - name: Restore .NET
        working-directory: src
        run: dotnet restore ./farm-web.sln

      - name: Install dotnet-ef
        run: |
          dotnet tool install -g dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Check EF Core migration drift
        working-directory: src
        run: |
          status=0

          check_migration_drift() {
            local label="$1"
            local provider="$2"
            local project="$3"
            local context="$4"

            echo "Checking ${label} for pending EF Core model changes..."
            if ! DB_PROVIDER="$provider" dotnet ef migrations has-pending-model-changes \
              --project "$project" \
              --startup-project "$project" \
              --context "$context"; then
              echo "::error title=EF Core migration drift detected::${label} has pending model changes. Add a migration for ${context} using DB_PROVIDER=${provider}."
              status=1
            fi
          }

          check_migration_drift "AppDbContext PostgreSQL (Farm.Migrations.PostgreSQL)" "postgres" "./migrations/Farm.Migrations.PostgreSQL" "AppDbContext"
          check_migration_drift "AppDbContext SQL Server (Farm.Migrations.SqlServer)" "sqlserver" "./migrations/Farm.Migrations.SqlServer" "AppDbContext"
          check_migration_drift "SlicerDbContext PostgreSQL (Farm.Slicer.Migrations.PostgreSQL)" "postgres" "./migrations/Farm.Slicer.Migrations.PostgreSQL" "SlicerDbContext"
          check_migration_drift "SlicerDbContext SQL Server (Farm.Slicer.Migrations.SqlServer)" "sqlserver" "./migrations/Farm.Slicer.Migrations.SqlServer" "SlicerDbContext"

          exit "$status"

      - name: Install frontend deps
        working-directory: src/Web/ReactApp
        run: npm ci

      - name: Build .NET
        working-directory: src
        run: dotnet build ./farm-web.sln -c Debug --no-restore

      - name: Build frontend
        working-directory: src/Web/ReactApp
        run: npm run build

      - name: Test .NET
        # Temporarily restrict tests to quick unit/in-memory tests that do not require Docker or external services.
        # This avoids CI failures caused by private Docker images and long integration tests.
        working-directory: src
        run: |
          dotnet test ./farm-web.sln -c Debug --no-build --logger trx --results-directory TestResults \
            --filter "Category!=DbHeavy&Category!=Docker"

      - name: Test frontend (with coverage)
        working-directory: src/Web/ReactApp
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/Web/ReactApp/coverage

      - name: Upload Test Results (.NET)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: src/TestResults

      - name: Lint frontend
        working-directory: src/Web/ReactApp
        run: npm run lint

      - name: Dotnet format (check)
        working-directory: src
        run: dotnet format --verify-no-changes ./farm-web.sln || echo "Dotnet format issues detected" && exit 0

      - name: Upload test results summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- .NET test results: stored in artifact dotnet-test-results" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend coverage: artifact frontend-coverage" >> $GITHUB_STEP_SUMMARY