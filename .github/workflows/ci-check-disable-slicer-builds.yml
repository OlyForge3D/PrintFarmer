name: Enforce DISABLE_SLICER_BUILDS on PRs

on:
  pull_request:
    branches: [ main ]

jobs:
  check-disable-flag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .env.template has DISABLE_SLICER_BUILDS=true
        run: |
          if ! grep -E '^\s*DISABLE_SLICER_BUILDS\s*=\s*true\s*$' .env.template >/dev/null 2>&1; then
            echo "ERROR: .env.template must contain DISABLE_SLICER_BUILDS=true to keep slicer builds disabled by default." >&2
            echo "Update .env.template or provide justification in PR if you need to change this." >&2
            exit 1
          fi
