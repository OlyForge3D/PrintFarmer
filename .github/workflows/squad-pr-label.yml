name: Label squad-authored PRs

# Applies the `squad` scope label to pull requests that resolve a squad author
# identity, so the review gate's scope does not depend on an agent remembering
# to label its own work.
#
# WHY THIS IS A SAFETY NET, NOT THE CONTROL: the label decides whether
# .github/workflows/squad-review-verdict.yml gates the PR, and an unlabelled PR
# is never merged unattended (see .github/ralph-reference.md). So a PR this
# workflow fails to label degrades to "a human merges it deliberately", which is
# more conservative than gating, not less. Missing a label costs manual effort;
# it never lets unreviewed agent code auto-land.
#
# Runs only on `opened` and `reopened`. Re-applying on every `synchronize` would
# fight a maintainer who deliberately removed the label to take a PR out of
# scope.

run-name: "Label squad PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: squad-pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply squad scope label
    runs-on: ubuntu-latest
    steps:
      # Checks out the default branch, never the pull request head, so a PR can
      # never supply the logic that classifies it.
      - name: Check out label logic from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Apply squad label when the author resolves to a squad member
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const gate = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/squad-verdict-gate.mjs`
            );

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const pull = context.payload.pull_request;

            if (gate.hasSquadScopeLabel(pull.labels ?? [])) {
              core.info(`PR #${prNumber} already carries the '${gate.squadScopeLabel}' label.`);
              return;
            }

            const labelData = await github.paginate(
              github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 },
            );
            const roster = gate.rosterFromLabels(labelData.map((label) => label.name));

            let linkedIssueLabels = [];
            try {
              const linked = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 20) {
                        nodes { labels(first: 50) { nodes { name } } }
                      }
                    }
                  }
                }`, { owner, repo, number: prNumber });
              linkedIssueLabels = (linked.repository.pullRequest
                .closingIssuesReferences.nodes ?? [])
                .flatMap((node) => (node.labels?.nodes ?? []).map((l) => l.name));
            } catch (error) {
              core.warning(`Could not read linked issues: ${error.message}`);
            }

            const author = gate.resolveAuthorMembers({
              prBody: pull.body ?? '',
              branchName: pull.head?.ref ?? '',
              linkedIssueLabels,
              roster,
            });

            if (author.members.size === 0) {
              core.notice(
                `PR #${prNumber}: no squad author identity resolved, so the ` +
                `'${gate.squadScopeLabel}' label was not applied. This PR is ` +
                'outside the review gate and is not eligible for unattended ' +
                'merge; a human merges it. Add the label by hand if it is ' +
                'squad-authored work.',
              );
              return;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber,
              labels: [gate.squadScopeLabel],
            });
            core.notice(
              `PR #${prNumber}: applied '${gate.squadScopeLabel}' — authored by ` +
              `${[...author.members].join(', ')} (source: ${author.source}).`,
            );
