name: One-shot canonical tag diagnostic 2736

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-tag-diagnostic-2736
  cancel-in-progress: false

env:
  RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}

jobs:
  boundary:
    name: Verify owner and successor boundary without publisher credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - name: Read-only admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/diagnose-release-tag-2736.mjs preflight

  request:
    name: Attempt the single fixed tag request and stop
    needs: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-insider
    env:
      RELEASE_PUBLISHER_APP_ID: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
    concurrency:
      group: release-insider
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - name: Recheck before publisher credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/diagnose-release-tag-2736.mjs protected-preflight
      - name: Obtain existing protected publisher token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          owner: OlyForge3D
          repositories: PrintFarmer
          app-id: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
          permission-checks: read
          permission-statuses: read
          permission-administration: write
          permission-actions: read
      - name: One POST only; no release transitions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          RELEASE_PUBLISHER_INSTALLATION_ID: ${{ steps.publisher.outputs.installation-id }}
          RELEASE_PUBLICATION_ENVIRONMENT: release-insider
        run: node scripts/ci/diagnose-release-tag-2736.mjs request
