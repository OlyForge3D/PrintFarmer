name: PrusaSlicer preseed + Docker build

on:
  workflow_dispatch:

jobs:
  prepare-preseed:
    name: Prepare Flatpak preseed (amd64)
    runs-on: ubuntu-latest
    outputs:
      artifact-name: prusa-tar
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree dbus-user-session ca-certificates gnupg2 tar p7zip-full squashfs-tools dbus-x11

      - name: Add Flathub
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true

      - name: Install PrusaSlicer via Flatpak (user)
        run: |
          # Use dbus-run-session to provide user session to flatpak/bwrap
          dbus-run-session -- flatpak --user install -y flathub com.prusa3d.PrusaSlicer || true

      - name: Collect installed files and create tarball
        run: |
          mkdir -p prusa-dist
          # Copy both user and system flatpak paths if present
          if [ -d "$HOME/.local/share/flatpak/app/com.prusa3d.PrusaSlicer" ]; then cp -a "$HOME/.local/share/flatpak/app/com.prusa3d.PrusaSlicer" prusa-dist/ || true; fi
          if [ -d "/var/lib/flatpak/app/com.prusa3d.PrusaSlicer" ]; then sudo cp -a /var/lib/flatpak/app/com.prusa3d.PrusaSlicer prusa-dist/ || true; fi
          if [ -d "$HOME/.local/share/flatpak/exports" ]; then cp -a "$HOME/.local/share/flatpak/exports" prusa-dist/ || true; fi
          if [ -d "/var/lib/flatpak/exports" ]; then sudo cp -a /var/lib/flatpak/exports prusa-dist/ || true; fi
          tar czf prusa.tar.gz -C . prusa-dist
          ls -lh prusa.tar.gz

      - name: Upload preseed artifact
        uses: actions/upload-artifact@v7
        with:
          name: prusa-tar
          path: prusa.tar.gz

  build-image:
    name: Build Docker image using preseed
    runs-on: ubuntu-latest
    needs: prepare-preseed
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download preseed artifact
        uses: actions/download-artifact@v4
        with:
          name: prusa-tar
          path: .

      - name: Setup QEMU and Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker (optional)
        if: false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (uses prusa.tar.gz in context)
        env:
          PRUSASLICER_VERSION: 2.9.3
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHA='${{ github.sha }}'
          TAG=''
          TOKEN='${{ secrets.GITHUB_TOKEN }}'
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG='${{ github.event.release.tag_name }}'
            RELEASE_BODY='${{ github.event.release.body }}'
          elif echo "${GITHUB_REF:-}" | grep -q '^refs/tags/'; then
            TAG=${GITHUB_REF#refs/tags/}
            RELEASE_BODY=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/tags/$TAG" | jq -r '.body // ""' 2>/dev/null || true)
          else
            RELEASE_BODY=''
          fi
          RELEASE_BODY_SANITIZED=$(printf "%s" "$RELEASE_BODY" | tr '\n' ' ' | sed 's/"/'"'"'/g' | cut -c1-1000)

          DOCKER_BUILD_CMD=(DOCKER_BUILDKIT=1 docker buildx build --platform linux/amd64 --progress=plain --load)
          DOCKER_BUILD_CMD+=(--build-arg PRUSASLICER_VERSION=${PRUSASLICER_VERSION})
          DOCKER_BUILD_CMD+=(--build-arg ALLOW_STUB=false)
          DOCKER_BUILD_CMD+=(-f Dockerfile.prusaslicer -t prusa-e2e:${PRUSASLICER_VERSION})
          DOCKER_BUILD_CMD+=(--label "org.opencontainers.image.revision=${SHA}")
          DOCKER_BUILD_CMD+=(--label "org.opencontainers.image.created=${TIMESTAMP}")
          if [ -n "$RELEASE_BODY_SANITIZED" ]; then
            DOCKER_BUILD_CMD+=(--label "org.opencontainers.image.description=${RELEASE_BODY_SANITIZED}")
          fi
          # Execute build
          "${DOCKER_BUILD_CMD[@]}" .
