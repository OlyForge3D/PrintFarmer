name: iOS PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-pr-ci.yml'

concurrency:
  group: ios-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Resolve iPhone simulator destination
        run: |
          set -euo pipefail
          SIMCTL_DEVICES_JSON="$(xcrun simctl list devices available -j)"
          SIMULATOR_UDID="$(
            SIMCTL_DEVICES_JSON="$SIMCTL_DEVICES_JSON" python3 <<'PY'
          import json
          import os
          import re
          import sys

          data = json.loads(os.environ["SIMCTL_DEVICES_JSON"])
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              version = tuple(int(part) for part in re.findall(r"\d+", runtime))
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") is False or not name.startswith("iPhone "):
                      continue
                  model = tuple(int(part) for part in re.findall(r"\d+", name))
                  candidates.append((version, model, name, device["udid"]))

          if not candidates:
              sys.exit("No available iPhone simulator found")

          candidates.sort()
          print(candidates[-1][3])
          PY
          )"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Using iPhone simulator UDID: $SIMULATOR_UDID"

      - name: Build (Debug)
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

  test:
    name: Unit Tests (iOS) — Informational
    runs-on: macos-latest
    needs: build
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Resolve iPhone simulator destination
        run: |
          set -euo pipefail
          SIMCTL_DEVICES_JSON="$(xcrun simctl list devices available -j)"
          SIMULATOR_UDID="$(
            SIMCTL_DEVICES_JSON="$SIMCTL_DEVICES_JSON" python3 <<'PY'
          import json
          import os
          import re
          import sys

          data = json.loads(os.environ["SIMCTL_DEVICES_JSON"])
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              version = tuple(int(part) for part in re.findall(r"\d+", runtime))
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") is False or not name.startswith("iPhone "):
                      continue
                  model = tuple(int(part) for part in re.findall(r"\d+", name))
                  candidates.append((version, model, name, device["udid"]))

          if not candidates:
              sys.exit("No available iPhone simulator found")

          candidates.sort()
          print(candidates[-1][3])
          PY
          )"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Using iPhone simulator UDID: $SIMULATOR_UDID"

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test \
            -only-testing:PrintFarmerTests \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: mobile/build/TestResults.xcresult
          retention-days: 7
