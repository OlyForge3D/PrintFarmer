name: iOS PR CI

# Diagnostic branch only, NEVER MERGE. Opening the draft consumes the single
# authorized execution; pushes/reopens cannot automatically start another.
on:
  pull_request:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ios-stall-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capture:
    name: DIAGNOSTIC ONLY - iPad shard 4 (not release evidence)
    if: github.head_ref == 'jpapiez-squad-3263-ipad-xcui-tabbar-stall'
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      IOS_SIMULATOR_DEVICE_FAMILY: iPad
      IOS_SIMULATOR_DEVICE_PREFIX: iPad
      IOS_SIMULATOR_DEVICE_PREFERENCE: iPad Pro 13-inch (M5)
      IOS_SIMULATOR_RUNTIME_PREFERENCE: iOS 26.5
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record source and enforce approved Xcode
        run: |
          set -euo pipefail
          mkdir -p build-capture
          git rev-parse HEAD | tee build-capture/head.txt
          export DEVELOPER_DIR="/Applications/Xcode_26.6.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version | tee build-capture/xcode.txt
          test "$(head -n 1 build-capture/xcode.txt)" = "Xcode 26.6"
          test "$(sed -n '2s/^Build version //p' build-capture/xcode.txt)" = "17F113"

      - name: Install exact approved runtime and device
        timeout-minutes: 30
        run: |
          set -euo pipefail
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          has_approved_runtime() {
            xcrun simctl list runtimes -j | jq -e \
              --arg runtime "$RUNTIME_ID" \
              '.runtimes[] | select(.identifier == $runtime and .buildversion == "23F77" and .isAvailable)' \
              >/dev/null
          }
          if ! has_approved_runtime; then
            sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild \
              -downloadPlatform iOS -buildVersion 23F77 -architectureVariant arm64
            has_approved_runtime
          fi
          if ! xcrun simctl list devices available -j | jq -e \
            --arg runtime "$RUNTIME_ID" \
            '.devices[$runtime][]? | select(.isAvailable and .name == "iPad Pro 13-inch (M5)")' >/dev/null; then
            TYPE_ID="$(xcrun simctl list devicetypes -j | jq -er \
              '.devicetypes[] | select(.name == "iPad Pro 13-inch (M5)") | .identifier')"
            xcrun simctl create "iPad Pro 13-inch (M5)" "$TYPE_ID" "$RUNTIME_ID"
          fi
          xcrun simctl list runtimes -j > build-capture/runtimes.json
          xcrun simctl list devices available -j > build-capture/devices.json

      - name: Resolve and boot pinned iPad
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(../scripts/ci/resolve-ios-simulator.sh --udid)"
          printf '%s\n' "$SIMULATOR_UDID" > build-capture/simulator-udid.txt
          ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Validate capture wrapper
        run: python3 -m unittest discover -s scripts/tests -p 'test_capture_main_thread_stall.py' -v

      - name: Build diagnostic XCUI
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild -project PrintFarmer.xcodeproj -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 -derivedDataPath build-capture \
            -clonedSourcePackagesDirPath build-capture/SourcePackages \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) PFARM_STALL_CAPTURE' \
            build-for-testing 2>&1 | tee build-capture/build.log

      - name: Single original iPad shard 4 invocation with live stack capture
        timeout-minutes: 25
        run: |
          set -o pipefail
          python3 scripts/capture-main-thread-stall.py \
            --udid "$SIMULATOR_UDID" --output build-capture/stacks -- \
            python3 scripts/run-tests.py -- test-without-building \
            -project PrintFarmer.xcodeproj -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 -derivedDataPath build-capture \
            -clonedSourcePackagesDirPath build-capture/SourcePackages \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            -only-testing:PrintFarmerUITests/ColdOfflineShellUITests \
            -only-testing:PrintFarmerUITests/UIWaitBudgetTests \
            -only-testing:PrintFarmerUITests/JobDetailIPadNavigationUITests \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -resultBundlePath build-capture/XCUIShard.xcresult \
            2>&1 | tee build-capture/XCUIShard.log

      - name: Export native diagnostics even after test failure
        if: always()
        run: |
          if [ -d build-capture/XCUIShard.xcresult ]; then
            xcrun xcresulttool export diagnostics \
              --path build-capture/XCUIShard.xcresult \
              --output-path build-capture/diagnostics
          fi

      - name: Upload diagnostic evidence even after setup failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue3263-single-capture
          path: |
            mobile/build-capture/head.txt
            mobile/build-capture/xcode.txt
            mobile/build-capture/runtimes.json
            mobile/build-capture/devices.json
            mobile/build-capture/simulator-udid.txt
            mobile/build-capture/build.log
            mobile/build-capture/XCUIShard*
            mobile/build-capture/stacks/
            mobile/build-capture/diagnostics/
          retention-days: 14
          if-no-files-found: error
