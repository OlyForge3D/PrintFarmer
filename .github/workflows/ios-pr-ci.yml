name: iOS PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # No `paths:` filter — every PR must produce the required "Build (iOS)"
    # status (see #1365: a path-filtered trigger meant non-mobile PRs never
    # got a "Build (iOS)" check at all, leaving branch protection permanently
    # BLOCKED). The `select` job below decides whether the Xcode toolchain
    # actually needs to run; PRs that don't touch iOS-relevant paths still see
    # "Build (iOS)" turn green quickly instead of never posting.

concurrency:
  group: ios-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Prefer a stable, explicit simulator over the newest available runtime/model.
  IOS_SIMULATOR_DEVICE_PREFERENCE: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
  IOS_SIMULATOR_RUNTIME_PREFERENCE: iOS 26.4,iOS 26.5

jobs:
  # ---------------------------------------------------------------------------
  # select — always runs on a cheap ubuntu runner and decides whether the
  # expensive macOS jobs below have real work to do. This mirrors the
  # selector pattern in ci.yml: the trigger has no path filter so the
  # required check always posts, and downstream jobs use the selector output
  # to skip work cheaply instead of never running.
  # ---------------------------------------------------------------------------
  select:
    name: Select iOS build
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.selector.outputs.should_run }}
      reason: ${{ steps.selector.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether iOS-relevant paths changed
        id: selector
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          should_run=true
          reason="non-pull_request event — running full iOS build"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
              changed=$(git diff --no-renames --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null)
              rc=$?
              if (( rc != 0 )); then
                should_run=true
                reason="diff failed — running full iOS build to be safe"
              elif [[ -z "$changed" ]]; then
                should_run=false
                reason="no changed files detected"
              elif echo "$changed" | grep -Eq '^(mobile/|\.github/workflows/ios-pr-ci\.yml$|scripts/ci/resolve-ios-simulator\.sh$|scripts/ci/test-resolve-ios-simulator\.sh$)'; then
                should_run=true
                reason="iOS-relevant paths changed"
              else
                should_run=false
                reason="no iOS-relevant paths changed"
              fi
            else
              should_run=true
              reason="missing base/head SHA — running full iOS build to be safe"
            fi
          fi
          {
            echo "should_run=$should_run"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "iOS build selector: should_run=$should_run reason=$reason"

  build:
    name: Build (iOS)
    needs: select
    # `select` failing/being cancelled must NOT let this required check skip
    # (skip counts as a pass for branch protection) — so this job runs even
    # when `select` didn't succeed, and the step-level conditions below treat
    # a non-successful `select` the same as `should_run == 'true'`: fail safe
    # toward running the real build rather than silently passing unvalidated.
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report skip reason
        if: needs.select.result == 'success' && needs.select.outputs.should_run != 'true'
        run: echo "Skipping iOS build — ${{ needs.select.outputs.reason }}"

      - name: Verify marketing version consistency
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: ./scripts/verify-marketing-version.sh source 1.0

      - name: Select Xcode
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve package dependencies
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Archive future marketing version
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -archivePath build/MarketingVersion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.1 \
            SKIP_INSTALL=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            archive

      - name: Verify future archived marketing version
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: |
          ./scripts/verify-marketing-version.sh resolved 1.1 \
            build/MarketingVersion.xcarchive/Products/Applications/PrintFarmer.app/Info.plist

  test:
    name: Unit Tests (iOS)
    runs-on: macos-latest
    needs: [select, build]
    if: needs.select.outputs.should_run == 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve pinned iOS simulator destination
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Reset and boot iOS simulator
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl erase "$SIMULATOR_UDID"
          ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Build unit tests for testing
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build-for-testing

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test-without-building \
            -only-testing:PrintFarmerTests \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: mobile/build/TestResults.xcresult
          retention-days: 7

  attention-xcui:
    name: Attention XCUI (${{ matrix.family }}, accessibility XXXL)
    runs-on: macos-latest
    needs: select
    if: needs.select.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: iphone
            family: iPhone
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
          - key: ipad
            family: iPad
            prefix: iPad
            device_preference: iPad Pro 13-inch (M5),iPad Pro 11-inch (M5),iPad Air 13-inch (M4),iPad Air 11-inch (M4),iPad (A16),iPad mini (A17 Pro)
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Test simulator resolver
        if: matrix.key == 'iphone'
        run: ../scripts/ci/test-resolve-ios-simulator.sh

      - name: Resolve package dependencies
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages"

      - name: Resolve ${{ matrix.family }} simulator destination
        env:
          IOS_SIMULATOR_DEVICE_FAMILY: ${{ matrix.family }}
          IOS_SIMULATOR_DEVICE_PREFIX: ${{ matrix.prefix }}
          IOS_SIMULATOR_DEVICE_PREFERENCE: ${{ matrix.device_preference }}
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Boot ${{ matrix.family }} simulator
        run: ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Run Attention actions XCUI at accessibility XXXL
        timeout-minutes: 25
        run: |
          grep -Fq 'UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge' \
            PrintFarmerUITests/AttentionActionsUITests.swift
          xcodebuild test \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:PrintFarmerUITests/AttentionActionsUITests \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            -resultBundlePath "build-${{ matrix.key }}/AttentionActions.xcresult"

      - name: Upload Attention XCUI results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-attention-xcui-${{ matrix.key }}
          path: mobile/build-${{ matrix.key }}/AttentionActions.xcresult
          retention-days: 7

  xcui-suites:
    name: XCUI (${{ matrix.family }}, ${{ matrix.suite }})
    runs-on: macos-latest
    needs: select
    if: needs.select.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
        suite:
          - LoginFlowUITests
          - OperatorShellUITests
          - AttentionDisabledFallbackUITests
          - ScanStationUITests
          - HarvestUITests
          - PartsInventoryUITests
          - PrinterListUITests
          - FilamentCoverageUITests
          - ColdOfflineShellUITests
          - JobDetailIPadNavigationUITests
          - TaskActionRoutingUITests
          - ShiftTasksUITests
          - ShiftTasksGroupedUITests
          - ShiftTasksFailedRefreshUITests
        include:
          - family: iPhone
            key: iphone
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
          - family: iPad
            key: ipad
            prefix: iPad
            device_preference: iPad Pro 13-inch (M5),iPad Pro 11-inch (M5),iPad Air 13-inch (M4),iPad Air 11-inch (M4),iPad (A16),iPad mini (A17 Pro)
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}-${{ matrix.suite }}/SourcePackages"

      - name: Resolve ${{ matrix.family }} simulator destination
        env:
          IOS_SIMULATOR_DEVICE_FAMILY: ${{ matrix.family }}
          IOS_SIMULATOR_DEVICE_PREFIX: ${{ matrix.prefix }}
          IOS_SIMULATOR_DEVICE_PREFERENCE: ${{ matrix.device_preference }}
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Boot ${{ matrix.family }} simulator
        run: ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Run ${{ matrix.suite }} XCUI
        timeout-minutes: 25
        run: |
          xcodebuild test \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}-${{ matrix.suite }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}-${{ matrix.suite }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:PrintFarmerUITests/${{ matrix.suite }} \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            -resultBundlePath "build-${{ matrix.key }}-${{ matrix.suite }}/${{ matrix.suite }}.xcresult"

      - name: Upload ${{ matrix.suite }} XCUI results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcui-${{ matrix.key }}-${{ matrix.suite }}
          path: mobile/build-${{ matrix.key }}-${{ matrix.suite }}/${{ matrix.suite }}.xcresult
          retention-days: 7
