name: iOS PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-pr-ci.yml'

concurrency:
  group: ios-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Prefer a stable, explicit simulator over the newest available runtime/model.
  IOS_SIMULATOR_DEVICE_PREFERENCE: iPhone 15,iPhone 16
  IOS_SIMULATOR_RUNTIME_PREFERENCE: iOS 26.4,iOS 26.5

jobs:
  build:
    name: Build (iOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Resolve pinned iOS simulator destination
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Build (Debug)
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

  test:
    name: Unit Tests (iOS) — Informational
    runs-on: macos-latest
    needs: build
    # Keep informational until the macOS runner proves simulator launch stability;
    # promote by removing continue-on-error after repeated green CI runs.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve pinned iOS simulator destination
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Boot iOS simulator
        run: ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Build unit tests for testing
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build-for-testing

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test-without-building \
            -only-testing:PrintFarmerTests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: mobile/build/TestResults.xcresult
          retention-days: 7
