name: iOS PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # No `paths:` filter — every PR must produce the required "Build (iOS)"
    # status (see #1365: a path-filtered trigger meant non-mobile PRs never
    # got a "Build (iOS)" check at all, leaving branch protection permanently
    # BLOCKED). The `select` job below decides whether the Xcode toolchain
    # actually needs to run; PRs that don't touch iOS-relevant paths still see
    # "Build (iOS)" turn green quickly instead of never posting.

concurrency:
  group: ios-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Preferences only order devices/runtimes; the resolver enforces build approval.
  IOS_SIMULATOR_DEVICE_PREFERENCE: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
  IOS_SIMULATOR_RUNTIME_PREFERENCE: iOS 26.5

jobs:
  # ---------------------------------------------------------------------------
  # select — always runs on a cheap ubuntu runner and decides whether the
  # expensive macOS jobs below have real work to do. This mirrors the
  # selector pattern in ci.yml: the trigger has no path filter so the
  # required check always posts, and downstream jobs use the selector output
  # to skip work cheaply instead of never running.
  # ---------------------------------------------------------------------------
  select:
    name: Select iOS build
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.selector.outputs.should_run }}
      reason: ${{ steps.selector.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether iOS-relevant paths changed
        id: selector
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Logic lives in the script so scripts/ci/tests/test-select-ios-build.sh
        # can exercise the real git plumbing; `fetch-depth: 0` above guarantees
        # the merge-base it resolves is reachable. Mirrors ci.yml's use of
        # scripts/ci/compute-change-set.sh.
        run: bash scripts/ci/select-ios-build.sh

  build:
    name: Build (iOS)
    needs: select
    # `select` failing/being cancelled must NOT let this required check skip
    # (skip counts as a pass for branch protection) — so this job runs even
    # when `select` didn't succeed, and the step-level conditions below treat
    # a non-successful `select` the same as `should_run == 'true'`: fail safe
    # toward running the real build rather than silently passing unvalidated.
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report skip reason
        if: needs.select.result == 'success' && needs.select.outputs.should_run != 'true'
        run: echo "Skipping iOS build — ${{ needs.select.outputs.reason }}"

      - name: Verify marketing version consistency
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: ./scripts/verify-marketing-version.sh source 1.0

      - name: Select Xcode
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve package dependencies
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Archive future marketing version
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -archivePath build/MarketingVersion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.1 \
            SKIP_INSTALL=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            archive

      - name: Verify future archived marketing version
        if: needs.select.result != 'success' || needs.select.outputs.should_run == 'true'
        run: |
          ./scripts/verify-marketing-version.sh resolved 1.1 \
            build/MarketingVersion.xcarchive/Products/Applications/PrintFarmer.app/Info.plist

  test:
    name: Unit Tests (iOS)
    runs-on: macos-latest
    needs: [select, build]
    # Skip ONLY when the selector explicitly said `false`. If `select` itself
    # failed, `should_run` is empty — and a skipped job reports "Success" to
    # branch protection, so a bare `== 'true'` would turn a selector crash into
    # a silent green. Gated on `build` succeeding so a real build failure isn't
    # reported twice.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.select.outputs.should_run != 'false' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve pinned iOS simulator destination
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Test bounded XCTest runner
        run: python3 -m unittest discover -s scripts/tests -p 'test_run_tests.py' -v

      - name: Reset and boot iOS simulator
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl erase "$SIMULATOR_UDID"
          ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Build unit tests for testing
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build-for-testing

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          python3 scripts/run-tests.py --invocation-timeout 840 -- \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test-without-building \
            -only-testing:PrintFarmerTests \
            -resultBundlePath build/TestResults.xcresult \
            2>&1 | tee build/TestResults.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            mobile/build/TestResults.xcresult
            mobile/build/TestResults.log
            mobile/build/TestResults.events.jsonl
            mobile/build/TestResults.timing.json
          retention-days: 7

  xcui-shards:
    name: XCUI (${{ matrix.family }}, shard ${{ matrix.shard }})
    runs-on: macos-latest
    needs: select
    # See the `test` job: skip only on an explicit `false`, never on a
    # selector failure.
    if: ${{ !cancelled() && needs.select.outputs.should_run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: iphone-1
            family: iPhone
            shard: 1
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
            selectors: >-
              -only-testing:PrintFarmerUITests/LoginFlowUITests
              -only-testing:PrintFarmerUITests/AttentionActionsUITests
              -only-testing:PrintFarmerUITests/OperatorShellUITests
              -only-testing:PrintFarmerUITests/TwoModesOperatorShellUITests/testFloorModeShowsRequiredCompactDestinations
          - key: iphone-2
            family: iPhone
            shard: 2
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
            selectors: >-
              -only-testing:PrintFarmerUITests/OperatorFeatureVisibilityUITests
              -only-testing:PrintFarmerUITests/ScanStationUITests
              -only-testing:PrintFarmerUITests/HarvestUITests
          - key: iphone-3
            family: iPhone
            shard: 3
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
            selectors: >-
              -only-testing:PrintFarmerUITests/PartsInventoryUITests
              -only-testing:PrintFarmerUITests/PrinterListUITests
              -only-testing:PrintFarmerUITests/FilamentCoverageUITests
          - key: iphone-4
            family: iPhone
            shard: 4
            prefix: iPhone
            device_preference: iPhone 15,iPhone 16,iPhone 17,iPhone 17 Pro,iPhone 17e
            selectors: >-
              -only-testing:PrintFarmerUITests/ColdOfflineShellUITests
              -only-testing:PrintFarmerUITests/TaskActionRoutingUITests
              -only-testing:PrintFarmerUITests/ShiftTasksUITests
              -only-testing:PrintFarmerUITests/UIWaitBudgetTests
              -only-testing:PrintFarmerUITests/ShiftTasksGroupedUITests
              -only-testing:PrintFarmerUITests/ShiftTasksFailedRefreshUITests
          - key: ipad-1
            family: iPad
            shard: 1
            prefix: iPad
            device_preference: iPad Pro 13-inch (M5),iPad Pro 11-inch (M5),iPad Air 13-inch (M4),iPad Air 11-inch (M4),iPad (A16),iPad mini (A17 Pro)
            selectors: >-
              -only-testing:PrintFarmerUITests/LoginFlowUITests
              -only-testing:PrintFarmerUITests/AttentionActionsUITests
              -only-testing:PrintFarmerUITests/OperatorShellUITests
              -only-testing:PrintFarmerUITests/TwoModesOperatorShellUITests/testFloorModeShowsRequiredCompactDestinations
          - key: ipad-2
            family: iPad
            shard: 2
            prefix: iPad
            device_preference: iPad Pro 13-inch (M5),iPad Pro 11-inch (M5),iPad Air 13-inch (M4),iPad Air 11-inch (M4),iPad (A16),iPad mini (A17 Pro)
            selectors: >-
              -only-testing:PrintFarmerUITests/OperatorFeatureVisibilityUITests
              -only-testing:PrintFarmerUITests/ScanStationUITests
              -only-testing:PrintFarmerUITests/HarvestUITests
          - key: ipad-3
            family: iPad
            shard: 3
            prefix: iPad
            device_preference: iPad Pro 13-inch (M5),iPad Pro 11-inch (M5),iPad Air 13-inch (M4),iPad Air 11-inch (M4),iPad (A16),iPad mini (A17 Pro)
            selectors: >-
              -only-testing:PrintFarmerUITests/PartsInventoryUITests
              -only-testing:PrintFarmerUITests/PrinterListUITests
              -only-testing:PrintFarmerUITests/FilamentCoverageUITests
          - key: ipad-4
            family: iPad
            shard: 4
            prefix: iPad
            device_preference: iPad Pro 13-inch (M5),iPad Pro 11-inch (M5),iPad Air 13-inch (M4),iPad Air 11-inch (M4),iPad (A16),iPad mini (A17 Pro)
            selectors: >-
              -only-testing:PrintFarmerUITests/ColdOfflineShellUITests
              -only-testing:PrintFarmerUITests/TaskActionRoutingUITests
              -only-testing:PrintFarmerUITests/ShiftTasksUITests
              -only-testing:PrintFarmerUITests/UIWaitBudgetTests
              -only-testing:PrintFarmerUITests/ShiftTasksGroupedUITests
              -only-testing:PrintFarmerUITests/JobDetailIPadNavigationUITests
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Test simulator resolver
        if: matrix.key == 'iphone-1'
        run: ../scripts/ci/test-resolve-ios-simulator.sh

      - name: Resolve package dependencies
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages"

      - name: Resolve ${{ matrix.family }} simulator destination
        env:
          IOS_SIMULATOR_DEVICE_FAMILY: ${{ matrix.family }}
          IOS_SIMULATOR_DEVICE_PREFIX: ${{ matrix.prefix }}
          IOS_SIMULATOR_DEVICE_PREFERENCE: ${{ matrix.device_preference }}
        run: ../scripts/ci/resolve-ios-simulator.sh

      - name: Boot ${{ matrix.family }} simulator
        run: ../scripts/ci/boot-ios-simulator.sh "$SIMULATOR_UDID"

      - name: Build XCUI shard for testing
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build-for-testing

      - name: Run login XCUI
        if: matrix.shard == 1
        timeout-minutes: 25
        run: |
          set -o pipefail
          python3 scripts/run-tests.py -- test-without-building \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:PrintFarmerUITests/LoginFlowUITests \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            -resultBundlePath "build-${{ matrix.key }}/Login.xcresult" \
            2>&1 | tee "build-${{ matrix.key }}/Login.log"

      - name: Run XCUI shard
        timeout-minutes: 25
        env:
          SELECTORS: ${{ matrix.selectors }}
        run: |
          set -o pipefail
          read -r -a selectors <<< "$SELECTORS"
          if [[ "${{ matrix.shard }}" == "1" ]]; then
            selectors=("${selectors[@]:1}")
          fi
          python3 scripts/run-tests.py -- test-without-building \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 90 \
            -derivedDataPath "build-${{ matrix.key }}" \
            -clonedSourcePackagesDirPath "build-${{ matrix.key }}/SourcePackages" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            "${selectors[@]}" \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            -resultBundlePath "build-${{ matrix.key }}/XCUIShard.xcresult" \
            2>&1 | tee "build-${{ matrix.key }}/XCUIShard.log"

      - name: Upload XCUI shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcui-${{ matrix.key }}
          path: |
            mobile/build-${{ matrix.key }}/Login.xcresult
            mobile/build-${{ matrix.key }}/Login.log
            mobile/build-${{ matrix.key }}/Login.events.jsonl
            mobile/build-${{ matrix.key }}/Login.timing.json
            mobile/build-${{ matrix.key }}/XCUIShard.xcresult
            mobile/build-${{ matrix.key }}/XCUIShard.log
            mobile/build-${{ matrix.key }}/XCUIShard.events.jsonl
            mobile/build-${{ matrix.key }}/XCUIShard.timing.json
          retention-days: 7
