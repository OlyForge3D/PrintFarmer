name: Bootstrap Ubuntu Agent

on:
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - 'scripts/bootstrap-ubuntu.sh'
      - 'scripts/dotnet-sdk.*'
      - 'global.json'
      - '.github/workflows/bootstrap-ubuntu-ci.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Ensure sudo available
        run: sudo true

      - name: Install approved .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify selected SDK
        run: python3 scripts/dotnet-sdk.py verify

      - name: Run bootstrap script (verify)
        run: |
          chmod +x scripts/bootstrap-ubuntu.sh
          bash ./scripts/bootstrap-ubuntu.sh --verify
        env:
          NODE_VERSION: '24'
