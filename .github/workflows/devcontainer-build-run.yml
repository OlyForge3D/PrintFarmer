name: Devcontainer Build & Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect devcontainer changes
        id: detect_changes
        run: |
          # Fetch previous commit so we can diff (fetch depth 2)
          git fetch --no-tags --prune --depth=2 origin ${{ github.ref }} || true
          # Fallback: if no previous commit, treat as changed
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^.devcontainer/' || true)
            if [ -n "$CHANGED" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR (for cache pull)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            # After building the devcontainer image, run the post-create verification inside the container
            ./.devcontainer/post-create.sh --verify
            # Run dotnet tests (quick subset) if present
            if [ -f "src/farm-web.sln" ]; then
              echo "Running dotnet test (API projects)..."
              pushd src >/dev/null
              dotnet test ./tests -c Debug || echo "dotnet test returned non-zero (continuing)"
              popd >/dev/null
            fi
            # Run frontend tests if present
            if [ -d "src/Web/ReactApp" ]; then
              echo "Running npm test for React app (headless)..."
              pushd src/Web/ReactApp >/dev/null
              npm ci
              # run tests in CI mode if available (fallback to --if-present)
              npm test --silent || echo "npm test returned non-zero (continuing)"
              popd >/dev/null
            fi
            # Save the built devcontainer image to a tar for artifact upload
            echo "Saving devcontainer image to /tmp/printfarmer-devcontainer.tar"
            docker image save printfarmer-devcontainer:latest -o /tmp/printfarmer-devcontainer.tar || true
          imageName: printfarmer-devcontainer
          platform: linux/amd64
          cacheFrom: ghcr.io/${{ github.repository_owner }}/printfarmer-devcontainer:latest
          checkoutPath: .
          # prevent long-running global npm installs inside CI container
          env: |
            SKIP_GLOBAL_NPM=1
            DEVCONTAINER_VERIFY=1

      - name: Upload devcontainer image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devcontainer-image
          path: /tmp/printfarmer-devcontainer.tar

      - name: Log in to GitHub Container Registry
        if: success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || steps.detect_changes.outputs.changed == 'true')
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push devcontainer image to GHCR
        if: success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || steps.detect_changes.outputs.changed == 'true')
        run: |
          set -e
          IMAGE_NAME=printfarmer-devcontainer:latest
          GHCR_NAME=ghcr.io/${{ github.repository_owner }}/printfarmer-devcontainer
          SHA='${{ github.sha }}'
          # Attempt to discover a release tag for this run (if a release exists for the ref)
          TAG=''
          TOKEN='${{ secrets.GITHUB_TOKEN }}'
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG='${{ github.event.release.tag_name }}'
          elif echo "${GITHUB_REF:-}" | grep -q '^refs/tags/'; then
            TAG=${GITHUB_REF#refs/tags/}
          fi

          echo "Tagging $IMAGE_NAME -> $GHCR_NAME:${SHA} and :latest"
          docker tag $IMAGE_NAME $GHCR_NAME:${SHA}
          docker tag $IMAGE_NAME $GHCR_NAME:latest

          # If we have a release tag, also push a semver tag with release notes label
          if [ -n "$TAG" ]; then
            echo "Fetching release notes for tag: $TAG"
            RELEASE_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/tags/$TAG" || true)
            RELEASE_BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""' 2>/dev/null || true)
            RELEASE_BODY_SANITIZED=$(printf "%s" "$RELEASE_BODY" | tr '\n' ' ' | sed 's/"/'"'"'/g' | cut -c1-2000)
            # Rebuild a small image manifest with labels (re-tagging local image by building an empty image that pulls the tar)
            TMP_DOCKERFILE=$(mktemp)
            cat > $TMP_DOCKERFILE <<'EOF'
            FROM scratch
            COPY --from=printfarmer-devcontainer:latest / /
            EOF
            # Note: docker build --label without changing content will still create a new image with labels
            docker build -f $TMP_DOCKERFILE --label "org.opencontainers.image.description=${RELEASE_BODY_SANITIZED}" -t $GHCR_NAME:${TAG} . || true
            rm -f $TMP_DOCKERFILE || true
          fi

          docker push $GHCR_NAME:${SHA}
          docker push $GHCR_NAME:latest
          if [ -n "$TAG" ]; then docker push $GHCR_NAME:${TAG} || true; fi

      - name: Inspect devcontainer image manifests and upload labels
        if: success()
        run: |
          set -e
          GHCR_NAME=ghcr.io/${{ github.repository_owner }}/printfarmer-devcontainer
          SHA='${{ github.sha }}'
          docker manifest inspect ${GHCR_NAME}:${SHA} > manifest-${SHA}.json || true
          jq -r '.[0].annotations // {}' manifest-${SHA}.json > image-labels-devcontainer-${SHA}.json || echo '{}' > image-labels-devcontainer-${SHA}.json
          docker manifest inspect ${GHCR_NAME}:latest > manifest-latest.json || true
          jq -r '.[0].annotations // {}' manifest-latest.json > image-labels-devcontainer-latest.json || echo '{}' > image-labels-devcontainer-latest.json
          if [ -n "$TAG" ]; then
            docker manifest inspect ${GHCR_NAME}:${TAG} > manifest-${TAG}.json || true
            jq -r '.[0].annotations // {}' manifest-${TAG}.json > image-labels-devcontainer-${TAG}.json || echo '{}' > image-labels-devcontainer-${TAG}.json
          fi

      - name: Upload devcontainer image labels artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: devcontainer-image-labels
          path: image-labels-devcontainer-*.json
