name: Soft Freeze Badge Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update badge
        run: |
          chmod +x scripts/update-soft-freeze-badge.sh
          ./scripts/update-soft-freeze-badge.sh || exit_code=$?
          if [ "${exit_code:-0}" != "0" ]; then
            echo "Script failed with $exit_code" >&2
            exit $exit_code
          fi
          if git diff --quiet; then
            echo "No badge change needed"
            exit 0
          fi
          git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update soft freeze badge [skip ci]" || true
          git push origin HEAD:main