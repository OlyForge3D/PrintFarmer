name: Daily development microservice images

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: daily-development-images
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: olyforge3d
  DOCKERFILE: scripts/docker/dockerfiles/Dockerfile.multistage

jobs:
  source:
    name: Select development HEAD
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      image_tag: ${{ steps.source.outputs.image_tag }}
      build_version: ${{ steps.source.outputs.build_version }}
    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: refs/heads/development
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact development commit
        id: source
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/development | awk '{print $1}')"
          if [[ ! "$remote_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve origin/development"
            exit 1
          fi
          if [[ "$commit_sha" != "$remote_sha" ]]; then
            echo "Checked-out commit $commit_sha does not match origin/development $remote_sha"
            exit 1
          fi

          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$commit_sha" >> "$GITHUB_OUTPUT"
          echo "build_version=development-${commit_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Selected development commit: $commit_sha" >> "$GITHUB_STEP_SUMMARY"

  validate-images:
    name: Validate ${{ matrix.image }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            target: api-runtime
          - image: frontend
            target: frontend-runtime
          - image: slicer-host
            target: slicer-host-runtime
          - image: printer-discovery
            target: printer-discovery-runtime
          - image: orcaslicer-worker
            target: orcaslicer-worker
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: printfarmer-${{ matrix.image }}:validation-${{ needs.source.outputs.commit_sha }}
          build-args: |
            BUILD_VERBOSITY=quiet
            GIT_SHA=${{ needs.source.outputs.commit_sha }}
            VITE_GIT_SHA=${{ needs.source.outputs.commit_sha }}
            BUILD_VERSION=${{ needs.source.outputs.build_version }}
            VCS_REF=${{ needs.source.outputs.commit_sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            ALLOW_STUB=0
          cache-from: type=gha,scope=daily-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=daily-${{ matrix.image }}

      - name: Smoke check image contents
        env:
          IMAGE: printfarmer-${{ matrix.image }}:validation-${{ needs.source.outputs.commit_sha }}
          EXPECTED_REVISION: ${{ needs.source.outputs.commit_sha }}
          SERVICE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          revision="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE")"
          if [[ "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "$SERVICE image revision '$revision' does not match '$EXPECTED_REVISION'"
            exit 1
          fi

          case "$SERVICE" in
            frontend)
              docker run --rm "$IMAGE" nginx -t
              ;;
            orcaslicer-worker)
              docker run --rm --entrypoint sh "$IMAGE" -c \
                'test -x /opt/orcaslicer/bin/orca-slicer && test -s /etc/printfarmer/orcaslicer.sha256'
              docker run --rm --entrypoint dotnet "$IMAGE" --info
              ;;
            *)
              docker run --rm --entrypoint dotnet "$IMAGE" --info
              ;;
          esac

  publish-images:
    name: Publish ${{ matrix.image }}
    needs: [source, validate-images]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            target: api-runtime
          - image: frontend
            target: frontend-runtime
          - image: slicer-host
            target: slicer-host-runtime
          - image: printer-discovery
            target: printer-discovery-runtime
          - image: orcaslicer-worker
            target: orcaslicer-worker
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve an existing immutable tag
        id: existing
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-${{ matrix.image }}
          TAG: ${{ needs.source.outputs.image_tag }}
          EXPECTED_REVISION: ${{ needs.source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          reference="$IMAGE:$TAG"
          if ! docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker pull "$reference"
          revision="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$reference")"
          if [[ "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "Existing immutable tag has revision '$revision', expected '$EXPECTED_REVISION'"
            exit 1
          fi

          repo_digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$reference")"
          digest="${repo_digest#*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Existing tag returned invalid digest: $digest"
            exit 1
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable tag
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-${{ matrix.image }}:${{ needs.source.outputs.image_tag }}
          labels: |
            org.opencontainers.image.title=printfarmer-${{ matrix.image }}
            org.opencontainers.image.description=PrintFarmer daily development ${{ matrix.image }} image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.source.outputs.build_version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            BUILD_VERBOSITY=quiet
            GIT_SHA=${{ needs.source.outputs.commit_sha }}
            VITE_GIT_SHA=${{ needs.source.outputs.commit_sha }}
            BUILD_VERSION=${{ needs.source.outputs.build_version }}
            VCS_REF=${{ needs.source.outputs.commit_sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            ALLOW_STUB=0
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=daily-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=daily-${{ matrix.image }}

      - name: Record published digest
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/printfarmer-${{ matrix.image }}
          SERVICE: ${{ matrix.image }}
          TAG: ${{ needs.source.outputs.image_tag }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published digest: $digest"
            exit 1
          fi

          docker buildx imagetools inspect "$IMAGE@$digest" >/dev/null
          mkdir -p daily-image
          jq -n \
            --arg service "$SERVICE" \
            --arg image "$IMAGE" \
            --arg tag "$TAG" \
            --arg digest "$digest" \
            '{service: $service, image: $image, tag: $tag, digest: $digest}' \
            > "daily-image/$SERVICE.json"

      - name: Upload digest record
        uses: actions/upload-artifact@v7
        with:
          name: daily-digest-${{ matrix.image }}
          path: daily-image/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 90

  publish-image-set:
    name: Publish coherent image-set manifest
    needs: [source, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download digest records
        uses: actions/download-artifact@v8
        with:
          pattern: daily-digest-*
          path: artifacts

      - name: Create and validate image-set manifest
        env:
          COMMIT_SHA: ${{ needs.source.outputs.commit_sha }}
          IMAGE_TAG: ${{ needs.source.outputs.image_tag }}
        run: |
          set -euo pipefail
          mapfile -t records < <(find artifacts -type f -name '*.json' | sort)
          if [[ "${#records[@]}" -ne 5 ]]; then
            echo "Expected five image digest records, found ${#records[@]}"
            exit 1
          fi

          mkdir -p daily-image-set
          jq -s \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$COMMIT_SHA" \
            --arg tag "$IMAGE_TAG" \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              schemaVersion: 1,
              repository: $repository,
              branch: "development",
              commit: $commit,
              tag: $tag,
              generatedAt: $generated_at,
              workflowRun: $workflow_run,
              images: (map({
                key: .service,
                value: {
                  name: .image,
                  tag: .tag,
                  digest: .digest,
                  reference: (.image + "@" + .digest)
                }
              }) | from_entries)
            }' "${records[@]}" > daily-image-set/image-set.json

          jq -e \
            --arg commit "$COMMIT_SHA" \
            --arg tag "$IMAGE_TAG" \
            '.schemaVersion == 1
              and .branch == "development"
              and .commit == $commit
              and .tag == $tag
              and (.images | length) == 5
              and ([.images[].tag] | all(. == $tag))
              and ([.images[].digest] | all(test("^sha256:[0-9a-f]{64}$")))' \
            daily-image-set/image-set.json >/dev/null

          printf '%s\n' "$COMMIT_SHA" > daily-image-set/commit-sha.txt

      - name: Upload coherent image set
        uses: actions/upload-artifact@v7
        with:
          name: daily-development-image-set
          path: daily-image-set/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize immutable image set
        run: |
          {
            echo "## Daily development image set"
            echo
            echo "- Commit: \`${{ needs.source.outputs.commit_sha }}\`"
            echo "- Tag: \`${{ needs.source.outputs.image_tag }}\`"
            echo "- Artifact: \`daily-development-image-set\`"
            echo
            echo "The artifact contains digest-pinned references for all five application images."
          } >> "$GITHUB_STEP_SUMMARY"
