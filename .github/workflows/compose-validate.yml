name: Compose generation & validation

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - master

jobs:
  validate-compose:
    name: Validate generated docker-compose (matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: microservices
            architecture: microservices
            flags: ""
          - name: microservices-monitoring
            architecture: microservices
            flags: "--include-monitoring"
          - name: microservices-monitoring-telemetry
            architecture: microservices
            flags: "--include-monitoring --include-telemetry"
          - name: microservices-all
            architecture: microservices
            flags: "--include-monitoring --include-telemetry --include-security --include-registry"
          - name: monolithic
            architecture: monolithic
            flags: ""
          - name: monolithic-all
            architecture: monolithic
            flags: "--include-monitoring --include-telemetry --include-security --include-registry"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure scripts are executable
        run: |
          chmod +x ./scripts/docker/compose-generator.sh || true
          chmod +x ./scripts/docker/compose-dedupe.sh || true
          chmod +x ./scripts/docker/compose-dedupe.py || true

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruamel.yaml

      - name: Provide default registry host env
        run: echo "REGISTRY_HOST=local.registry:5000" >> $GITHUB_ENV

      - name: Provide throwaway JWT signing key for validation
        # docker-compose.yml requires Jwt__Key (${Jwt__Key:?...}) so it fails closed instead of
        # booting with a shipped placeholder. CI only renders/validates the template here — it
        # never runs the API — so a freshly generated, per-run 32+ byte value is sufficient. It is
        # generated at runtime (never committed) and is discarded when the job finishes.
        run: echo "Jwt__Key=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Provide throwaway admin credentials for optional overlays
        # The pgAdmin, monitoring (Grafana), and security (Vault) overlays require an explicit
        # credential (${VAR:?...}) so they fail closed instead of booting with a shipped default
        # (issue #1295). CI only renders/validates the template here — it never runs the
        # containers — so freshly generated, per-run throwaway values are sufficient. They are
        # generated at runtime (never committed) and are discarded when the job finishes.
        run: |
          echo "AUTO_ADMIN_PASSWORD=$(openssl rand -base64 24)" >> $GITHUB_ENV
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 24)" >> $GITHUB_ENV
          echo "VAULT_DEV_ROOT_TOKEN=$(openssl rand -base64 24)" >> $GITHUB_ENV

      - name: Show Docker Compose version
        run: docker compose version

      - name: Generate docker-compose.yml
        id: gen
        run: |
          set -euo pipefail
          OUT_DIR=$(mktemp -d)
          echo "OUT_DIR=$OUT_DIR"
          ./scripts/docker/compose-generator.sh --architecture ${{ matrix.architecture }} --enable-orca-worker yes --output-dir "$OUT_DIR" ${{ matrix.flags }}
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV

      - name: Validate generated compose
        run: |
          set -euo pipefail
          echo "Validating: $OUT_DIR/docker-compose.yml"
          # --quiet suppresses the fully-interpolated compose output (which would
          # otherwise print the throwaway admin credentials into CI logs) while still
          # performing full interpolation/validation and failing on error.
          docker compose -f "$OUT_DIR/docker-compose.yml" config --quiet

      - name: Dump generator logs (on failure)
        if: failure()
        run: |
          echo "=== Generator log ==="
          if [[ -f "$OUT_DIR/generator.log" ]]; then
            sed -n '1,400p' "$OUT_DIR/generator.log" || true
          fi
          echo "=== Compose error output ==="
          sed -n '1,400p' "$OUT_DIR/compose.err" || true
