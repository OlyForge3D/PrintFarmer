name: SLSA Provenance

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_run:
    workflows: [ "Containers" ]
    types: [ "completed" ]

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          path: digests
      - name: Show digest files
        if: github.event_name == 'workflow_run'
        run: ls -R digests || true
      - name: Resolve API digest
        id: api_digest
        run: |
          if [ -f digests/digest-api/digest-api.txt ]; then
            echo "value=$(cat digests/digest-api/digest-api.txt)" >> $GITHUB_OUTPUT
          else
            echo "value=sha256:placeholder" >> $GITHUB_OUTPUT
          fi
      - name: Resolve Frontend digest
        id: fe_digest
        run: |
          if [ -f digests/digest-frontend/digest-frontend.txt ]; then
            echo "value=$(cat digests/digest-frontend/digest-frontend.txt)" >> $GITHUB_OUTPUT
          else
            echo "value=sha256:placeholder" >> $GITHUB_OUTPUT
          fi

    - name: Generate provenance (API image)
        uses: slsa-framework/slsa-github-generator/actions/docker@v2
        with:
          image: ghcr.io/${{ github.repository_owner }}/printfarmer-api
      digest: ${{ steps.api_digest.outputs.value }}
        continue-on-error: true

    - name: Generate provenance (Frontend image)
        uses: slsa-framework/slsa-github-generator/actions/docker@v2
        with:
          image: ghcr.io/${{ github.repository_owner }}/printfarmer-frontend
      digest: ${{ steps.fe_digest.outputs.value }}
        continue-on-error: true

      - name: Summary
        run: |
          echo "SLSA provenance generated:" >> $GITHUB_STEP_SUMMARY
          echo "API digest: ${{ steps.api_digest.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend digest: ${{ steps.fe_digest.outputs.value }}" >> $GITHUB_STEP_SUMMARY
