name: Devcontainer Provision

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET (for post-create scripts that invoke dotnet)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Make post-create executable
        run: chmod +x .devcontainer/post-create.sh

      - name: Create .env.template if missing
        run: |
          # Create a minimal .env.template if it doesn't exist (required by post-create.sh)
          if [ ! -f ".env.template" ]; then
            echo "# PrintFarmer Environment Template" > .env.template
            echo "# Created automatically for CI" >> .env.template
          fi

      - name: Run devcontainer post-create verification
        run: |
          # Run provisioning script with verification to catch provisioning regressions
          ./.devcontainer/post-create.sh --verify
        env:
          # prevent heavy global npm installs inside CI if they are unnecessary
          SKIP_GLOBAL_NPM: '1'
          # Avoid apt operations if the runner doesn't need them
          SKIP_APT: '0'
          DEVCONTAINER_VERIFY: '1'
