# =============================================================================
# TestFlight Beta Build — CI/CD Pipeline
# =============================================================================
#
# REQUIRED GITHUB SECRETS:
#
#   MATCH_PASSWORD
#     The passphrase used when running `fastlane match init` to encrypt/decrypt
#     certificates in the match git repo.
#
#   MATCH_GIT_URL
#     URL of the private certificates repo.
#     Value: https://github.com/OlyForge3D/PrintFarmerApp-certificates.git
#
#   MATCH_GIT_BASIC_AUTHORIZATION
#     Base64-encoded "username:token" for git access to the certificates repo.
#     Generate with: echo -n "username:ghp_your_token" | base64
#
#   APP_STORE_CONNECT_API_KEY_ID
#     Key ID from App Store Connect > Users and Access > Integrations > Keys.
#
#   APP_STORE_CONNECT_API_ISSUER_ID
#     Issuer ID from App Store Connect > Users and Access > Integrations > Keys.
#
#   APP_STORE_CONNECT_API_KEY_CONTENT
#     The .p8 private key file content (raw PEM or base64-encoded).
#
# OPTIONAL:
#   SLACK_WEBHOOK_URL — Slack incoming webhook for build notifications.
#
# =============================================================================

name: TestFlight Beta Build

on:
  push:
    tags:
      - 'v*-alpha*'
      - 'v*-beta*'
      - 'v*-rc*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Beta environment'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - external

concurrency:
  group: testflight-beta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and build metadata
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VERSION="$(tr -d '[:space:]' < ../VERSION)"
            VERSION="${RAW_VERSION#v}"
            TAG_NAME="manual-${VERSION}"
          else
            TAG_NAME="${{ github.ref_name }}"
            if [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)(-(beta|rc)\.[0-9]+)?$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              echo "Unsupported tag format: $TAG_NAME" >&2
              echo "Expected vX.Y.Z-beta.N, vX.Y.Z-rc.N, or vX.Y.Z" >&2
              exit 1
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid marketing version resolved: $VERSION" >&2
            exit 1
          fi

          BUILD_NUMBER=$((${{ github.run_number }} + 400))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION | Build: $BUILD_NUMBER | Tag: $TAG_NAME"

      - name: Select Xcode version
        run: |
          # Prefer Xcode 26+ (iOS 26 SDK required by App Store after April 2026)
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install fastlane
        run: |
          sudo gem install fastlane -NV

      - name: Setup Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CI_KEYCHAIN_PWD="ci-keychain-temp-password"
          echo "Setting up keychain at: $KEYCHAIN_PATH"

          # Create temporary keychain (ephemeral — destroyed in cleanup step)
          security create-keychain -p "$CI_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Set keychain settings (timeout 6 hours, no lock on sleep)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Unlock keychain
          security unlock-keychain -p "$CI_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Set as default keychain
          security default-keychain -s "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "✅ Keychain setup complete"

      - name: Setup code signing with fastlane match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # Configure git to use token-based authentication
          # MATCH_GIT_TOKEN is the plain PAT token (not base64 encoded)
          git config --global url."https://git:${MATCH_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          fastlane match appstore \
            --readonly \
            --git_url "$MATCH_GIT_URL" \
            --app_identifier "com.olyforge3d.printfarmer.ios" \
            --keychain_name "$KEYCHAIN_PATH" \
            --keychain_password "$MATCH_PASSWORD"

      - name: Extract provisioning profile name
        id: profile
        run: |
          PROFILE_PATH=$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          echo "Profile path: $PROFILE_PATH"
          TMP_PLIST=$(mktemp).plist
          security cms -D -i "$PROFILE_PATH" > "$TMP_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST")
          echo "Profile name: $PROFILE_NAME"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Allow codesign keychain access
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CI_KEYCHAIN_PWD="ci-keychain-temp-password"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CI_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

      - name: Update build version numbers
        run: |
          agvtool new-version -all ${{ steps.version.outputs.build_number }}
          agvtool new-marketing-version ${{ steps.version.outputs.version }}

      - name: Resolve package dependencies
        run: |
          xcodebuild -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build for App Store
        timeout-minutes: 30
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          xcodebuild \
            -project PrintFarmer.xcodeproj \
            -scheme PrintFarmer \
            -configuration Release \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -archivePath "build/PrintFarmer.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.name }}" \
            DEVELOPMENT_TEAM=ZPKA84F3TY \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          # Patch ExportOptions.plist with actual profile name from match
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.olyforge3d.printfarmer.ios '${{ steps.profile.outputs.name }}'" ExportOptions.plist
          xcodebuild \
            -exportArchive \
            -archivePath "build/PrintFarmer.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "build/IPA" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
        run: |
          API_KEY_JSON=$RUNNER_TEMP/api_key.json

          # Build API key JSON — accepts raw .p8 content or base64-encoded
          export API_KEY_JSON_PATH="$API_KEY_JSON"
          python3 -c "
          import json, os, base64
          content = os.environ['APP_STORE_CONNECT_API_KEY_CONTENT']
          # Auto-detect: if it starts with '-----BEGIN' it's raw PEM, otherwise base64
          if not content.strip().startswith('-----BEGIN'):
              content = base64.b64decode(content).decode('utf-8')
          data = {
              'key_id': os.environ['APP_STORE_CONNECT_API_KEY_ID'],
              'issuer_id': os.environ['APP_STORE_CONNECT_API_ISSUER_ID'],
              'key': content,
              'in_house': False
          }
          with open(os.environ['API_KEY_JSON_PATH'], 'w') as f:
              json.dump(data, f, indent=2)
          print('API key JSON created successfully')
          "

          PILOT_ARGS=(
            --ipa "build/IPA/PrintFarmer.ipa"
            --api_key_path "$API_KEY_JSON"
            --changelog "Beta build from tag: ${{ steps.version.outputs.tag_name }}"
          )

          if [ -n "${TESTFLIGHT_EXTERNAL_GROUPS:-}" ]; then
            echo "Distributing to external TestFlight groups: $TESTFLIGHT_EXTERNAL_GROUPS"
            PILOT_ARGS+=(--distribute_external true --groups "$TESTFLIGHT_EXTERNAL_GROUPS")
          else
            echo "No TESTFLIGHT_EXTERNAL_GROUPS secret set; uploading build without external distribution."
          fi

          fastlane pilot upload "${PILOT_ARGS[@]}"

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ TestFlight Beta Build Uploaded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*TestFlight Beta Uploaded*\n*Version:* ${{ steps.version.outputs.version }}\n*Build:* ${{ steps.version.outputs.build_number }}\n*Tag:* ${{ steps.version.outputs.tag_name }}\n*Repo:* <https://github.com/OlyForge3D/PrintFarmer|OlyForge3D/PrintFarmer>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "PrintFarmer iOS ${{ steps.version.outputs.version }}"
          body: |
            ## iOS Beta Release: ${{ steps.version.outputs.version }}
            - Build Number: ${{ steps.version.outputs.build_number }}
            - Status: ✅ Uploaded to TestFlight
            - Access: Check TestFlight app or email invite

            **Release Notes:** Coming from commit history
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          API_KEY_JSON=$RUNNER_TEMP/api_key.json
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$API_KEY_JSON" || true
