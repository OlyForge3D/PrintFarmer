name: OrcaSlicer Base Image

# Builds a base image with Ubuntu + extracted OrcaSlicer binaries
# This image is cached and only rebuilt when version changes
# The orcaslicer-worker builds on top of this base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orcaslicer-base-image.yml'
  workflow_dispatch:
    inputs:
      orca_version:
        description: 'OrcaSlicer version to build'
        required: false
        default: '2.4.2'
      force_rebuild:
        description: 'Force rebuild even if image exists'
        required: false
        default: 'false'
  # Trigger from other workflows
  workflow_call:
    inputs:
      orca_version:
        type: string
        default: '2.4.2'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  BASE_IMAGE_NAME: orcaslicer-base
  ORCA_VERSION: ${{ inputs.orca_version || '2.4.2' }}
  ORCA_SHA256: d12fb8c8eac1aecd2dfb6377acd48f994f8fa439ed5292fa532dd82880f029fd

jobs:
  build-base:
    name: Build OrcaSlicer Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if image already exists
        id: check
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BASE_IMAGE_NAME }}:${{ env.ORCA_VERSION }}"
          echo "Checking for existing image: $IMAGE"

          if [ "$ORCA_VERSION" != "2.4.2" ]; then
            echo "::error::No pinned AppImage checksum is configured for OrcaSlicer v${ORCA_VERSION}"
            exit 1
          fi
          
          # Force rebuild if workflow file changed (detected by checking if this is a push to workflow path)
          # This handles the case where we need to fix the image build process
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push event detected - forcing rebuild to apply workflow changes"
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if ! docker pull "$IMAGE" > /dev/null 2>&1; then
            echo "Image does not exist, will build"
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          ACTUAL_VERSION=$(docker image inspect --format '{{ index .Config.Labels "orcaslicer.version" }}' "$IMAGE")
          ACTUAL_SHA256=$(docker image inspect --format '{{ index .Config.Labels "orcaslicer.sha256" }}' "$IMAGE")
          EMBEDDED_VERSION=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/orcaslicer/orcaslicer.version' 2>/dev/null || true)
          EMBEDDED_SHA256=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/orcaslicer/orcaslicer.sha256' 2>/dev/null || true)
          if [ "$ACTUAL_VERSION" = "$ORCA_VERSION" ] &&
             [ "$ACTUAL_SHA256" = "$ORCA_SHA256" ] &&
             [ "$EMBEDDED_VERSION" = "$ORCA_VERSION" ] &&
             [ "$EMBEDDED_SHA256" = "$ORCA_SHA256" ]; then
            echo "Image metadata matches the requested OrcaSlicer release"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Rejecting cached image with label version='${ACTUAL_VERSION}' sha256='${ACTUAL_SHA256}' and embedded version='${EMBEDDED_VERSION}' sha256='${EMBEDDED_SHA256}'"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and extract OrcaSlicer AppImage
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        id: extract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ env.ORCA_VERSION }}"
          echo "Downloading OrcaSlicer v${VERSION}..."
          ASSET_NAME="OrcaSlicer_Linux_AppImage_Ubuntu2404_V${VERSION}.AppImage"
          
          # Get download URL from GitHub API
          DOWNLOAD_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/tags/v${VERSION}" | \
            jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .browser_download_url' | head -n1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Could not find Linux AppImage for v${VERSION}"
            exit 1
          fi
          
          echo "Download URL: $DOWNLOAD_URL"
          
          # Download AppImage
          mkdir -p orcaslicer-extract
          curl -fSL -o orcaslicer.AppImage "$DOWNLOAD_URL"
          echo "${ORCA_SHA256}  orcaslicer.AppImage" | sha256sum --check --strict -
          chmod +x orcaslicer.AppImage
          
          # Extract AppImage (works on GitHub runners - they have FUSE or we use --appimage-extract)
          echo "Extracting AppImage..."
          ./orcaslicer.AppImage --appimage-extract
          
          # Move to expected location
          mv squashfs-root orcaslicer-extract/orcaslicer
          printf '%s\n' "$VERSION" > orcaslicer-extract/orcaslicer/orcaslicer.version
          printf '%s\n' "$ORCA_SHA256" > orcaslicer-extract/orcaslicer/orcaslicer.sha256
          
          # CRITICAL: The repo's .dockerignore excludes **/bin/ which would prevent
          # the OrcaSlicer bin/ directory from being copied. We rename it to work around this.
          # The Dockerfile will use "binaries/" instead of "bin/"
          if [ -d "orcaslicer-extract/orcaslicer/bin" ]; then
            echo "Renaming bin/ to binaries/ to avoid .dockerignore exclusion"
            mv orcaslicer-extract/orcaslicer/bin orcaslicer-extract/orcaslicer/binaries
          fi
          
          # Verify extraction
          echo "Extracted contents:"
          ls -la orcaslicer-extract/orcaslicer/ | head -20
          echo "binaries/ contents:"
          ls -la orcaslicer-extract/orcaslicer/binaries/ 2>/dev/null | head -10 || echo "No binaries/ directory"
          
          # Check for binary in possible locations (check binaries/ first since we renamed bin/)
          BINARY_FOUND=false
          for BINARY_PATH in \
            "orcaslicer-extract/orcaslicer/binaries/orca-slicer" \
            "orcaslicer-extract/orcaslicer/binaries/OrcaSlicer" \
            "orcaslicer-extract/orcaslicer/bin/orca-slicer" \
            "orcaslicer-extract/orcaslicer/bin/OrcaSlicer" \
            "orcaslicer-extract/orcaslicer/orca-slicer" \
            "orcaslicer-extract/orcaslicer/OrcaSlicer"; do
            if [ -f "$BINARY_PATH" ]; then
              echo "✓ Found binary at: $BINARY_PATH"
              BINARY_FOUND=true
              break
            fi
          done
          
          if [ "$BINARY_FOUND" = false ]; then
            echo "ERROR: orca-slicer binary not found in any expected location!"
            echo "Searching for any slicer-related files:"
            find orcaslicer-extract -type f -name "*slicer*" -o -name "*Slicer*" 2>/dev/null | head -20
            exit 1
          fi
          
          echo "✓ AppImage extracted successfully"

      - name: Create Dockerfile for base image
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        run: |
          cat > Dockerfile.orca-base << 'EOF'
          FROM ubuntu:24.04

          ARG ORCA_VERSION
          ARG ORCA_SHA256
          
          # Install runtime dependencies for OrcaSlicer
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  # Core libraries
                  libgl1 libglu1-mesa libglx-mesa0 libegl1 \
                  libxkbcommon0 libxkbcommon-x11-0 \
                  # X11/Wayland
                  libx11-6 libxcb1 libxext6 libxrender1 libxi6 \
                  libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                  libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
                  # Qt dependencies  
                  libfontconfig1 libfreetype6 libharfbuzz0b \
                  libdbus-1-3 libglib2.0-0 \
                  # Networking/SSL
                  ca-certificates libssl3 libcurl4 \
                  # Other
                  libpng16-16 libjpeg-turbo8 libtiff6 libwebp7 \
              && rm -rf /var/lib/apt/lists/*
          
          # Copy extracted OrcaSlicer (binaries/ was renamed from bin/ to avoid .dockerignore)
          COPY orcaslicer-extract/orcaslicer /opt/orcaslicer
          
          # Rename binaries/ back to bin/ inside container for compatibility
          RUN if [ -d /opt/orcaslicer/binaries ]; then \
                mv /opt/orcaslicer/binaries /opt/orcaslicer/bin; \
              fi
          
          # Make binaries executable (check bin/ subdir first, then root)
          RUN chmod +x /opt/orcaslicer/bin/orca-slicer 2>/dev/null || \
              chmod +x /opt/orcaslicer/bin/OrcaSlicer 2>/dev/null || \
              chmod +x /opt/orcaslicer/orca-slicer 2>/dev/null || \
              chmod +x /opt/orcaslicer/OrcaSlicer 2>/dev/null || \
              chmod +x /opt/orcaslicer/AppRun 2>/dev/null || true
          
          # Create symlink for consistent access (check bin/ subdir first)
          RUN ln -sf /opt/orcaslicer/bin/orca-slicer /usr/local/bin/orca-slicer 2>/dev/null || \
              ln -sf /opt/orcaslicer/bin/OrcaSlicer /usr/local/bin/orca-slicer 2>/dev/null || \
              ln -sf /opt/orcaslicer/orca-slicer /usr/local/bin/orca-slicer 2>/dev/null || \
              ln -sf /opt/orcaslicer/OrcaSlicer /usr/local/bin/orca-slicer 2>/dev/null || \
              ln -sf /opt/orcaslicer/AppRun /usr/local/bin/orca-slicer 2>/dev/null

          # Preserve AppRun's relative libexec/resource lookup for worker runtime.
          RUN test -x /opt/orcaslicer/AppRun && \
              ln -sf /opt/orcaslicer/AppRun /usr/local/bin/orcaslicer
          
          # Set library path (include bin/ and usr/lib)
          ENV LD_LIBRARY_PATH=/opt/orcaslicer/bin:/opt/orcaslicer/usr/lib:/opt/orcaslicer/lib:/opt/orcaslicer
          ENV PATH=/opt/orcaslicer/bin:/opt/orcaslicer:$PATH
          
          # Verify binary exists and show structure
          RUN echo "=== OrcaSlicer directory structure ===" && \
              ls -la /opt/orcaslicer/ && \
              echo "=== bin/ contents ===" && \
              ls -la /opt/orcaslicer/bin/ 2>/dev/null || echo "No bin/ directory" && \
              echo "=== Binary check ===" && \
              /usr/local/bin/orcaslicer --help 2>&1 | head -5 || echo "Binary check complete"
          
          LABEL org.opencontainers.image.description="OrcaSlicer base image with extracted binaries"
          LABEL org.opencontainers.image.source="https://github.com/OrcaSlicer/OrcaSlicer"
          LABEL orcaslicer.version="${ORCA_VERSION}"
          LABEL orcaslicer.sha256="${ORCA_SHA256}"
          LABEL orcaslicer.allow_stub="false"
          EOF

      - name: Extract metadata
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BASE_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ORCA_VERSION }}
            type=sha,prefix=sha-

      - name: Build and push base image
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.orca-base
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            ORCA_VERSION=${{ env.ORCA_VERSION }}
            ORCA_SHA256=${{ env.ORCA_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image metadata
        if: steps.check.outputs.exists != 'true' || inputs.force_rebuild == 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BASE_IMAGE_NAME }}:${{ env.ORCA_VERSION }}"
          docker pull "$IMAGE"
          ACTUAL_VERSION=$(docker image inspect --format '{{ index .Config.Labels "orcaslicer.version" }}' "$IMAGE")
          ACTUAL_SHA256=$(docker image inspect --format '{{ index .Config.Labels "orcaslicer.sha256" }}' "$IMAGE")
          EMBEDDED_VERSION=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/orcaslicer/orcaslicer.version')
          EMBEDDED_SHA256=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/orcaslicer/orcaslicer.sha256')
          test "$ACTUAL_VERSION" = "$ORCA_VERSION"
          test "$ACTUAL_SHA256" = "$ORCA_SHA256"
          test "$EMBEDDED_VERSION" = "$ORCA_VERSION"
          test "$EMBEDDED_SHA256" = "$ORCA_SHA256"

      - name: Summary
        run: |
          echo "## OrcaSlicer Base Image" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ env.ORCA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA-256: ${{ env.ORCA_SHA256 }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BASE_IMAGE_NAME }}:${{ env.ORCA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.exists }}" = "true" ] && [ "${{ inputs.force_rebuild }}" != "true" ]; then
            echo "- Status: **Skipped** (image already exists)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: **Built and pushed**" >> $GITHUB_STEP_SUMMARY
          fi
