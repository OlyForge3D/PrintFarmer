name: Auto Merge Dependencies

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    # Ensure this job only evaluates on pull_request events to avoid referencing absent fields during workflow_run events
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (startsWith(github.event.pull_request.head.ref, 'dependabot/') ||
       (github.actor == 'dependabot[bot]' || github.actor == 'dependabot'))
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch & minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

      - name: Comment when major update requires manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ⚠️ Major dependency update detected. This PR will not be auto-merged.
            Please review breaking changes and merge manually once validated.

  # Removed unused 'keep-deps-fresh' scheduled job (handled by dependency-maintenance workflow and dependabot schedule)
