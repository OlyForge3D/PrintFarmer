name: Host-update CLI package

# Issue #2997: packages Farm.HostUpdate.Cli exactly as the release does
# (scripts/package-host-update-cli.sh) and smoke-tests every supported archive
# on its own OS/architecture with no .NET SDK or runtime on the host path.
# This workflow never signs, publishes, or authorizes rollout; release signing
# happens only in consolidated-release.yml.

on:
  pull_request:
    paths:
      - 'src/tools/Farm.HostUpdate.Cli/**'
      - 'src/tests/Farm.HostUpdate.Cli.Tests/**'
      - 'src/infra/Services/HostUpdates/**'
      - 'scripts/package-host-update-cli.sh'
      - 'scripts/printfarmer-host-update.sh'
      - 'scripts/printfarmer-host-update.ps1'
      - 'scripts/common-utils.sh'
      - 'tests/test-host-update-cli-package.sh'
      - 'tests/test-host-update-cli-package.ps1'
      - '.github/workflows/host-update-cli-package.yml'
  push:
    branches:
      - development
      - main
    paths:
      - 'src/tools/Farm.HostUpdate.Cli/**'
      - 'src/tests/Farm.HostUpdate.Cli.Tests/**'
      - 'src/infra/Services/HostUpdates/**'
      - 'scripts/package-host-update-cli.sh'
      - 'scripts/printfarmer-host-update.sh'
      - 'scripts/printfarmer-host-update.ps1'
      - 'scripts/common-utils.sh'
      - 'tests/test-host-update-cli-package.sh'
      - 'tests/test-host-update-cli-package.ps1'
      - '.github/workflows/host-update-cli-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-update-cli-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test and package host-update CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          dotnet-version: '10.0.x'

      # The general .NET selector does not run these tests for src/tools or
      # host-update infrastructure changes (see scripts/ci/dotnet-test-manifest.json).
      - name: Run host-update CLI tests
        working-directory: src
        run: >-
          dotnet test ./tests/Farm.HostUpdate.Cli.Tests/Farm.HostUpdate.Cli.Tests.csproj
          -c Release --nologo

      - name: Resolve package identity
        id: identity
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          base="${base#v}"
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "tag=v$base" >> "$GITHUB_OUTPUT"

      - name: Package every supported RID
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/package-host-update-cli.sh --output "$RUNNER_TEMP/host-update-cli" \
            --version "$PACKAGE_VERSION" --channel stable --source-commit "$(git rev-parse HEAD)"
          ls -l "$RUNNER_TEMP/host-update-cli"

      - name: Upload unsigned CI packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: host-update-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/host-update-cli/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.rid }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          sparse-checkout: tests

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: host-update-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/host-update-cli

      - name: Smoke package with the Bash wrapper
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TAG: ${{ needs.package.outputs.tag }}
          PACKAGE_RID: ${{ matrix.rid }}
        run: bash tests/test-host-update-cli-package.sh --assets "$RUNNER_TEMP/host-update-cli" --tag "$PACKAGE_TAG" --rid "$PACKAGE_RID"

      - name: Smoke package with the PowerShell wrapper
        shell: pwsh
        env:
          PACKAGE_TAG: ${{ needs.package.outputs.tag }}
          PACKAGE_RID: ${{ matrix.rid }}
        run: ./tests/test-host-update-cli-package.ps1 -Assets (Join-Path $env:RUNNER_TEMP 'host-update-cli') -Tag $env:PACKAGE_TAG -Rid $env:PACKAGE_RID
