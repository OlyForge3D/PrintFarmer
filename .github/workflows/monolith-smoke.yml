name: Monolith smoke (wire-contract corpus)

# =============================================================================
# Monolith browser/API smoke journeys (issue #2286, epic #2237).
#
# A NEW, standalone workflow — deliberately not a change to ci.yml, per the
# epic's file-ownership matrix (#2286 non-goals: "do NOT edit ci.yml"). This
# is not a deployment-script regression suite either, so it is not folded
# into deployment-tests.yml: that workflow's jobs exercise
# scripts/deploy-docker.sh and generated Docker/nginx config on ubuntu-latest
# with Docker Compose, whereas this job boots the real .NET API and React
# app directly (no containers) and drives them with a browser.
#
# Scope (bounded, per #2286's acceptance criteria — NOT the whole Playwright
# estate under src/Web/ReactApp/e2e/, and NOT tests/ui-validation/):
#   1. Start the API on :5245 (isolated, seeded SQLite DB) and the React app
#      on :3000 (Playwright's own `webServer` in playwright.config.ts starts
#      the Vite dev server; see src/Web/ReactApp/e2e/monolith-smoke/).
#   2. Run a small set of authenticated browser journeys covering one
#      admin/settings surface (Admin Control Center overview) and one
#      printer/queue/task surface (Print Queue timeline + direct Tasks API).
#   3. Assert intercepted response payloads against
#      fixtures/wire-contracts/api/** via src/Web/ReactApp/src/test/
#      wireContractShape.ts (built on the existing wireContracts.ts loader),
#      not just rendered text.
#   4. Prove the assertion is non-vacuous with a mutation control
#      (corpus-mutation-control-smoke.spec.ts renames a key in a cloned,
#      in-memory fixture and shows the journey itself fail).
#
# fixtures/wire-contracts/** is a read-only corpus owned by #2238 — this
# workflow only reads it, and never writes to it.
# =============================================================================

on:
  pull_request:
    paths:
      - 'src/Web/ReactApp/e2e/monolith-smoke/**'
      - 'src/Web/ReactApp/src/test/wireContract*.ts'
      - 'src/Web/ReactApp/playwright.config.ts'
      - 'src/Web/ReactApp/package.json'
      - 'src/Web/ReactApp/package-lock.json'
      - 'fixtures/wire-contracts/**'
      - 'src/api/**'
      - 'src/infra/**'
      - '.github/workflows/monolith-smoke.yml'
  push:
    branches:
      - development
      - main
    paths:
      - 'src/Web/ReactApp/e2e/monolith-smoke/**'
      - 'src/Web/ReactApp/src/test/wireContract*.ts'
      - 'fixtures/wire-contracts/**'
      - '.github/workflows/monolith-smoke.yml'
  workflow_dispatch:

concurrency:
  group: monolith-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monolith-smoke:
    name: Monolith browser/API smoke journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The isolated dev SQLite DB this job seeds is created fresh in
      # ${{ runner.temp }} on every run — never a checked-out or shared path.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5245
      DB_PROVIDER: sqlite
      NetworkDiscovery__EnableDiscovery: "false"
      # Required for the API host to start at all: SlicerApiKeyStartupValidationService
      # throws an unhandled startup exception without a configured shared key.
      # This value has no meaning outside this ephemeral CI run.
      WorkerAuth__SharedKey: monolith-smoke-ci-worker-key
      API_BASE_URL: http://localhost:5245
      BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: src/Web/ReactApp/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify selected SDK
        run: python3 scripts/dotnet-sdk.py verify

      - name: Restore .NET
        working-directory: src
        run: dotnet restore ./farm-web.sln

      - name: Build monolith API
        working-directory: src
        run: dotnet build ./api/Farm.Web.Api.csproj -c Debug --no-restore

      - name: Install frontend deps
        working-directory: src/Web/ReactApp
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: src/Web/ReactApp
        run: npx playwright install --with-deps chromium

      - name: Generate isolated bootstrap proof
        shell: bash
        run: |
          bootstrap_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$bootstrap_secret"
          echo "PFARM__Setup__BootstrapSecret=$bootstrap_secret" >> "$GITHUB_ENV"

      - name: Start monolith API (seeded, isolated SQLite DB)
        working-directory: src
        env:
          ConnectionStrings__Default: Data Source=${{ runner.temp }}/monolith-smoke.db
        run: |
          # setsid detaches into its own process group so the whole tree
          # (dotnet run's launcher + the actual Farm.Web.Api child process
          # it forks) can be killed together via that group id, rather than
          # `kill`ing only the launcher PID and leaving the API child alive.
          # --no-build: the previous step already built the API; starting
          # from a prebuilt DLL keeps the health-check wait bounded by host
          # startup + DB seeding time only, not a cold build too.
          setsid nohup dotnet run --project ./api/Farm.Web.Api.csproj --no-launch-profile --no-build \
            > ${{ runner.temp }}/monolith-smoke-api.log 2>&1 &
          echo "$!" > ${{ runner.temp }}/monolith-smoke-api.pid

      - name: Wait for API health check
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent --output /dev/null "http://localhost:5245/healthz"; then
              echo "API is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy within the timeout." >&2
          cat "${{ runner.temp }}/monolith-smoke-api.log" || true
          exit 1

      - name: Run monolith smoke journeys
        working-directory: src/Web/ReactApp
        run: npm run test:e2e:monolith-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monolith-smoke-playwright-report
          path: src/Web/ReactApp/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monolith-smoke-api-log
          path: ${{ runner.temp }}/monolith-smoke-api.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop monolith API
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/monolith-smoke-api.pid" ]; then
            pid="$(cat "${{ runner.temp }}/monolith-smoke-api.pid")"
            # Negative PID targets the whole process group setsid created,
            # so the dotnet launcher and its Farm.Web.Api child both stop.
            kill -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
          fi

  provider-inference:
    name: Hosted failure-detection provider inference
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/copilot/provider-inference-3681'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The generated Compose file includes the monitoring overlay, which
      # requires this value during parsing even though the probe never starts Grafana.
      GRAFANA_ADMIN_PASSWORD: provider-probe-unused
      OBICO_ML_IMAGE: ghcr.io/thespaghettidetective/obico-ml-api-cpu@sha256:e1b1c5b4cfc517ed884cad24e4a709d31b935ea49dab45ff60d31a62f4cb86ee
      PRINTGUARD_IMAGE: ghcr.io/oliverbravery/printguard:2.6.5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install compose-generator dependencies
        run: python -m pip install Pillow ruamel.yaml

      - name: Generate compose and JPEG fixture
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="${{ runner.temp }}/provider-inference"
          mkdir -p "$probe_dir"
          bash scripts/docker/compose-generator.sh \
            --output-dir "$probe_dir/compose" \
            --include-obico-ml \
            --include-printguard
          cat > "$probe_dir/ports.override.yml" <<'YAML'
          services:
            obico-ml-api:
              command: ["bash", "-c", "gunicorn --bind 0.0.0.0:3333 --workers 1 --timeout 120 wsgi"]
              ports:
                - "127.0.0.1:3333:3333"
              extra_hosts:
                - "host.docker.internal:host-gateway"
            printguard:
              ports:
                - "127.0.0.1:8000:8000"
          YAML
          python - "$probe_dir/frame.jpg" <<'PY'
          from PIL import Image
          import sys

          Image.new("RGB", (64, 64), (128, 128, 128)).save(sys.argv[1], format="JPEG", quality=90)
          PY
          echo "PROVIDER_PROBE_DIR=$probe_dir" >> "$GITHUB_ENV"
          echo "PROVIDER_PROBE_SNAPSHOT_URL=http://host.docker.internal:8765/frame.jpg" >> "$GITHUB_ENV"
          echo "PROVIDER_PROBE_SNAPSHOT_LOCAL_URL=http://127.0.0.1:8765/frame.jpg" >> "$GITHUB_ENV"
          echo "PROVIDER_PROBE_COMPOSE=$probe_dir/compose/docker-compose.yml" >> "$GITHUB_ENV"
          echo "PROVIDER_PROBE_OVERRIDE=$probe_dir/ports.override.yml" >> "$GITHUB_ENV"
          echo "PROVIDER_PROBE_IMAGE=$probe_dir/frame.jpg" >> "$GITHUB_ENV"

      - name: Isolate generated provider services
        shell: bash
        run: |
          set -euo pipefail
          source_compose="$PROVIDER_PROBE_COMPOSE"
          provider_compose="$PROVIDER_PROBE_DIR/providers.compose.yml"
          python - "$source_compose" "$provider_compose" <<'PY'
          import sys
          from ruamel.yaml import YAML
          from ruamel.yaml.comments import CommentedMap

          source_path, output_path = sys.argv[1:]
          yaml = YAML()
          yaml.preserve_quotes = True
          with open(source_path, encoding="utf-8") as source:
              compose = yaml.load(source)

          services = compose.get("services", {})
          selected = {"obico-ml-api", "printguard"}
          missing = selected - set(services)
          if missing:
              raise SystemExit(f"Generated Compose is missing provider services: {sorted(missing)}")

          pending = list(selected)
          while pending:
              service_name = pending.pop()
              dependencies = services[service_name].get("depends_on", {})
              if isinstance(dependencies, dict):
                  dependencies = dependencies.keys()
              for dependency in dependencies:
                  if dependency not in services:
                      raise SystemExit(
                          f"Provider service {service_name} depends on missing service {dependency}"
                      )
                  if dependency not in selected:
                      selected.add(dependency)
                      pending.append(dependency)

          network_names = set()
          volume_names = set()
          for service_name in selected:
              service = services[service_name]
              networks = service.get("networks", [])
              network_names.update(networks.keys() if isinstance(networks, dict) else networks)
              for mount in service.get("volumes", []):
                  if isinstance(mount, str):
                      name = mount.split(":", 1)[0]
                  elif isinstance(mount, dict) and mount.get("type") == "volume":
                      name = mount.get("source")
                  else:
                      continue
                  if name:
                      volume_names.add(name)

          result = CommentedMap()
          for key in ("version", "name"):
              if key in compose:
                  result[key] = compose[key]
          result["services"] = CommentedMap(
              (name, services[name]) for name in services if name in selected
          )
          for section, names in (("networks", network_names), ("volumes", volume_names)):
              definitions = compose.get(section, {})
              absent = names - set(definitions)
              if absent:
                  raise SystemExit(
                      f"Generated provider services reference undefined {section}: {sorted(absent)}"
                  )
              if names:
                  result[section] = CommentedMap(
                      (name, definitions[name]) for name in definitions if name in names
                  )

          with open(output_path, "w", encoding="utf-8") as output:
              yaml.dump(result, output)
          PY
          echo "PROVIDER_PROBE_COMPOSE=$provider_compose" >> "$GITHUB_ENV"

      - name: Serve synthetic camera snapshot to provider network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 \
            --bind 0.0.0.0 \
            --directory "$PROVIDER_PROBE_DIR" \
            > "$PROVIDER_PROBE_DIR/snapshot-fixture.log" 2>&1 &
          echo "$!" > "$PROVIDER_PROBE_DIR/snapshot-fixture.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PROVIDER_PROBE_SNAPSHOT_LOCAL_URL" \
              --output "$PROVIDER_PROBE_DIR/snapshot-served.jpg"; then
              cmp "$PROVIDER_PROBE_IMAGE" "$PROVIDER_PROBE_DIR/snapshot-served.jpg"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Synthetic camera snapshot server did not become ready."
          cat "$PROVIDER_PROBE_DIR/snapshot-fixture.log"
          exit 1

      - name: Pull provider images and record immutable image identities
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f "$PROVIDER_PROBE_COMPOSE" \
            -f "$PROVIDER_PROBE_OVERRIDE" \
            pull obico-ml-api printguard
          {
            echo "Compose version: $(docker compose version --short)"
            docker image inspect --format='{{.RepoTags}} {{.Id}} {{.RepoDigests}}' \
              "$OBICO_ML_IMAGE"
            docker image inspect --format='{{.RepoTags}} {{.Id}} {{.RepoDigests}}' \
              ghcr.io/oliverbravery/printguard:2.6.5
          } | tee "$PROVIDER_PROBE_DIR/image-identities.txt"

      - name: Start provider containers
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f "$PROVIDER_PROBE_COMPOSE" \
            -f "$PROVIDER_PROBE_OVERRIDE" \
            up -d obico-ml-api printguard
          for container in printfarmer-obico-ml-api printfarmer-printguard; do
            ready=false
            for attempt in $(seq 1 180); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [ "$status" = healthy ]; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "::error::Provider container $container did not become healthy (last status: ${status:-unknown})."
              docker compose -f "$PROVIDER_PROBE_COMPOSE" -f "$PROVIDER_PROBE_OVERRIDE" ps
              docker inspect --format='{{json .State.Health}}' "$container" \
                | tee "$PROVIDER_PROBE_DIR/${container}-health.json" || true
              docker compose -f "$PROVIDER_PROBE_COMPOSE" -f "$PROVIDER_PROBE_OVERRIDE" logs --no-color
              exit 1
            fi
          done

      - name: Add temporary live-inference test
        shell: bash
        run: |
          cat > src/tests/Farm.Infrastructure.Tests/HostedProviderInferenceTests.cs <<'CS'
          using System.Text.Json;
          using Farm.Infrastructure.Services.Cameras;
          using Farm.Infrastructure.Services.FailureDetection;
          using Farm.Infrastructure.Settings;
          using FluentAssertions;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.Logging;
          using Microsoft.Extensions.Logging.Abstractions;
          using Moq;
          using Xunit;
          using Xunit.Abstractions;

          namespace Farm.Infrastructure.Tests;

          public sealed class HostedProviderInferenceTests(ITestOutputHelper output)
          {
              [Fact]
              public async Task HostedProviders_ReturnLiveInferenceForEachProviderAndCombinedMode()
              {
                  byte[] image = await File.ReadAllBytesAsync(
                      Environment.GetEnvironmentVariable("PROVIDER_PROBE_IMAGE")
                      ?? throw new InvalidOperationException("PROVIDER_PROBE_IMAGE is not set."));
                  string snapshotUrl = Environment.GetEnvironmentVariable("PROVIDER_PROBE_SNAPSHOT_URL")
                      ?? throw new InvalidOperationException("PROVIDER_PROBE_SNAPSHOT_URL is not set.");
                  using ServiceProvider services = new ServiceCollection()
                      .AddHttpClient()
                      .BuildServiceProvider();
                  IHttpClientFactory clients = services.GetRequiredService<IHttpClientFactory>();

                  Mock<ISettingsService> settings = new(MockBehavior.Strict);
                  settings.Setup(item => item.Get<ObicoSettings>())
                      .Returns(new ObicoSettings
                      {
                          ObicoApiUrl = "http://127.0.0.1:3333",
                          ConfidenceThreshold = 0.7m,
                          AnalysisTimeoutSeconds = 60,
                      });
                  Mock<ICameraSnapshotCaptureService> snapshots = new(MockBehavior.Strict);
                  ObicoFailureDetectionService obico = new(
                      clients,
                      settings.Object,
                      NullLogger<ObicoFailureDetectionService>.Instance,
                      snapshots.Object);
                  PrintGuardFailureDetectionProvider printGuard = new(
                      clients,
                      NullLogger<PrintGuardFailureDetectionProvider>.Instance);

                  FailureDetectionProviderResult obicoResult = await obico.AnalyzeAsync(
                      new FailureDetectionProviderRequest(
                          image,
                          "http://127.0.0.1:3333",
                          SnapshotUrl: snapshotUrl));
                  FailureDetectionProviderResult printGuardResult = await printGuard.AnalyzeAsync(
                      new FailureDetectionProviderRequest(image, "http://127.0.0.1:8000/api/v1/classify"));

                  output.WriteLine("PROVIDER_RESULT " + JsonSerializer.Serialize(new { mode = "obico", result = obicoResult }));
                  output.WriteLine("PROVIDER_RESULT " + JsonSerializer.Serialize(new { mode = "printguard", result = printGuardResult }));
                  output.WriteLine("PROVIDER_RESULT " + JsonSerializer.Serialize(new
                  {
                      mode = "combined",
                      obico = obicoResult,
                      printguard = printGuardResult,
                  }));

                  obicoResult.ErrorMessage.Should().BeNull();
                  obicoResult.Score.Should().BeInRange(0m, 1m);
                  printGuardResult.ErrorMessage.Should().BeNull();
                  printGuardResult.Score.Should().BeInRange(0m, 1m);
              }
          }
          CS

      - name: Restore and run live inference
        working-directory: src
        env:
          PROVIDER_PROBE_IMAGE: ${{ runner.temp }}/provider-inference/frame.jpg
          PROVIDER_PROBE_SNAPSHOT_URL: http://host.docker.internal:8765/frame.jpg
        run: |
          dotnet restore ./tests/Farm.Infrastructure.Tests/Farm.Infrastructure.Tests.csproj
          dotnet test ./tests/Farm.Infrastructure.Tests/Farm.Infrastructure.Tests.csproj \
            -c Debug \
            --no-restore \
            --filter FullyQualifiedName~HostedProviderInferenceTests \
            --logger "console;verbosity=detailed"

      - name: Capture provider logs
        if: always()
        shell: bash
        run: |
          if [ -f "$PROVIDER_PROBE_COMPOSE" ]; then
            if [ -f "$PROVIDER_PROBE_DIR/snapshot-fixture.pid" ]; then
              kill "$(cat "$PROVIDER_PROBE_DIR/snapshot-fixture.pid")" 2>/dev/null || true
            fi
            docker compose \
              -f "$PROVIDER_PROBE_COMPOSE" \
              -f "$PROVIDER_PROBE_OVERRIDE" \
              logs --no-color > "$PROVIDER_PROBE_DIR/provider-logs.txt" 2>&1 || true
            for container in printfarmer-obico-ml-api printfarmer-printguard; do
              docker inspect --format='{{json .State.Health}}' "$container" \
                >> "$PROVIDER_PROBE_DIR/container-health.json" 2>&1 || true
            done
          fi

      - name: Upload provider inference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-inference-evidence
          path: ${{ runner.temp }}/provider-inference/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop provider containers
        if: always()
        shell: bash
        run: |
          if [ -f "$PROVIDER_PROBE_COMPOSE" ]; then
            docker compose \
              -f "$PROVIDER_PROBE_COMPOSE" \
              -f "$PROVIDER_PROBE_OVERRIDE" \
              down --volumes --remove-orphans || true
          fi
