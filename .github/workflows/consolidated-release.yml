name: Consolidated Release
run-name: Release ${{ inputs.version }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable uses main; insider uses development
        type: choice
        options: [stable, insider]
        default: insider
        required: true
      version:
        description: X.Y.Z or X.Y.Z-insider.N; base must match selected-source VERSION
        type: string
        required: true
      source_sha:
        description: Optional full channel-branch ancestor SHA; blank pins current HEAD
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: server-release
  cancel-in-progress: false

env:
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE }}

jobs:
  select:
    name: Check owner, version and source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - name: Check manual authority and reject used versions
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publish-release.mjs select

  checks:
    name: Check selected source
    needs: select
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release_qualification: true
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ inputs.channel == 'stable' && 'main' || 'development' }}

  build:
    name: Build containers and release evidence
    needs: [select, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ needs.select.outputs.environment }}
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SELECTED_SOURCE: ${{ needs.select.outputs.source_sha }}
      RELEASE_PUBLICATION_ENVIRONMENT: ${{ needs.select.outputs.environment }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout pinned application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          dotnet-version: '10.0.x'
      - name: Recheck owner and protected route before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publish-release.mjs select
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_REGISTRY_USER }}
          password: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
      - name: Build and verify all six images by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publish-release.mjs build
      - name: Upload immutable unsigned release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-build-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign immutable release manifest
    needs: [select, checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.select.outputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SELECTED_SOURCE: ${{ needs.select.outputs.source_sha }}
      RELEASE_PUBLICATION_ENVIRONMENT: ${{ needs.select.outputs.environment }}
    steps:
      - name: Checkout release tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download immutable unsigned release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-build-${{ github.run_id }}
          path: release-assets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Verify owner dispatch and environment policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publish-release.mjs verify
      - name: Sign exact immutable manifest
        env:
          MANIFEST: release-assets/update-manifest.json
          BUNDLE: signed-release/update-manifest.sigstore.json
          EXPECTED_IDENTITY_REF: ${{ inputs.channel == 'stable' && 'main' || 'development' }}
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/consolidated-release.yml@refs/heads/${{ inputs.channel == 'stable' && 'main' || 'development' }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/consolidated-release.yml@refs/heads/${EXPECTED_IDENTITY_REF}"
          mkdir -p signed-release
          sha256sum "$MANIFEST" > signed-release/update-manifest.sha256
          cosign sign-blob --yes --bundle "$BUNDLE" "$MANIFEST"
          cosign verify-blob --bundle "$BUNDLE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$EXPECTED_IDENTITY" "$MANIFEST"
      - name: Upload immutable signature evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-signature-${{ github.run_id }}
          path: signed-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified release
    needs: [select, checks, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.select.outputs.environment }}
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SELECTED_SOURCE: ${{ needs.select.outputs.source_sha }}
      RELEASE_PUBLICATION_ENVIRONMENT: ${{ needs.select.outputs.environment }}
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - name: Checkout release tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download immutable unsigned release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-build-${{ github.run_id }}
          path: release-assets
      - name: Download immutable signature evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-signature-${{ github.run_id }}
          path: signed-release
      - name: Bind signature to exact manifest bytes
        run: |
          set -euo pipefail
          sha256sum --check signed-release/update-manifest.sha256
          cp signed-release/update-manifest.sigstore.json release-assets/update-manifest.sigstore.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Verify owner dispatch immediately before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publish-release.mjs verify
      - name: Obtain approved publisher token after verification
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          owner: OlyForge3D
          repositories: PrintFarmer
          app-id: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read
          permission-administration: read
          permission-workflows: write
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_REGISTRY_USER }}
          password: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      - name: Publish version tags, assets and release notes last
        id: publish
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: node scripts/ci/publish-release.mjs publish
      - name: Retain build results for diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-publish-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: Release result
    if: always()
    needs: [select, checks, build, sign, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report actual publication result
        env:
          SOURCE: ${{ needs.select.outputs.source_sha }}
          CHECKS: ${{ needs.checks.result }}
          RESULT: ${{ needs.publish.result }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
        run: |
          {
            echo "## Server release"
            printf -- '- Version/channel: `%s` / `%s`\n' "$RELEASE_VERSION" "$RELEASE_CHANNEL"
            printf -- '- Source: `%s`\n- Checks: `%s`\n- Publisher: `%s`\n' "$SOURCE" "$CHECKS" "$RESULT"
            if [ "$RESULT" = success ] && [ -n "$RELEASE_URL" ]; then
              printf -- '- Published: %s\n' "$RELEASE_URL"
            else
              echo '- Not confirmed complete. Inspect failed steps and retained artifacts.'
              echo '- Partial images, tags, aliases or a draft may remain. Never overwrite/delete them.'
              echo '- Start a fresh dispatch; if the version tag exists, choose a new version.'
            fi
            echo '- Publication does not authorize installation or managed updates.'
          } >> "$GITHUB_STEP_SUMMARY"
