name: Consolidated Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (not installation enrollment)
        type: choice
        options: [stable, insider]
        default: stable
        required: true
      stage:
        description: Insider stage; choose none for stable
        type: choice
        options: [none, insider, beta, rc]
        default: none
      version:
        description: Optional exact tag assertion; N is allocated, never caller-selected
        type: string
  schedule:
    - cron: '27 9 * * *'

permissions:
  contents: read

env:
  RELEASE_PUBLISHER_APP_ID: ${{ vars.RELEASE_PUBLISHER_APP_ID }}

concurrency:
  group: release-${{ inputs.channel || 'insider' }}
  cancel-in-progress: false

jobs:
  schedule-insider:
    if: github.event_name == 'schedule' && github.repository == 'OlyForge3D/PrintFarmer'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the same authority on development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run consolidated-release.yml --repo "$GITHUB_REPOSITORY" \
            --ref development -f channel=insider -f stage=insider

  admit:
    if: github.event_name != 'schedule'
    name: Read-only release admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
      channel: ${{ steps.admit.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Admit exact canonical branch HEAD
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
        run: node scripts/ci/release-control.mjs admit

  authorize:
    name: Reserve and authorize immutable source
    needs: admit
    runs-on: ubuntu-latest
    environment: release-${{ needs.admit.outputs.channel }}
    permissions:
      contents: read
      id-token: write
    outputs:
      identity: ${{ steps.authorize.outputs.identity }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check sole authored version base
        run: bash scripts/sync-monorepo-version.sh --check
      - name: Require owner-provisioned registry authority before reservation
        env:
          REGISTRY_USER: ${{ vars.RELEASE_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_USER" && test -n "$REGISTRY_TOKEN"
      - name: Obtain protected publisher app token
        id: publisher
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
          permission-checks: read
          permission-administration: read
          permission-actions: read
      - name: Reserve sequence before source tag
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_LEDGER_ANCHOR: ${{ vars.RELEASE_LEDGER_ANCHOR }}
        run: node scripts/ci/release-control.mjs authorize
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign immutable source and App-verified protection evidence
        run: |
          cosign sign-blob --yes --bundle release-identity.bundle.json release-identity.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-authorization-${{ github.run_attempt }}
          path: |
            release-identity.json
            release-identity.bundle.json
          if-no-files-found: error

  publish:
    needs: authorize
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      actions: write
      contents: read
      packages: read
      id-token: write
    with:
      identity: ${{ needs.authorize.outputs.identity }}
    secrets: inherit
