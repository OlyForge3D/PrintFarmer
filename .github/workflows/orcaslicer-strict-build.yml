name: OrcaSlicer Strict Build

# Manual dispatch only. This workflow previously ran on push/PR changes to specific paths.
# We keep the workflow file for historical and manual use but make it manual-only and add
# a double-guard (repo var + workflow input) so it remains effectively disabled by default.
on:
  workflow_dispatch:
    inputs:
      disable_slicer_builds:
        description: 'Set to true to skip the Orca strict build when dispatching manually'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  build-orcaslicer-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        orca_version: ["2.3.2"]
        allow_stub: [false] # Can extend later with true for a soft-mode build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check dispatch input (disable_slicer_builds)
        id: check
        run: |
          # Only honor the workflow_dispatch input. Default is 'true' so manual dispatch will skip by default.
          SKIP=false
          INPUT_VAL="${{ github.event.inputs.disable_slicer_builds || 'true' }}"
          if [ "${INPUT_VAL}" = 'true' ] || [ "${INPUT_VAL}" = '1' ]; then
            SKIP=true
          fi
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Set up QEMU (optional for multi-arch)
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Attempt to download preseeded Orca AppImage artifact
        if: steps.check.outputs.skip != 'true'
        id: preseed
        run: |
          set -e
          ART_NAME=orca-appimage-${{ matrix.orca_version }}.AppImage
          echo "Looking for artifact $ART_NAME in previous artifact storage (if available)"
          if curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | jq -r '.artifacts[].name' | grep -q "orca-appimage-${{ matrix.orca_version }}"; then
            echo "Found artifact listing entry; attempting to download via actions/download-artifact"
            mkdir -p preseed || true
            echo "No direct download implemented; skipping automated artifact download in this runner."
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build OrcaSlicer Worker (strict real binary)
        if: steps.check.outputs.skip != 'true'
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHA='${{ github.sha }}'
          TAG=''
          TOKEN='${{ secrets.GITHUB_TOKEN }}'
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG='${{ github.event.release.tag_name }}'
            RELEASE_BODY='${{ github.event.release.body }}'
          elif echo "${GITHUB_REF:-}" | grep -q '^refs/tags/'; then
            TAG=${GITHUB_REF#refs/tags/}
            RELEASE_BODY=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/tags/$TAG" | jq -r '.body // ""' 2>/dev/null || true)
          else
            RELEASE_BODY=''
          fi
          RELEASE_BODY_SANITIZED=$(printf "%s" "$RELEASE_BODY" | tr '\n' ' ' | sed 's/"/'"'"'/g' | cut -c1-1000)

          echo "Building OrcaSlicer worker version=${{ matrix.orca_version }} ALLOW_STUB=${{ matrix.allow_stub }} using Dockerfile.multistage"
          if [ "${{ steps.preseed.outputs.found }}" = "true" ] && [ -f preseed/orca.AppImage ]; then
            echo "Using preseeded orca.AppImage via buildkit secret"
            docker build --platform linux/amd64 --secret id=orca,src=preseed/orca.AppImage \
              --build-arg ORCASLICER_VERSION=${{ matrix.orca_version }} --build-arg ALLOW_STUB=${{ matrix.allow_stub }} --build-arg GITHUB_TOKEN=${GITHUB_TOKEN} \
              --label "org.opencontainers.image.revision=${SHA}" --label "org.opencontainers.image.created=${TIMESTAMP}" \
              $( [ -n "$RELEASE_BODY_SANITIZED" ] && printf -- "--label \"org.opencontainers.image.description=%s\" " "$RELEASE_BODY_SANITIZED" || true) \
              -f Dockerfile.multistage --target orcaslicer-worker -t orcaslicer-worker:strict-${{ matrix.orca_version }} .
          else
            echo "No preseeded AppImage available; performing normal build (will attempt remote download)"
            docker build --platform linux/amd64 --build-arg ORCASLICER_VERSION=${{ matrix.orca_version }} --build-arg ALLOW_STUB=${{ matrix.allow_stub }} --build-arg GITHUB_TOKEN=${GITHUB_TOKEN} \
              --label "org.opencontainers.image.revision=${SHA}" --label "org.opencontainers.image.created=${TIMESTAMP}" \
              $( [ -n "$RELEASE_BODY_SANITIZED" ] && printf -- "--label \"org.opencontainers.image.description=%s\" " "$RELEASE_BODY_SANITIZED" || true) \
              -f Dockerfile.multistage --target orcaslicer-worker -t orcaslicer-worker:strict-${{ matrix.orca_version }} .
          fi

      - name: Run verification (require-real)
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x scripts/verify-orcaslicer-worker.sh
          docker run -d --name orca-test-${{ matrix.orca_version }} orcaslicer-worker:strict-${{ matrix.orca_version }}
          sleep 6
          scripts/verify-orcaslicer-worker.sh require-real

      - name: Show logs on failure
        if: steps.check.outputs.skip != 'true' && failure()
        run: |
          echo '--- Container Logs ---'
          docker logs orca-test-${{ matrix.orca_version }} || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f orca-test-${{ matrix.orca_version }} || true
          docker image rm orcaslicer-worker:strict-${{ matrix.orca_version }} || true
