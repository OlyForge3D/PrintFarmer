name: Consume normalized release authorization
description: Verify this attempt's public-readable signed policy attestation before emitting public metadata
outputs:
  frontend_identity:
    value: ${{ steps.consume.outputs.frontend_identity }}
    description: Allow-listed Vite identity with the canonical allocation key
  version:
    value: ${{ steps.consume.outputs.version }}
    description: Canonical source tag
  container_version:
    value: ${{ steps.consume.outputs.container_version }}
    description: Canonical container version
  channel:
    value: ${{ steps.consume.outputs.channel }}
    description: Release channel
  identity_hash:
    value: ${{ steps.consume.outputs.identity_hash }}
    description: Full authorization SHA256
  source_archive_url:
    value: ${{ steps.consume.outputs.source_archive_url }}
    description: Public source archive
  sbom_url:
    value: ${{ steps.consume.outputs.sbom_url }}
    description: Public SBOM
runs:
  using: composite
  steps:
    - name: Recover the earliest immutable authorization for this run
      shell: bash
      run: |
        set -euo pipefail
        artifact_name="$(
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] |
              select(.expired == false and (.name | test("^release-authorization-[1-9][0-9]*$")))] |
              sort_by(.created_at) | .[0].name // empty'
        )"
        [[ "$artifact_name" =~ ^release-authorization-[1-9][0-9]*$ ]]
        rm -rf .artifacts/release-authorization
        gh run download "$GITHUB_RUN_ID" \
          --name "$artifact_name" \
          --dir .artifacts/release-authorization
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
    - id: consume
      shell: bash
      run: |
        set -euo pipefail
        chmod 700 .artifacts/release-authorization
        chmod 600 .artifacts/release-authorization/*
        node .release-control/scripts/ci/release-control.mjs consume
