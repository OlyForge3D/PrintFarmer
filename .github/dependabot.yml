version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src/Web/ReactApp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      # Dependency families below ship as strongly versioned sets. Bumping one
      # member without the rest produces CS1705 assembly version conflicts, so
      # each family must move as a single unit.
      #
      # Order matters: a package joins the FIRST group whose patterns match it.
      entity-framework-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
          - "Microsoft.Data.Sqlite*"
          - "Npgsql*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions*"
        exclude-patterns:
          # Already covered by the entity-framework-core group above.
          - "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
