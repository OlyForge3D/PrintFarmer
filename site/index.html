<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrintFarmer</title>
  <meta name="description" content="PrintFarmer — open-source, self-hosted 3D-printer farm management.">
  <link rel="canonical" href="https://olyforge3d.github.io/PrintFarmer/">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1b1f23;
      --bg: #ffffff;
      --muted: #4b5563;
      --accent: #0b5fff;
      --border: #d7dbe0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6e8eb;
        --bg: #14161a;
        --muted: #aab0b8;
        --accent: #6fa8ff;
        --border: #30343a;
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    a {
      color: var(--accent);
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 0.25rem;
    }

    p {
      color: var(--muted);
    }

    ul {
      padding-left: 1.25rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>PrintFarmer</h1>
    <p>Open-source, self-hosted 3D-printer farm management.</p>
    <ul>
      <li><a href="privacy/">Privacy Policy</a></li>
      <li><a href="https://github.com/OlyForge3D/PrintFarmer">Source code on GitHub</a></li>
    </ul>
  </main>
</body>
</html>
