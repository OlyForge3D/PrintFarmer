# Dive Configuration for CI Image Efficiency Analysis
# Enforces image layer optimization and waste reduction for slicer worker containers.
# See: https://github.com/wagoodman/dive

rules:
  # Space Efficiency: Percentage of image space that is NOT wasted
  # Wasted space includes duplicate files, cache artifacts, and unnecessary layers
  lowestEfficiency: 0.85  # Require at least 85% efficiency (15% waste tolerance)
  
  # Human readable byte count
  highestWastedBytes: 100MB  # Maximum 100MB of wasted space allowed
  
  # Human readable byte count for user-added files (excluding base image)
  highestUserWastedPercent: 0.20  # User-added layers can waste max 20%

# CI behavior
ci:
  # Exit with non-zero code if rules are violated
  # Set to 'false' initially to gather baseline metrics without blocking builds
  fail-on-wasted-bytes: false
